å platsen. Birgitta och Bertil är pensionärer som bor i ett mycket stort hus. Huset ger plats åt barn och barnbarn som kommer på middag och stannar över natten."],"en":["Kim and his girlfriend choose a central location despite their flat's small size. They value transport and shopping nearby, but the expense, crowding and noise disputes make a detached house appealing. Alex enjoys the ease of living with his parents and imagines a movable luxury home on a boat. Retired couple Birgitta and Bertil use their large house to bring children and grandchildren together for meals and overnight visits."]},{"ti":"Vår hälsa är vårt eget ansvar","c":1,"sv":["Ett foruminlägg argumenterar för rörelse och goda matvanor. Skribenten menar att människor känner till mycket om hälsa, men inte alltid omsätter kunskapen i handling. Brist på tid, pengar, motivation eller kunskap presenteras som möjliga förklaringar. Huvudbudskapet är att små vardagliga val kan vara en början, till exempel att gå i trappor eller välja en träningsform som man uppskattar.","Läs rubriken som skribentens ståndpunkt. I en nyanserad diskussion kan du säga att vanor spelar roll och samtidigt nämna livsvillkor och tillgång till stöd. Kapitlet tränar språk för att tala om hälsa. Personernas påståenden är inte individuella medicinska bedömningar."],"en":["A forum writer argues for physical activity and balanced eating. People may know a great deal about health without acting on that knowledge. Time, money, motivation and knowledge are presented as possible barriers. The main argument is that modest everyday changes can be a starting point, and enjoyable activity is easier to sustain.","Read the title as the writer's position. For a balanced discussion you can agree that habits matter while adding that living conditions and access to support also matter. This chapter teaches language for discussing health; the characters' claims are not individual medical assessments."]},{"ti":"Marvins viktiga val","c":1,"sv":["Silvana kommer hem och hittar Marvin i soffan med chips och öl. Hon är orolig för hans hälsa och tar upp att han klagar på rygg och knän. Marvin hänvisar till ålder, trötthet och tidsbrist. Silvana föreslår små förändringar: tänka på maten, minska ölen på vardagar, gå ut med hunden, ta trapporna och simma. Till slut väljer Marvin att gå en promenad och Silvana följer med. Slutet visar en första handling, inte att alla problem redan är lösta."],"en":["Silvana finds Marvin relaxing with crisps and beer. Concerned about his health and recurring complaints of pain, she urges him to change his habits. He points to age, exhaustion and lack of time. Her suggestions are manageable daily changes involving food, walking, stairs and swimming. He eventually gets up to walk the dog, and she joins him. The ending shows an initial decision to act."]},{"ti":"Den viktiga fritiden","c":2,"sv":["Texten beskriver fritid som en möjlighet att återhämta sig, få ny energi och må bättre. Arbetet kan ta kraft, och därför behöver man ibland koppla bort det. Människor vilar på olika sätt: några vill vara ensamma, andra vill umgås. Att resa och att sitta stilla med en bok kan fylla samma funktion. Den gemensamma nämnaren är välbefinnande, inte en viss aktivitet."],"en":["The text presents leisure as a way to recover, regain energy and feel better. People need a break from work's demands. Some recharge alone, others through company. A trip and a quiet evening with a book can serve the same purpose. The shared aim is wellbeing rather than a particular activity."]},{"ti":"Vad gör du när du är ledig","c":2,"sv":["Sascha arbetar som kock och Rimona på ett lager. Båda längtar efter semester eftersom helgerna känns för korta. Sascha vill slippa planera och prestera. Hon undviker jobbmejl och låter lusten styra dagen. Rimona vill däremot planera sin semester noggrant. Hon reser med två väninnor, och de delar på bokningar och aktiviteter. De turas om att ha olika ansvar. Båda söker återhämtning, men deras metoder är olika."],"en":["Sascha, a chef, and Rimona, a warehouse worker, both look forward to a longer holiday. Sascha wants freedom from schedules and performance. She avoids work messages and follows her inclinations. Rimona enjoys carefully organised travel with two friends. They distribute responsibilities and rotate them each year. Both seek rest, using different approaches."]},{"ti":"Att lyckas i skolan","c":4,"sv":["En engagerad förälder menar att en lyckad skolgång är ett gemensamt ansvar. Föräldrar hoppas att barnen ska lära sig, få vänner, uppnå goda resultat och så småningom klara sig självständigt i samhället. Barn börjar ofta skolan med stolthet och entusiasm. För vissa minskar intresset och lektionerna börjar kännas tråkiga. Skribenten frågar hur förändringen uppstår i stället för att genast lägga skulden på en person.","Tre insatser är viktiga. Lärare behöver anpassa undervisningen till elevernas nivåer och förutsättningar. Föräldrar behöver bry sig och visa ett aktivt intresse. Elever behöver anstränga sig och ta ansvar för sitt eget beteende. Dåligt anpassad undervisning och likgiltiga föräldrar kan skapa motstånd. Skillnaden mellan att befalla ett barn att göra läxorna och att erbjuda sig att göra dem tillsammans visar hur stödet kan påverka motivationen. Slutsatsen är samarbete, där både strukturerad undervisning och elevens egna insatser ingår.","Lässtrategi: hitta frågan i rubriken, de tre parterna och slutsatsen. \"Många faktorer\" visar att förklaringen är komplex. \"Däremot\" markerar en motsats, \"därför\" en följd och \"sist men inte minst\" en viktig sista punkt. Ett starkt svar förklarar hur en faktor påverkar skolgången i stället för att bara räkna upp \"föräldrar, lärare, elever\"."],"en":["An engaged parent argues that successful schooling is a shared responsibility. Parents hope that their children will learn, make friends, achieve good results, and eventually manage independently in society. Children often begin school feeling proud and enthusiastic. For some, enthusiasm fades and lessons start to feel boring. The writer asks how this change happens rather than blaming one person immediately.","Three contributions matter. Teachers need to adapt lessons to pupils' levels and circumstances. Parents need to care and take an active interest. Pupils need to make an effort and take responsibility for their own behaviour. Poorly adapted teaching and indifferent parents can create resistance. The contrast between ordering a child to do homework and offering to do it together illustrates how the tone of support can affect motivation. The conclusion is cooperation, with structured teaching and the pupil's own effort included.","Reading strategy: identify the question in the title, the three parties, and the final conclusion. \"Många faktorer\" signals a complex explanation. \"Däremot\" introduces a contrast; \"därför\" marks a consequence; \"sist men inte minst\" adds an important final point. A strong answer explains how a factor matters instead of merely listing \"parents, teachers, pupils\"."]},{"ti":"Från misslyckad till lyckad","c":4,"sv":["Läraren Peter Dahlkvist ser tillbaka på en ojämn skolgång. Första dagen var spännande eftersom den visade att han hade blivit stor, men skrämmande eftersom allt kändes allvarligt och ovant. Lågstadiet gick bra, intresset började minska på mellanstadiet och försvann på högstadiet. Han klarade början av gymnasiet med nöd och näppe. Han kopplar svårigheterna delvis till föräldrarnas skilsmässa när han var tio, ensamhet och begränsat stöd direkt efteråt.","Peter skiljer mellan att kunna ett ämne och att kunna undervisa i det. En bra lärare hjälper eleverna att lära sig hur man lär sig, motiverar dem och stärker deras tro på den egna förmågan. Situationen vände halvvägs genom gymnasiet. Han klarade proven och fick goda betyg. I efterhand lyfter han fram sitt eget arbete, bra lärare och föräldrarnas senare uppmuntran. Berättelsen visar att en svår början inte avgör slutet. Den säger inte att alla elever med svårigheter har samma familjesituation."],"en":["Teacher Peter Dahlkvist looks back on an uneven school journey. His first day was exciting because it showed he was growing up, but frightening because everything felt serious and unfamiliar. Years 1–3 went well; interest began to fade in years 4–6 and disappeared in years 7–9. He barely managed the beginning of upper secondary school. He connects his difficulties partly with his parents' divorce when he was ten, loneliness, and limited support immediately afterwards.","Peter distinguishes knowing a subject from being able to teach it. A good teacher helps pupils learn how to learn, motivates them, and helps them believe in their own ability. His situation improved halfway through upper secondary school; he passed tests and received good grades. Looking back, he credits his own work, helpful teachers, and his parents' later encouragement. His story shows that a difficult beginning does not determine the ending. It does not claim that every struggling pupil has the same family circumstances."]},{"ti":"Pengar som medel och mål","c":5,"sv":["Insändaren beskriver pengar som ett praktiskt medel för att leva tryggt. En stabil ekonomi gör det lättare att hantera oväntade händelser och täcka grundläggande kostnader. Pengar kan samtidigt skapa konflikter om de styr alla val och blir livets centrum. Rubriken frågar om pengar är ett verktyg eller ett mål i sig. Skribenten förespråkar att använda dem som ett verktyg.","Inkomster betalar bostad, mat, räkningar och andra utgifter. Texten nämner hyra, el, värme, vatten och internet samt mat och nöjen. Den kritiserar onödiga inköp och avslutar med ett ordspråk som betyder att anpassa utgifterna till inkomsterna. Det är skribentens argument: att någon lånar till mat bevisar inte i sig att personen slösar. Skilj mellan vad skribenten säger och din egen bedömning när du svarar på en läsfråga."],"en":["The letter to the editor presents money as a useful means to live securely. Stable finances make it easier to handle unexpected events and cover basic costs. However, money can create conflict if it controls every choice and becomes the centre of life. The title asks whether money is a tool or an end in itself. The writer favours using it as a tool.","Income pays for housing, food, bills and other expenses. The text lists rent, electricity, heating, water and internet, as well as food and entertainment. It criticises unnecessary spending and ends with an idiom meaning \"live within your means\". Treat this as the writer's argument: the fact that someone borrows for food does not by itself prove wastefulness. In a reading answer, distinguish what the writer says from your own evaluation."]},{"ti":"Familjen Anderssons ekonomi","c":5,"sv":["Erik och Elisabeth bor med sina tre barn i ett hus utanför Stockholm. Erik är elektriker och Elisabeth arbetar på en förskola. Berättelsen anger löner och barnbidrag och räknar sedan upp kostnader för boende, bilar, kollektivtrafik, telefoner, mat och barnens aktiviteter. När barnen behöver vinterkläder upptäcker föräldrarna att de inte har haft kontroll över utgifterna. De bestämmer sig för att lägga ihop inkomsterna, dra av utgifterna och använda en budget för att undvika oplanerade inköp.","Läs siffrorna kritiskt. Det framgår inte om lönerna är före eller efter skatt. Sophämtning, försäkringar, fredagsmys och kläder nämns utan fullständiga belopp. Därför är 21 450 kronor bara skillnaden mellan de angivna siffrorna, inte ett bekräftat disponibelt överskott. Uppgiften att de inte har råd med kläderna kan inte förklaras helt med enbart siffrorna. Lägg inte till el en gång till: den ingår redan i boendekostnaden på 15 000 kronor. Barnbidraget är en uppgift i kursens berättelse, inte ett besked om dagens nivå."],"en":["Erik and Elisabeth live with their three children in a house outside Stockholm. Erik is an electrician and Elisabeth works in a preschool. The story gives their salaries and child benefit, then lists costs for housing, cars, public transport, phones, food and children's activities. When winter clothing is needed, they discover that they have not kept track of their spending. They decide to add their income, subtract expenses, and use a budget to avoid unplanned purchases.","Read the numbers critically. The salaries are not identified as before or after tax. Rubbish collection, insurance, Friday snacks and clothing are mentioned without complete prices. Therefore 21,450 kronor is only the difference between the stated figures, not a verified disposable surplus. The text's claim that they cannot afford the clothes cannot be fully reconstructed from the numbers alone. Do not add electricity again: it is already included in the 15,000 housing figure. The child benefit figure belongs to the course story, not a statement of today's benefit level."]},{"ti":"Miljön är allas ansvar","c":6,"sv":["Katarina Svenssons argumenterande blogginlägg uppmanar läsarna att ta ansvar för naturen och kommande generationer. Det beskriver förändringar i klimat och väder, högre temperaturer, smältande isberg och överutnyttjande av resurser. Skribenten menar att privatpersoner behöver agera liksom företag och industrier. Uppmaningen är att göra vardagliga val och börja direkt.","Förslagen är bland annat att stänga kranen när man borstar tänderna, släcka onödiga lampor, byta äldre glödlampor, återanvända en tygkasse, källsortera, panta, kompostera, åka buss eller tåg och välja ekologiska eller miljömärkta produkter. Lär dig verben som handlingar du kan beskriva. Det sista uttrycket uppmanar alla att \"dra sitt strå till stacken\". Inlägget är en argumenterande kurstext. Beskriv därför de breda påståendena och produktjämförelserna som skribentens påståenden, inte som en aktuell vetenskaplig bedömning av varje situation."],"en":["Katarina Svensson's persuasive blog post urges readers to take responsibility for nature and future generations. It describes changes in climate and weather, rising temperatures, melting icebergs, and overuse of resources. The writer argues that individuals should act as well as companies and industries. The call to action is to make everyday choices and begin immediately.","The suggestions include turning off the tap while brushing your teeth, switching off unnecessary lights, replacing older bulbs, reusing a cloth bag, sorting waste, returning deposit containers, composting, travelling by bus or train, and choosing organic or eco-labelled products. Learn the verbs as actions you can describe. The final idiom asks everyone to \"do their bit\". The post is a persuasive course text; its broad claims and product comparisons should be described as the writer's claims rather than treated as a current scientific assessment of every situation."]},{"ti":"Miljö i andra sammanhang","c":6,"sv":["\"Miljö\" kan betyda omgivning, inte bara natur. Arbetsmiljö och skolmiljö omfattar ljud, säkerhet, relationer, tillgänglighet, städning och ventilation. Texten förklarar att en lugn atmosfär, respekt och tillit påverkar hur människor mår. Hörselproblem till följd av buller är ett exempel på hur omgivningen kan påverka hälsan.","Kurstexten lägger ansvar på arbetsgivaren att ordna säkra lokaler, ta hänsyn till personer med funktionsnedsättning, göra det möjligt att förflytta sig med rullstol och se till att ventilation och städning fungerar för personer med allergier. Inled gärna ett textbundet svar med \"Enligt texten\". Kapitlet ger språk för att diskutera arbetsförhållanden. Beskrivningen är inte en fullständig redogörelse för dagens arbetsmiljölagstiftning."],"en":["\"Miljö\" can mean surroundings, not only nature. A work or school environment includes noise, safety, relationships, accessibility, cleanliness and ventilation. The text explains that a calm atmosphere, respect and trust affect how people feel. It gives hearing problems from noise as an example of how surroundings can affect health.","The course text places responsibility on employers to arrange safe premises, consider people with disabilities, allow wheelchair users to move around, and make ventilation and cleanliness suitable for people with allergies. In a text-based answer, introduce these points with \"According to the text\". The chapter teaches language for discussing working conditions; its description is not a complete statement of current workplace law."]},{"ti":"Svårigheter på arbetsmarknaden","c":7,"sv":["En arbetssökandes insändare beskriver hinder som invandrare kan möta på den svenska arbetsmarknaden. Skribenten menar att utländska utbildningar och kunskaper inte alltid motsvarar de arbeten människor får. En läkare som kör taxi och en arkitekt som arbetar på lager illustrerar kompetens som inte används fullt ut. Det är textens exempel, inte en värdering att dessa arbeten saknar värde.","Kravet på erfarenhet skapar ett dilemma: hur ska någon få erfarenhet om ingen erbjuder den första möjligheten? Arbetsgivare riskerar att missa potential om de enbart fokuserar på tidigare erfarenhet. Skribenten förespråkar en välkomnande introduktion, att ta vara på kompetens som redan finns i samhället och att undvika diskriminering kopplad till språk eller namn. Arbete beskrivs som en viktig väg till integration. Jämförelsen av arbetslöshet är en uppgift i kurstexten, inte nykontrollerad statistik."],"en":["A jobseeker's letter describes barriers that immigrants can face in the Swedish labour market. The writer says that foreign qualifications and skills may not match the jobs people obtain. A doctor driving a taxi and an architect working in a warehouse illustrate underused competence. These are the text's examples, not a judgment that those jobs lack value.","The experience requirement creates a dilemma: how can someone gain experience if no one offers a first opportunity? Employers risk overlooking potential if they focus only on previous experience. The writer argues for welcoming introductions to work, using the skills already available in society, and avoiding discrimination linked to language or names. Employment is presented as an important route to integration. The unemployment comparison is a claim in the course text; it is not a newly checked statistic."]},{"ti":"Flora och vägen till drömyrket","c":7,"sv":["Den andra texten ger ett mer hoppfullt perspektiv: vissa invandrare får höga positioner eller startar framgångsrika företag, även om vägen kan vara svår. Flora flyttade från Ryssland till Sverige när hon var fyrtio på grund av kärleken. Hon hade varit engelsklärare. I Sverige lärde hon sig språket genom sfi, arbetade på olika arbetsplatser, tog hand om två barn och behöll målet att arbeta som lärare.","Hon sökte in till lärarutbildningen i Stockholm och kombinerade arbete med studier. Berättelsen slutar tjugotvå år efter hennes ankomst, när Flora arbetar som kvalificerad och legitimerad lärare i engelska och svenska som andraspråk. Hennes vilja och förmåga att ta vara på möjligheter är centrala. Det är en persons berättelse, inte en garanti för att vilja tar bort alla hinder. \"I dag\" syftar på berättelsens tid, inte nödvändigtvis det nuvarande året."],"en":["The second text adds a more hopeful perspective: some immigrants gain senior positions or build successful companies, although the path can be difficult. Flora moved from Russia to Sweden at forty because of a relationship. She had been an English teacher. In Sweden she learned the language through SFI, worked in different jobs, cared for two children, and kept her goal of teaching.","She applied to teacher education in Stockholm and combined work with study. The story ends twenty-two years after her arrival, with Flora working as a qualified, licensed teacher of English and Swedish as a second language. Her determination and use of opportunities are central. This is one person's story, not a guarantee that determination removes all barriers. \"Today\" refers to the story's narrative time, not necessarily the present year."]},{"ti":"En språklärares erfarenheter","c":9,"sv":["Texten frågar varför vissa vuxna lär sig ett nytt språk snabbt medan det tar mycket längre tid för andra. Språkinlärning beskrivs som ett krävande arbete som kräver tid, energi och tålamod. Den som vill att allt ska gå av sig självt kommer inte långt.","Ju äldre man är, desto kämpigare kan det bli. Ändå kan vuxna lyckas om de har motivation, vilja och mod. Barn lär sig ofta snabbare eftersom de inte är rädda för att säga fel. Människor lär sig också på olika sätt: vissa genom regler och övningar, andra genom samtal och vänner. Oavsett metod behövs tålamod."],"en":["The text asks why some adults learn a new language quickly while it takes others much longer. Language learning is described as demanding work that needs time, energy and patience. Anyone who wants everything to happen by itself will not get far.","The older you are, the harder it can be. Adults can still succeed if they have motivation, willingness and courage. Children often learn faster because they are not afraid of making mistakes. People also learn in different ways: some through rules and exercises, others through conversation and friends. Whatever the method, patience is needed."]},{"ti":"Olika röster om språkinlärning","c":9,"sv":["Tre personer berättar hur de lärde sig svenska. Sebastian älskar språk och ser dem som en väg in i en ny kultur och ett nytt sätt att tänka. Han tycker att sfi gav honom grunderna och att det hjälpte att öva med andra elever på samma nivå.","Nicolina gjorde inga framsteg i klassrummet. Hon lärde sig i stället på ett tillfälligt jobb, där hon vågade prata trots att hon ofta sa fel. I dag har hon sitt drömjobb. Susanne menar att alla kan lära sig, men att vuxna och barn lär sig på olika sätt. Vuxna tänker på grammatiken innan de pratar. Hennes viktigaste råd är tålamod."],"en":["Three people describe how they learned Swedish. Sebastian loves languages and sees them as a way into a new culture and a new way of thinking. He feels that sfi gave him the basics and that practising with other learners at the same level helped.","Nicolina made no progress in the classroom. Instead she learned in a temporary job, where she dared to speak even though she often got things wrong. Today she has her dream job. Susanne thinks everyone can learn, but adults and children learn differently. Adults think about grammar before they speak. Her most important advice is patience."]},{"ti":"Familjen","c":10,"sv":["Hans berättar att familjen betyder allt för honom. Tiden med frun och barnen är ovärderlig, och när de skrattar och har roligt tillsammans skapar de minnen för livet. Han varnar för att vardagens plikter kan ta över, så att man prioriterar saker i stället för människor.","Hans och hans fru har själva varit med om en sådan obalans. Nu har de bestämt att ingenting ska gå före deras relation. Stress kan leda till irritation och att man bara ser varandras brister. Därför tycker han att man ska prata öppet direkt när något bekymrar en. Hans råd är att stötta varandra, skapa minnen tillsammans och leva i nuet."],"en":["Hans says that his family means everything to him. Time with his wife and children is priceless, and when they laugh and have fun together they create lifelong memories. He warns that everyday duties can take over, so that you prioritise things instead of people.","Hans and his wife have experienced that kind of imbalance themselves. Now they have decided that nothing should come before their relationship. Stress can lead to irritation and to seeing only each other's faults. So he thinks you should talk openly straight away when something worries you. His advice is to support each other, create memories together and live in the present."]},{"ti":"Finns det en idealfamilj?","c":10,"sv":["Tre personer berättar om sin uppväxt. Daniel växte upp med sin pappa efter att mamman dog när han var liten. Senare fick han veta att pappa planerade att gifta sig med en kollega, men hon lämnade pappa för en annan man. Daniel tycker ändå att det var bra att det hände innan de gifte sig.","Miranda har två mammor och uppskattar sin familj. Hon påpekar att det för femtio år sedan hade varit olagligt, men för henne har kärleken inga gränser. Huvudsaken är att föräldrar tar ansvar för barnen. Margareta växte upp på en gård. Pappa arbetade från morgon till kväll och var sällan hemma, medan mamma alltid var närvarande, glad och kärleksfull."],"en":["Three people talk about growing up. Daniel grew up with his father after his mother died when he was small. Later he found out that his father was planning to marry a colleague, but she left him for another man. Daniel still thinks it was good that it happened before they married.","Miranda has two mothers and appreciates her family. She points out that fifty years ago it would have been illegal, but for her love has no limits. The main thing is that parents take responsibility for their children. Margareta grew up on a farm. Her father worked from morning to night and was rarely at home, while her mother was always present, cheerful and loving."]}],"L":[{"ti":"Indefinite pronouns","c":0,"en":["An indefinite pronoun refers to an unspecified person, thing or amount. Before a noun, choose the form that matches the noun's gender and number. Used alone, the form depends on what it refers to.","Någon is common in questions and negative sentences, as well as affirmative sentences when the identity is unknown: Har du någon granne? Jag har inte någon bil. Någon knackar. Några can mean a few or some, not a precise number.","Ingen already includes negation: Jag har ingen bil = Jag har inte någon bil. Do not add inte to ingen in an ordinary statement. After an auxiliary, use Jag har inte köpt någon bil. In a subordinate clause, Jag säger att jag inte har någon bil is the safest beginner pattern. Ingen can also be the subject: Ingen har ringt.","All and allt commonly accompany mass nouns: all mat, allt vatten. Alla accompanies plural count nouns: alla hus. Everyone and everything are different: Alla är här. Allt är klart. Another singular count noun normally takes en/ett: en annan lägenhet, ett annat område. Contrast the other flat: den andra lägenheten."],"sv":["Ett indefinit pronomen syftar på en obestämd person, sak eller mängd. Framför ett substantiv anpassas formen efter genus och antal. När pronomenet står ensamt beror formen på vad det syftar på.","Någon används ofta i frågor och nekande meningar, men också när personen eller saken är okänd: Har du någon granne? Jag har inte någon bil. Någon knackar. Några betyder ett obestämt mindre antal.","Ingen innehåller redan en negation. Jag har ingen bil betyder samma sak som Jag har inte någon bil. Skriv normalt inte \"Jag har inte ingen bil\". Efter hjälpverb är Jag har inte köpt någon bil en bra modell. I bisats kan du skriva Jag säger att jag inte har någon bil. Ingen kan också vara subjekt: Ingen har ringt.","All och allt står ofta med mängdord: all mat, allt vatten. Alla står med plural: alla hus. Alla är här gäller personer. Allt är klart gäller saker eller situationen som helhet. Skriv en annan lägenhet och ett annat område. Den andra lägenheten betyder en bestämd annan lägenhet."]},{"ti":"Nouns and housing descriptions","c":0,"en":["Learn each noun with its article and plural. Four forms are your basic unit: en bostad, bostaden, bostäder, bostäderna. There is no reliable rule that lets you guess every en/ett choice. Compound nouns inherit the final part's gender: ett rum → ett sovrum; en kostnad → en boendekostnad.","Bo describes residence: Jag bor i Stockholm. Leva describes being alive or a way of life: Jag lever hälsosamt. Hem means movement towards home; hemma means location: Jag går hem. Jag är hemma. Similarly, flytta hemifrån means leave the parental home."],"sv":["Lär dig varje substantiv med artikel och plural. Fyra former hör ihop: en bostad, bostaden, bostäder, bostäderna. Det går inte att gissa rätt genus för alla ord. Sammansatta ord får genus från sista delen: ett rum → ett sovrum och en kostnad → en boendekostnad.","Bo beskriver var man har sin bostad. Leva beskriver att man lever eller hur man lever. Hem anger riktning och hemma anger plats. Jämför Jag går hem och Jag är hemma. Flytta hemifrån betyder att lämna föräldrahemmet."]},{"ti":"Adjective agreement","c":1,"en":["Swedish adjectives normally agree with the noun they describe. English usually keeps the adjective unchanged. Start with stor → stort → stora and use the same decision process for other adjectives.","Ask four questions: What does the adjective describe? Is that noun en, ett or plural? Is the noun phrase definite or possessive? Is a comparison intended? Do not choose -t simply because the adjective follows a verb.","The course's -en pattern is useful for medveten and sliten, but it is not a universal rule for every spelling ending in en: ren → rent → rena. Learn actual forms. Liten changes again in definite singular: den lilla hunden; plural de små hundarna."],"sv":["Svenska adjektiv böjs normalt efter substantivet. På engelska ändras adjektivet oftast inte. Börja med stor → stort → stora och använd samma tankesätt för andra adjektiv.","Fråga: Vad beskriver adjektivet? Är ordet en, ett eller plural? Är frasen bestämd eller possessiv? Är det en jämförelse? Välj inte -t bara för att adjektivet står efter ett verb.","Kursens mönster för -en passar medveten och sliten, men gäller inte automatiskt alla ord som stavas med en på slutet: ren → rent → rena. Lär dig de faktiska formerna. Liten blir lilla i bestämd singular och små i plural."]},{"ti":"Definite and possessive adjectives","c":1,"en":["A normal definite noun phrase uses den/det/de, the adjective's weak form, and a definite noun ending: den nyttiga maten. After a possessive word or an s-genitive, use the weak adjective but the noun's indefinite form: min nyttiga mat; Silvanas nya skor.","Sin/sitt/sina refers back to the subject of the same clause: Marvin tar på sig sina skor = his own shoes. Marvin tar på sig hans skor normally refers to another man's shoes. Compare en sko → sin sko; ett glas → sitt glas; skor → sina skor. Hans/hennes/deras do not change with the noun.","You may see the masculine singular weak ending -e in sin trötte man. The more general -a is also useful: sin trötta man. This does not change the plural rule."],"sv":["En vanlig bestämd nominalfras har den/det/de, adjektivets svaga form och ett substantiv med bestämd ändelse. Efter possessivt ord eller s-genitiv används svag adjektivform men obestämt substantiv.","Sin/sitt/sina syftar tillbaka på subjektet i samma sats. Marvin tar på sig sina skor betyder hans egna skor. Hans skor syftar normalt på en annan mans skor. Välj sin, sitt eller sina efter substantivet. Hans, hennes och deras böjs inte efter substantivet.","I texten finns sin trötte man. Ändelsen -e kan användas om en man i bestämd eller svag form. Formen sin trötta man fungerar också. Pluralformen ändras inte av detta."]},{"ti":"Comparison","c":1,"en":["Positive describes a quality, comparative compares, and superlative expresses the highest or lowest degree within a context. Än introduces what you compare with: större än. Lika ... som expresses equality: lika stor som.","Most short regular adjectives take -are/-ast. Many adjectives use mer/mest, including the course's -isk examples and participles such as intresserad. Avoid treating this as a rule with no exceptions. Comparative adjectives normally do not change for gender or number: ett större hus; större hus. Superlative changes in a definite phrase: Huset är störst, but det största huset; mitt största rum.","Färst is a real Swedish form, though less common than minst antal in some contexts. The course puts it in parentheses. Use färre with countable items and mindre with amounts: färre gäster, mindre tid. De flesta means most people/items; flera often means several or more depending on context."],"sv":["Positiv anger en egenskap, komparativ jämför och superlativ anger högsta eller lägsta graden i ett sammanhang. Än används vid jämförelse. Lika ... som uttrycker samma grad.","Många regelbundna adjektiv får -are/-ast. Många andra jämförs med mer/mest, bland annat kursens exempel på -isk och particip som intresserad. Det finns undantag. Komparativ böjs normalt inte efter genus eller antal. Superlativ får en bestämd form i fraser som det största huset och mitt största rum.","Färst är en svensk form, även om minst antal ibland känns naturligare. Använd färre om antal och mindre om mängd: färre gäster, mindre tid. De flesta betyder den största delen. Flera kan betyda flera stycken eller ett större antal beroende på sammanhanget."]},{"ti":"Adjectives and adverbs","c":1,"en":["An adjective describes a noun or person: Hon är lugn; de är lugna. An adverb describes an action: Hon talar lugnt; de talar lugnt. Many adverbs look like an adjective's ett form. Compare Han är trött with Han arbetar hårt. Trötta in De går hem trötta describes the people, not how the walking is performed."],"sv":["Ett adjektiv beskriver en person eller sak. Ett adverb beskriver bland annat hur något görs. Många adverb ser ut som adjektivets t-form. Jämför Hon är lugn med Hon talar lugnt. I De går hem trötta beskriver trötta personerna."]},{"ti":"Transitive and intransitive verbs","c":2,"en":["In a transitive construction, the verb has a direct object: Rimona bokar resan. Ask \"books what?\" The answer resan is the object. In an intransitive construction, there is no direct object: Sascha vaknar sent. Sent describes when, not an object. På ett lager is a place phrase, not a direct object.","The course says transitive verbs must have an object. Treat this as a first model of the constructions being practised. In actual Swedish some verbs have both uses: Jag äter middag has an object; Jag äter does not state one. Transitivity is not a test of whether an action is physical or affects someone emotionally. Jag ser huset has an object although I do not change the house.","Memorise the forms as pairs: lägga–lade–lagt versus ligga–låg–legat; sätta–satte–satt versus sitta–satt–suttit. Note that satt can be the supine of sätta or the past tense of sitta. The helper har makes the difference visible: Jag har satt mig. Jag satt här. Jag har suttit här.","In Jag sätter mig is mig an object? In the course's basic analysis, yes: the reflexive pronoun fills the object position. Jag sitter has no object. Ställa sig and lägga sig similarly express entering a position; stå and ligga describe the position."],"sv":["I en transitiv konstruktion har verbet ett direkt objekt. Fråga \"bokar vad?\" i Rimona bokar resan. Resan är objektet. I Sascha vaknar sent finns inget direkt objekt. Sent anger tid. På ett lager är en platsfras, inte ett direkt objekt.","Kursens regel att transitiva verb måste ha objekt är en första modell för övningarna. I verklig svenska kan vissa verb användas både med och utan uttalat objekt: Jag äter middag och Jag äter. Avgör inte transitivitet genom att fråga om något förändras fysiskt. Jag ser huset har objekt även om huset inte förändras.","Lär dig formerna parvis. Satt kan vara supinum av sätta eller preteritum av sitta. Hjälpverbet har visar skillnaden: Jag har satt mig, Jag satt här och Jag har suttit här.","I kursens grundläggande analys är mig objekt i Jag sätter mig. Jag sitter har inget objekt. Ställa sig och lägga sig uttrycker också en förändring till en position. Stå och ligga beskriver positionen."]},{"ti":"Particle verbs and reflexive verbs","c":2,"en":["A small word can change the meaning: koppla av = relax; koppla bort = disconnect or mentally switch off. A particle often carries stress when spoken. Learn the whole phrase with a sentence. Not every following preposition is a particle; the practical task is to learn the complete expression and its meaning.","Reflexive pronouns change with the subject: jag återhämtar mig, du återhämtar dig, han/hon återhämtar sig, vi återhämtar oss, ni återhämtar er, de återhämtar sig. The verb itself does not change with person. Jag har återhämtat mig uses the supine plus the correct pronoun."],"sv":["Ett litet ord kan ändra betydelsen. Koppla av betyder vila eller slappna av. Koppla bort betyder stänga av eller släppa tankarna på något. Partikeln är ofta betonad. Lär dig hela uttrycket med en mening. Alla prepositioner efter verb är inte partiklar.","Reflexiva pronomen ändras efter subjektet: mig, dig, sig, oss, er, sig. Själva verbformen ändras inte efter person. I perfekt skriver du till exempel Jag har återhämtat mig."]},{"ti":"Verb forms and groups","c":3,"en":["The glossary gives infinitive, present, preterite and supine. Swedish verbs do not change for I/you/he/we. Jag går, hon går, vi går. Tense and meaning determine the form.","Group 1 commonly has -ar/-ade/-at. Group 2 normally drops infinitive -a, uses -er in the present, and -de or -te in the past. Group 2b commonly uses -te after voiceless consonants such as p, t, k and s. Group 3 uses -r/-dde/-tt with a short infinitive ending in a vowel. Strong verbs often change vowels. Irregular verbs and special spellings must be learned individually. Group numbers are learning labels; they do not tell you whether a verb is transitive, reflexive or auxiliary."],"sv":["Ordlistan visar infinitiv, presens, preteritum och supinum. Verbet ändras inte efter person. Det heter jag går, hon går och vi går. Tempus och betydelse avgör formen.","Grupp 1 har ofta -ar/-ade/-at. Grupp 2 tappar normalt infinitivens -a och har -er i presens samt -de eller -te i preteritum. Grupp 2b har ofta -te efter tonlösa konsonanter som p, t, k och s. Grupp 3 har -r/-dde/-tt. Starka verb ändrar ofta vokal. Oregelbundna verb och specialformer måste läras separat. Gruppnumret säger inte om verbet är transitivt, reflexivt eller hjälpverb."]},{"ti":"Tenses and time","c":3,"en":["Supine is not a tense by itself. Har + supine makes perfect; hade + supine makes pluperfect. Do not write har gick or har gå. Use har gått. With an explicit completed time such as i går, preterite is usually the intended form. Future time can also use present with a clear time phrase: Jag reser i morgon."],"sv":["Supinum är inte ett eget tempus. Har + supinum bildar perfekt och hade + supinum bildar pluskvamperfekt. Skriv har gått. Med en avslutad tid som i går används oftast preteritum. Presens kan uttrycka framtid med tydligt tidsuttryck: Jag reser i morgon."]},{"ti":"Modal auxiliaries and att","c":3,"en":["After kan, vill, måste, ska and bör, use an infinitive without att: Jag vill träna; du bör vila. After försöker, an infinitive with or without att is possible: Jag försöker träna; Jag försöker att träna. After a preposition, att is needed before an infinitive phrase: Jag ser fram emot att resa. In kommer att resa, keep att as your standard learning model.","Att has two important jobs. In att träna it introduces an infinitive, meaning \"to train\". In Jag tror att han tränar it introduces a finite clause, meaning \"that he trains\". These require different structures."],"sv":["Efter kan, vill, måste, ska och bör används infinitiv utan att. Efter försöker går det att använda infinitiv med eller utan att. Efter en preposition behövs att framför infinitivfrasen: Jag ser fram emot att resa. Använd kommer att resa som grundmodell.","Att kan vara infinitivmärke eller bisatsinledare. I att träna följs det av infinitiv. I Jag tror att han tränar följs det av subjekt och ett finit verb. Blanda inte ihop konstruktionerna."]},{"ti":"Commands and advice","c":3,"en":["Imperatives give instructions: Ta trapporna. Vila. Släck ljuset. Negative imperatives put inte after the verb: Glöm inte pausen. A command can sound direct. For friendly advice use Du kan ..., Du skulle kunna ..., or Det kanske vore bra att ... ."],"sv":["Imperativ används i uppmaningar. Negationen står efter verbet: Glöm inte pausen. En uppmaning kan låta bestämd. Vänligare råd kan börja med Du kan, Du skulle kunna eller Det kanske vore bra att."]},{"ti":"Passive forms and s verbs","c":3,"en":["The course texts contain forms you should recognise even though the first three chapters do not teach the full passive unit. Bostäder byggs means homes are being built. Det behövs fler bostäder means more homes are needed. Präglas av means is characterised by. Build the s-passive from the relevant verb form: bygger → byggs; byggde → byggdes; har byggt → har byggts.","Not every s-ending is passive. Finnas is an existential verb; umgås has an active meaning; träffas can mean meet each other; försämras can describe a change happening to a subject. Learn their meanings rather than mechanically removing s. Other passive constructions use bli + participle, as in Huset blev byggt. This is recognition-level extension material here."],"sv":["Texterna innehåller former som är bra att känna igen även om hela passivavsnittet kommer senare. Bostäder byggs och Det behövs fler bostäder är exempel. S-passiv bildas med s på rätt verbform: byggs, byggdes och har byggts.","Alla s-former är inte passiva. Finnas, umgås, träffas och försämras har olika funktioner. Lär dig betydelsen i sammanhanget. Passiv kan också bildas med bli och particip: Huset blev byggt. Här är detta ett kompletterande avsnitt för igenkänning."]},{"ti":"Participles in the readings","c":3,"en":["Sittande, arbetande and flytande are present participles. They usually do not change for gender or number. Byggd, fylld, sliten and välförtjänt are past participles or participial adjectives; they can agree with nouns: ett byggt hus, fyllda glas, slitna skor. Distinguish supine byggt after har from participle byggt describing an ett noun. Same spelling does not mean the same function."],"sv":["Sittande, arbetande och flytande är presensparticip och böjs normalt inte efter genus eller antal. Byggd, fylld, sliten och välförtjänt är perfektparticip eller particip som fungerar som adjektiv. De kan böjas efter substantivet. Byggt efter har är supinum. Byggt som beskriver ett hus är particip. Samma stavning betyder inte samma funktion."]},{"ti":"Main clauses and inversion","c":3,"en":["In an ordinary statement the finite verb comes in position two. A position can contain several words. Jag tränar i dag. I dag tränar jag. Efter en lång arbetsdag vilar Marvin. Do not write I dag jag tränar. In questions, the finite verb often comes before the subject: Tränar du? Var bor du?"],"sv":["I en vanlig påståendesats står det finita verbet på andra plats. En plats kan innehålla flera ord. Skriv I dag tränar jag, inte I dag jag tränar. I frågor står verbet ofta före subjektet: Tränar du? Var bor du?"]},{"ti":"Subordinate clauses","c":3,"en":["After words such as att, eftersom, när, om and trots att, use subordinate clause order. In a typical subordinate clause, inte comes before the finite verb: Jag vet att han inte tränar. När jag inte har tid stannar jag hemma. When a subordinate clause occupies the first position, the main clause begins with its finite verb: Om jag är ledig, reser jag.","BIFF is a memory aid: i Bisats kommer Inte Före det Finita verbet. It is a starting tool, not a complete analysis of every Swedish clause. Contrast a reason phrase with a clause: på grund av oväsendet versus eftersom grannen spelar musik."],"sv":["Efter att, eftersom, när, om och trots att används bisatsordföljd. I en vanlig bisats står inte före det finita verbet. När en bisats står först kommer huvudsatsens finita verb direkt efter bisatsen: Om jag är ledig, reser jag.","BIFF betyder att inte står före det finita verbet i bisats. Regeln är ett minnesstöd. Jämför en fras med en sats: på grund av oväsendet och eftersom grannen spelar musik."]},{"ti":"Linking ideas","c":3,"en":["Since därför is a main-clause connector, the verb follows it: Därför vilar jag. Eftersom introduces a clause: eftersom jag är trött. Do not use the same word order for both."],"sv":["Därför följs av verb i huvudsatsen. Eftersom följs av bisatsordföljd. Skriv Därför vilar jag och eftersom jag är trött."]},{"ti":"Pronunciation practice","c":3,"en":["Use each course text's audio as the pronunciation model. Listen to a short segment, pause, repeat and record yourself. Compare stressed syllables, vowel length and the rhythm of a whole phrase. Swedish spelling alone does not reliably show all pronunciation details.","This guide links to the audio through the reading pages. The separate listening quizzes are not transcribed here; use the practice method above with the course audio. Do not treat a written model dialogue below as a transcript of a course recording."],"sv":["Använd ljudet till kursens texter som modell. Lyssna på ett kort avsnitt, pausa, upprepa och spela in dig själv. Jämför betoning, vokallängd och rytm. Stavningen visar inte alla detaljer i uttalet.","Ljudet nås via länkarna till lästexterna. De separata hörövningarna är inte transkriberade här. Använd metoden ovan med kursens ljud. Modellsamtalen är egna övningar och inte transkriptioner av kursinspelningar."]},{"ti":"Relative clauses with som","c":3,"en":["A relative clause adds information about a person or thing. Som can refer to either: en vän som bor här; ett hus som ligger centralt. If som is the subject of its clause, do not add another subject: en vän som bor här, not en vän som han bor här. If it represents the object, the clause needs its own subject: boken som jag läser. Negation follows subordinate order: ett rum som jag inte använder.","For place, där often means where: ett område där jag trivs. Dit points to movement: staden dit jag vill flytta. Compare var bor du? with vart ska du resa? These distinctions help you describe housing and travel accurately."],"sv":["En relativ bisats ger information om en person eller sak. Som kan syfta på båda. När som är subjekt lägger du inte till ett extra subjekt. När som motsvarar objektet behöver bisatsen ett eget subjekt: boken som jag läser. Inte står före det finita verbet: ett rum som jag inte använder.","Där anger ofta plats och dit riktning. Jämför ett område där jag trivs och staden dit jag vill flytta. Var bor du? frågar efter plats. Vart ska du resa? frågar efter riktning."]},{"ti":"Embedded questions and reported speech","c":3,"en":["Direct questions often put the verb before the subject: Var bor han? Kan hon komma? Embedded questions use subordinate order: Jag undrar var han bor. Jag undrar om hon kan komma. Notice that om introduces an embedded yes/no question, meaning whether or if. Do not write Jag undrar var bor han.","In a past retelling, adjust pronouns, time reference and tense when the meaning requires it: Marvin säger: Jag är trött. → Marvin sa att han var trött. Swedish does not demand a mechanical tense shift in every reported statement. Choose the form that shows whether the information belongs to the past or remains true now. Hypothetical Om jag hade tid skulle jag resa expresses an imagined situation; hade does not necessarily mean that the condition occurred yesterday."],"sv":["I direkta frågor står verbet ofta före subjektet. I indirekta frågor används bisatsordföljd: Jag undrar var han bor och Jag undrar om hon kan komma. Om inleder en indirekt ja- eller nej-fråga. Skriv inte Jag undrar var bor han.","I en återberättelse i dåtid anpassas pronomen, tidsuttryck och tempus efter betydelsen. Marvin säger: Jag är trött blir Marvin sa att han var trött. Tempus ändras inte mekaniskt i alla referat. Välj den form som visar tidsperspektivet. Om jag hade tid skulle jag resa beskriver en tänkt situation och behöver inte handla om gårdagen."]},{"ti":"Time expressions and pronoun distinctions","c":3,"en":["Generic man means people in general: Man behöver vila. It is a pronoun and is different from noun en man, meaning a man or husband. Generic man often uses en as object and sin/sitt/sina for possession: Det hjälper en att ta hand om sin hälsa. In speech, people also use du generically, but a specific you can sound personal. Choose carefully when giving advice.","Distinguish subject and object pronouns: de kommer but jag ser dem; vi vilar but hon hjälper oss. In standard writing, låt dem vila uses object dem. The spoken form dom does not show this difference. Varandra expresses reciprocity: de hjälper varandra, meaning they help each other. Sig refers back to the subject: de hjälper sig själva, meaning they help themselves."],"sv":["Pronomenet man syftar på människor i allmänhet. Det är något annat än substantivet en man. Som objekt används ofta en, och som possessiv form används sin/sitt/sina: Det hjälper en att ta hand om sin hälsa. Ett allmänt du förekommer också men kan låta personligt när du ger råd.","Skilj mellan subjekt och objekt: de kommer men jag ser dem; vi vilar men hon hjälper oss. Skriv låt dem vila i normal skriftsvenska. Talformen dom visar inte skillnaden. Varandra betyder ömsesidighet. Sig själva syftar tillbaka på subjektet och har en annan betydelse."]},{"ti":"Reflexive pronouns and objects","c":8,"en":["A reflexive pronoun points back to the subject: \"Jag tvättar mig\" means that I wash myself. \"Jag tvättar barnet\" has a different object. Swedish changes the reflexive pronoun with the subject. In the third person, sig works for singular and plural. It is not the same as honom, henne or dem, which normally refer to someone else in these examples.","Compare \"Hon hjälper henne\" (she helps another woman) and \"Hon hjälper sig själv\" (she helps herself). \"Själv\" adds emphasis and agrees: jag själv, vi själva. With hen, the object form is hen or henom; the reflexive remains sig: \"Hen förbereder sig.\" The pronoun normally follows the finite verb, or the infinitive when there is an auxiliary: \"Jag måste anstränga mig.\""],"sv":["Ett reflexivt pronomen syftar tillbaka på subjektet: \"Jag tvättar mig\" betyder att jag tvättar mig själv. \"Jag tvättar barnet\" har ett annat objekt. Svenskan ändrar det reflexiva pronomenet efter subjektet. I tredje person används sig både i singular och plural. Det är inte samma sak som honom, henne eller dem, som normalt syftar på någon annan i dessa exempel.","Jämför \"Hon hjälper henne\" (en annan kvinna) och \"Hon hjälper sig själv\". \"Själv\" förstärker och böjs: jag själv, vi själva. Med hen kan objektsformen vara hen eller henom, medan den reflexiva formen fortfarande är sig: \"Hen förbereder sig.\" Pronomenet står normalt efter det finita verbet eller efter infinitiven om det finns ett hjälpverb: \"Jag måste anstränga mig.\""]},{"ti":"Learn reflexive meanings as phrases","c":8,"en":["Learn gifta sig, skilja sig, bry sig, bestämma sig, koncentrera sig, anpassa sig, akta sig, ångra sig and försova sig as phrases. In these meanings the reflexive belongs to the expression. The base verb can sometimes have another construction and meaning: \"Läraren anpassar undervisningen\" adapts something, while \"Eleven anpassar sig\" adapts themselves. \"Vi bestämmer en tid\" sets a time; \"Vi bestämmer oss\" means we decide.","Some verbs can readily have either a reflexive or another object: tvätta sig/barnet, torka sig/bordet, kamma sig/barnet, klä på sig/barnet. \"Klippa sig\" commonly means have a haircut, even when a hairdresser does the cutting. Position changes are lägga sig, sätta sig and ställa sig; positions are ligga, sitta and stå. Say \"Jag sätter mig nu\" but \"Jag sitter redan här\"."],"sv":["Lär dig gifta sig, skilja sig, bry sig, bestämma sig, koncentrera sig, anpassa sig, akta sig, ångra sig och försova sig som fraser. I dessa betydelser hör pronomenet till uttrycket. Grundverbet kan ibland ha en annan konstruktion och betydelse: \"Läraren anpassar undervisningen\" handlar om att anpassa något, medan \"Eleven anpassar sig\" handlar om personen själv. \"Vi bestämmer en tid\" anger en tid. \"Vi bestämmer oss\" betyder att vi fattar ett beslut.","Vissa verb kan lätt ha antingen ett reflexivt eller ett annat objekt: tvätta sig/barnet, torka sig/bordet, kamma sig/barnet, klä på sig/barnet. \"Klippa sig\" betyder ofta att få håret klippt, även när en frisör klipper. Lägesförändringar är lägga sig, sätta sig och ställa sig. Lägen är ligga, sitta och stå. Säg \"Jag sätter mig nu\" men \"Jag sitter redan här\"."]},{"ti":"The principal forms and tense choices","c":8,"en":["The verb reference gives infinitive, present, preterite and supine. Infinitive follows many auxiliaries: kan arbeta, måste spara, vill lära sig. Use att after many other constructions: försöker att lära sig, möjlighet att arbeta; att can be omitted after some verbs such as försöka. Present describes now, habits and sometimes planned future. Preterite tells a finished past event. Perfect uses har + supine and relates a past event to now. Pluperfect uses hade + supine for something before another past event."],"sv":["Verbregistret visar infinitiv, presens, preteritum och supinum. Infinitiv står efter många hjälpverb: kan arbeta, måste spara, vill lära sig. Använd att efter många andra konstruktioner: försöker att lära sig, möjlighet att arbeta. Att kan utelämnas efter vissa verb, till exempel försöka. Presens beskriver nutid, vanor och ibland planerad framtid. Preteritum berättar om en avslutad händelse i dåtid. Perfekt består av har + supinum och kopplar dåtid till nutid. Pluskvamperfekt består av hade + supinum och visar något som hände före en annan dåtidshändelse."]},{"ti":"Verb groups and other verb types","c":8,"en":["Group 2b usually has a stem ending in a voiceless consonant, such as p, t, k or s; group 2a normally takes -de. Spelling and irregular exceptions still need attention. Group 3 has a short infinitive without final -a. Some course tables separate strong and irregular verbs as groups 4 and 5. Here 4 means strong verbs and \"irregular\" identifies special patterns; the labels do not change the forms.","Grammatical types overlap. A verb can be group 1 and reflexive, or strong and a particle verb. Reflexive verbs use a pronoun; particle verbs include a stressed particle such as ge UPP or dra AV; modal auxiliaries include kan, vill, ska, bör and måste. Transitive verbs take an object (\"hon stänger dörren\"); intransitive verbs need no object (\"isen smälter\"). Deponent verbs end in -s without being passive: lyckas, hoppas, minnas, trivas and vistas. Reciprocal umgås means socialise with one another. Learn these types alongside the conjugation group."],"sv":["Grupp 2b har ofta en stam som slutar på en tonlös konsonant, till exempel p, t, k eller s. Grupp 2a får normalt -de. Stavning och oregelbundna undantag behöver ändå läras. Grupp 3 har en kort infinitiv utan slut-a. Vissa kurstabeller skiljer starka och oregelbundna verb som grupp 4 och 5. Här betyder 4 starka verb och \"irregular\" markerar särskilda mönster. Etiketterna ändrar inte verbformerna.","Grammatiska typer överlappar. Ett verb kan tillhöra grupp 1 och vara reflexivt, eller vara starkt och samtidigt ett partikelverb. Reflexiva verb använder pronomen. Partikelverb har en betonad partikel, till exempel ge UPP eller dra AV. Modala hjälpverb är bland annat kan, vill, ska, bör och måste. Transitiva verb har objekt (\"hon stänger dörren\"), medan intransitiva verb inte behöver objekt (\"isen smälter\"). Deponensverb slutar på -s utan att vara passiva: lyckas, hoppas, minnas, trivas och vistas. Det reciproka verbet umgås handlar om att vara tillsammans med varandra. Lär dig typerna tillsammans med böjningsgruppen."]},{"ti":"Imperatives and particles","c":8,"en":["Use the imperative for clear instructions: spara, stäng, läs, ta, gör, var. Negative instructions use inte: \"Slösa inte.\" Reflexive imperatives change with the listener: \"Sätt dig\" to one person, \"Sätt er\" to several. A particle changes meaning: gå = go, gå på = attend or cost, gå upp i rök = disappear. Keep the whole expression on your flashcard and conjugate the main verb: lägga ihop, lägger ihop, lade ihop, lagt ihop."],"sv":["Använd imperativ för tydliga instruktioner: spara, stäng, läs, ta, gör, var. Nekande uppmaningar får inte: \"Slösa inte.\" Reflexiva uppmaningar ändras efter mottagaren: \"Sätt dig\" till en person, \"Sätt er\" till flera. En partikel ändrar betydelsen: gå, gå på (delta i eller kosta), gå upp i rök (försvinna). Skriv hela uttrycket på ordkortet och böj huvudverbet: lägga ihop, lägger ihop, lade ihop, lagt ihop."]},{"ti":"Position, movement and time","c":8,"en":["Prepositions show relationships, but Swedish does not translate every English preposition word for word. Learn a preposition with its context. Innanför and utanför describe a boundary; ovanför and nedanför a vertical relation; framför and bakom a front/back relation. Inför often means before an event in preparation for it. Kring and runt often mean around. Inom gives a limit; utom excludes; bland refers to a group and mellan to a relationship between items or parties.","Compare \"i skolan\" (at school as an activity/institution), \"på skolan\" (at that school), \"till skolan\" (towards school) and \"från skolan\" (from school). \"Ur ugnen\" stresses movement from inside the oven. Time phrases differ: \"i två år\" = for two years, \"för två år sedan\" = two years ago, \"sedan 2020\" = since 2020, \"om två år\" = in two years, \"på två timmar\" = in two hours to complete something. Learn these as patterns, not a universal rule for every noun."],"sv":["Prepositioner visar relationer, men svenska prepositioner motsvarar inte alltid engelska ord för ord. Lär dig prepositionen i sitt sammanhang. Innanför och utanför beskriver en gräns, ovanför och nedanför en höjdskillnad, framför och bakom en relation mellan fram- och baksida. Inför betyder ofta före en händelse som man förbereder sig för. Kring och runt betyder ofta runt omkring. Inom anger en gräns, utom utesluter, bland syftar på en grupp och mellan på relationen mellan föremål eller parter.","Jämför \"i skolan\" (skolan som verksamhet), \"på skolan\" (vid just den skolan), \"till skolan\" (riktning) och \"från skolan\" (utgångspunkt). \"Ur ugnen\" betonar rörelse inifrån ugnen. Tidsuttryck skiljer sig: \"i två år\" anger varaktighet, \"för två år sedan\" en tidpunkt bakåt, \"sedan 2020\" en startpunkt, \"om två år\" en tidpunkt framåt och \"på två timmar\" tiden det tar att slutföra något. Lär dig uttrycken som mönster, inte som en regel för alla substantiv."]},{"ti":"The different jobs of av","c":8,"en":["\"Av\" does not automatically mean \"of\". Ask what relation it expresses. After a preposition, use an object pronoun: av mig, till dig, med henne, för oss. Common chapter combinations include beroende av, ansvar för, tillit till, respekt för, hänsyn till, anpassad till/för and på grund av. \"Skylla på\" assigns blame; \"bero på\" explains a cause."],"sv":["\"Av\" betyder inte automatiskt \"of\". Fråga vilken relation det uttrycker. Efter en preposition används objektsform: av mig, till dig, med henne, för oss. Vanliga kombinationer i kapitlen är beroende av, ansvar för, tillit till, respekt för, hänsyn till, anpassad till/för och på grund av. \"Skylla på\" lägger skuld på någon, medan \"bero på\" förklarar en orsak."]},{"ti":"Main clauses, subordinate clauses and linking ideas","c":8,"en":["In a statement, the finite verb occupies the second clause position, not necessarily the second word. \"Jag sparar pengar\" becomes \"Varje månad sparar jag pengar\". Put inte after the finite verb in an ordinary main clause: \"Jag köper inte jackan.\" With an auxiliary: \"Jag har inte köpt jackan.\" In a subordinate clause, inte normally comes before the finite verb: \"eftersom jag inte har råd\". The memory rule BIFF means bisats inte före finit verb.","If the subordinate clause comes first, the main clause still needs inversion: \"Eftersom jag inte har råd, köper jag ingen jacka.\" Questions use finite verb before subject: \"Har du råd?\" and \"Varför har du inte råd?\" Connect reasons with eftersom/därför att, results with därför, purposes with för att, concessions with även om/trots att, and contrasts with men/däremot. \"Trots\" takes a noun phrase (\"trots svårigheterna\"); \"trots att\" introduces a clause (\"trots att det var svårt\")."],"sv":["I ett påstående står det finita verbet på andra satsplatsen, inte nödvändigtvis som andra ordet. \"Jag sparar pengar\" blir \"Varje månad sparar jag pengar\". Placera inte efter det finita verbet i en vanlig huvudsats: \"Jag köper inte jackan.\" Med hjälpverb: \"Jag har inte köpt jackan.\" I en bisats står inte normalt före det finita verbet: \"eftersom jag inte har råd\". Minnesregeln BIFF betyder bisats inte före finit verb.","Om bisatsen kommer först behövs fortfarande omvänd ordföljd i huvudsatsen: \"Eftersom jag inte har råd, köper jag ingen jacka.\" Frågor har finit verb före subjekt: \"Har du råd?\" och \"Varför har du inte råd?\" Koppla skäl med eftersom/därför att, följder med därför, syften med för att, medgivanden med även om/trots att och motsatser med men/däremot. \"Trots\" följs av en nominalfras (\"trots svårigheterna\"), medan \"trots att\" inleder en sats (\"trots att det var svårt\")."]},{"ti":"Nouns, adjectives and possessives in context","c":8,"en":["Learn en/ett with the noun; the ending alone is not enough to predict gender. An indefinite noun introduces something: en lärare, ett mål. A definite noun identifies it: läraren, målet. Plurals vary: skolor, elever, lärare, barn. A possessive normally takes an indefinite noun form: min skola, hennes utbildning, deras barn. Do not add the definite ending after the possessive. \"Sin/sitt/sina\" points back to a third-person subject: \"Flora söker sitt drömyrke\"; \"hennes drömyrke\" can refer to another woman's dream profession.","Ordinary adjectives agree: en trygg miljö, ett tryggt arbete, trygga miljöer. Definite descriptions often use double definiteness: den trygga miljön, det trygga arbetet, de trygga miljöerna. After possessives use the adjective's -a form: min trygga arbetsplats. An adverb describes an action and often ends in -t: \"Hon arbetar noggrant\". This differs from \"en noggrann person\"."],"sv":["Lär dig en/ett tillsammans med substantivet. Ändelsen räcker inte för att avgöra genus. Obestämd form introducerar något: en lärare, ett mål. Bestämd form identifierar det: läraren, målet. Plural varierar: skolor, elever, lärare, barn. Ett possessivt pronomen följs normalt av obestämd substantivform: min skola, hennes utbildning, deras barn. Lägg inte till bestämd ändelse efter possessivt pronomen. \"Sin/sitt/sina\" syftar på ett subjekt i tredje person: \"Flora söker sitt drömyrke\". \"Hennes drömyrke\" kan syfta på en annan kvinnas drömyrke.","Vanliga adjektiv kongruensböjs: en trygg miljö, ett tryggt arbete, trygga miljöer. Bestämda beskrivningar har ofta dubbel bestämdhet: den trygga miljön, det trygga arbetet, de trygga miljöerna. Efter possessivt pronomen används adjektivets a-form: min trygga arbetsplats. Ett adverb beskriver en handling och slutar ofta på -t: \"Hon arbetar noggrant\". Det skiljer sig från \"en noggrann person\"."]},{"ti":"Active and passive focus","c":8,"en":["Active sentences put the doer in focus: \"Läraren rättar proven.\" A passive sentence can put the affected thing first: \"Proven rättas av läraren.\" Proven is the grammatical subject in the passive sentence; läraren is the agent after av. The agent can be omitted when unknown, obvious or unimportant: \"Proven rättas i dag.\" Passive sentences do have a subject in these examples. It is the doer who may be left out, not the grammatical subject."],"sv":["Aktiva meningar sätter den som handlar i fokus: \"Läraren rättar proven.\" En passiv mening kan sätta det som påverkas först: \"Proven rättas av läraren.\" Proven är grammatiskt subjekt i den passiva meningen, medan läraren är agent efter av. Agenten kan utelämnas när den är okänd, självklar eller oviktig: \"Proven rättas i dag.\" De passiva meningarna har alltså subjekt i dessa exempel. Det är den som utför handlingen som kan utelämnas, inte det grammatiska subjektet."]},{"ti":"Form the s passive","c":8,"en":["The passive -s attaches to the verb form. In the present, remove active -r before adding -s: tvättar → tvättas, stänger → stängs, når → nås. For läsa, läses is the clear written form; läss is not the form to learn. Past forms add -s to the preterite, and perfect uses har + passive supine. A modal takes passive infinitive: \"Bilen ska tvättas\".","Keep tense, negation and meaning when transforming. \"Han tvättade bilen i går\" → \"Bilen tvättades i går\". \"Vi har inte stängt dörren\" → \"Dörren har inte stängts\". If the original object is a pronoun, use subject form when it becomes subject: \"Hon når honom\" → \"Han nås av henne\". The original subject becomes an object-form pronoun after av."],"sv":["Passiv-s läggs till verbformen. I presens tar man bort aktivt -r innan man lägger till -s: tvättar → tvättas, stänger → stängs, når → nås. Till läsa är läses den tydliga skriftliga formen. Lär inte formen läss. Preteritum får -s och perfekt bildas med har + passivt supinum. Efter modalt hjälpverb används passiv infinitiv: \"Bilen ska tvättas\".","Behåll tempus, negation och betydelse när du omformulerar. \"Han tvättade bilen i går\" → \"Bilen tvättades i går\". \"Vi har inte stängt dörren\" → \"Dörren har inte stängts\". Om det ursprungliga objektet är ett pronomen byter det till subjektsform: \"Hon når honom\" → \"Han nås av henne\". Det ursprungliga subjektet får objektsform efter av."]},{"ti":"Every s is not a passive","c":8,"en":["Compare \"Dörren stängs av läraren\" (passive), \"Hon hoppas på arbete\" (deponent), \"Vi umgås på helgerna\" (reciprocal meaning), and \"Klimatet förändras\" (a change without naming an external actor). Ask whether there is a natural active counterpart with someone doing the action to an object. Do not remove the -s from hoppas or lyckas to make a supposed active form with the same meaning."],"sv":["Jämför \"Dörren stängs av läraren\" (passiv), \"Hon hoppas på arbete\" (deponens), \"Vi umgås på helgerna\" (reciprok betydelse) och \"Klimatet förändras\" (en förändring utan angiven yttre aktör). Fråga om det finns en naturlig aktiv motsvarighet där någon gör något med ett objekt. Ta inte bort -s från hoppas eller lyckas för att skapa en påstådd aktiv form med samma betydelse."]},{"ti":"Past participles agree like adjectives","c":8,"en":["A past participle describes a result or a quality linked to a verb: a painted door, a written letter, a peeled apple. It agrees with en, ett and plural: en målad dörr, ett målat hus, målade dörrar. The name \"perfekt particip\" does not mean it is the perfect tense. Perfect tense uses har + supine: \"Hon har målat huset\". The participle describes the house: \"Huset är målat\".","Learn the corrected stänga pattern: stängd, stängt, stängda. The ett form ends in -t, not -d. Strong forms may change the stem: skriven/skrivet/skrivna, and erbjuden/erbjudet/erbjudna. Some verbs in a strong group do not use -en participles, so check the actual participle instead of applying one ending to every group 4 verb."],"sv":["Ett perfekt particip beskriver ett resultat eller en egenskap kopplad till ett verb: en målad dörr, ett skrivet brev, ett skalat äpple. Det böjs efter en, ett och plural: en målad dörr, ett målat hus, målade dörrar. Namnet \"perfekt particip\" betyder inte att det är tempus perfekt. Perfekt bildas med har + supinum: \"Hon har målat huset\". Participet beskriver huset: \"Huset är målat\".","Lär dig det korrekta mönstret till stänga: stängd, stängt, stängda. Ett-formen slutar på -t, inte -d. Starka former kan ändra stammen: skriven/skrivet/skrivna och erbjuden/erbjudet/erbjudna. Vissa verb i en stark grupp har inte particip på -en. Kontrollera därför det verkliga participet i stället för att använda samma ändelse för alla verb i grupp 4."]},{"ti":"Definite participles and the difference from supine","c":8,"en":["With a definite noun phrase, use the definite participle form: den målade tavlan, det stängda fönstret, de skrivna breven. After a possessive: mitt skrivna brev. After har/hade, the supine does not agree with the object: \"Hon har skrivit ett brev/två brev\". After vara/bli, the participle agrees with the subject: \"Brevet är skrivet; breven är skrivna\". The ett participle sometimes looks exactly like the supine (målat), but not always (skrivet versus skrivit)."],"sv":["I en bestämd nominalfras används bestämd participform: den målade tavlan, det stängda fönstret, de skrivna breven. Efter possessivt pronomen: mitt skrivna brev. Efter har/hade böjs supinum inte efter objektet: \"Hon har skrivit ett brev/två brev\". Efter vara/bli böjs participet efter subjektet: \"Brevet är skrivet, breven är skrivna\". Ett-participet kan se likadant ut som supinum (målat), men inte alltid (skrivet jämfört med skrivit)."]},{"ti":"Bli passive and vara with a participle","c":8,"en":["\"Bli + participle\" commonly highlights an event or change: \"Dörren blev stängd klockan åtta\". \"Vara + participle\" commonly describes a state: \"Dörren var stängd när jag kom\". The s passive can describe an event or a repeated routine: \"Dörren stängs varje kväll\". The forms can overlap in context, so focus on the intended event or state rather than treating the difference as absolute.","Do not combine endings mechanically. Correct: \"Maten lagades\" or \"Maten blev lagad\". Incorrect for this meaning: \"Maten blev lagades\". Also keep agreement: \"Barnen blev klädda\", not \"barnen blev klätt\". In job language, \"Jag är anställd\" describes employment status; \"Jag blev anställd\" tells the hiring event."],"sv":["\"Bli + particip\" lyfter ofta fram en händelse eller förändring: \"Dörren blev stängd klockan åtta\". \"Vara + particip\" beskriver ofta ett tillstånd: \"Dörren var stängd när jag kom\". S-passiv kan beskriva en händelse eller en återkommande rutin: \"Dörren stängs varje kväll\". Användningarna kan överlappa. Fokusera därför på den avsedda händelsen eller tillståndet i stället för att se skillnaden som absolut.","Kombinera inte ändelser mekaniskt. Rätt: \"Maten lagades\" eller \"Maten blev lagad\". Fel i denna betydelse: \"Maten blev lagades\". Behåll också kongruensen: \"Barnen blev klädda\", inte \"barnen blev klätt\". I arbetslivet beskriver \"Jag är anställd\" en anställningssituation, medan \"Jag blev anställd\" berättar om själva anställningstillfället."]},{"ti":"Presens particip","c":9,"en":["The present participle is an adjective made from a verb. It is formed from the infinitive: verbs ending in -a add -nde (skratta → skrattande, arbeta → arbetande, kräva → krävande). Verbs that do not end in -a add -ende (le → leende, bero → beroende, gå → gående, se → seende).","The present participle has the same form for en-words, ett-words, plural and definite form: en krävande kurs, ett krävande arbete, krävande uppgifter, den krävande kursen. It never takes -t or -a.","Three common uses: as an adjective before a noun (ett leende barn), after vara or bli (Filmen var spännande), and with verbs of movement to show how someone moves (Barnet kom springande. Hon gick gråtande hem). Many present participles also work as nouns, often for people: en studerande, en sökande, en resande, en gående. They do not change in the plural: två sökande.","English often uses -ing where Swedish uses a full verb instead. \"I am reading\" is Jag läser, not \"Jag är läsande\". Use the present participle mainly as a description, not for ongoing actions."],"sv":["Presens particip är ett adjektiv som bildas av ett verb. Det bildas av infinitiven: verb som slutar på -a får -nde (skratta → skrattande, kräva → krävande). Verb som inte slutar på -a får -ende (le → leende, bero → beroende, gå → gående).","Presens particip har samma form för en-ord, ett-ord, plural och bestämd form: en krävande kurs, ett krävande arbete, krävande uppgifter. Det får aldrig -t eller -a.","Vanliga användningar: framför ett substantiv (ett leende barn), efter vara eller bli (Filmen var spännande) och med rörelseverb (Barnet kom springande). Många presens particip fungerar också som substantiv för personer: en studerande, en sökande, en resande. De ändras inte i plural: två sökande.","Skriv inte \"Jag är läsande\" för \"I am reading\". På svenska säger man Jag läser."]},{"ti":"Tempus: nutid och dåtid","c":10,"en":["Swedish organises tenses around two points of view. In the present system (nutid) you look from now: perfekt (har + supinum) for before now, presens for now, and futurum (ska, kommer att, tänker + infinitive) for after now. In the past system (dåtid) you look from a moment in the past: pluskvamperfekt (hade + supinum) for before then, preteritum for then, and futurum preteritum (skulle + infinitive) for after then.","Perfekt connects the past with now or does not name the time: Jag har bott i Sverige sedan 2021. Vi har haft en hund. Preteritum is used with a finished, specific time: Jag köpte cykeln förra veckan. Do not use perfekt with i går, förra året or för två år sedan.","Presens covers what is happening now, habits and facts: Hon pratar. Anders tar bussen till jobbet. De kommer från Serbien. Presens with a time word can also mean the future: Jag flyttar nästa vecka.","Pluskvamperfekt shows that something happened before another past event: När mamma kom hem hade barnen redan ätit. Futurum preteritum shows what was going to happen after a past moment: Han sa att han skulle ringa senare. When you retell a story in the past, change every verb consistently: bor → bodde, har bott → hade bott, ska flytta → skulle flytta."],"sv":["Svenskan har två tidssystem. I nutid utgår man från nu: perfekt (har + supinum) före nu, presens nu och futurum (ska, kommer att, tänker + infinitiv) efter nu. I dåtid utgår man från en tidpunkt i det förflutna: pluskvamperfekt (hade + supinum) före då, preteritum då och futurum preteritum (skulle + infinitiv) efter då.","Perfekt kopplar det förflutna till nu eller anger ingen tid: Jag har bott i Sverige sedan 2021. Preteritum används med en bestämd, avslutad tid: Jag köpte cykeln förra veckan. Använd inte perfekt med i går eller förra året.","Presens används för det som händer nu, för vanor och för fakta. Presens med tidsuttryck kan betyda framtid: Jag flyttar nästa vecka.","Pluskvamperfekt visar att något hände före en annan händelse i dåtid: När mamma kom hem hade barnen redan ätit. Futurum preteritum visar vad som skulle hända efter då: Han sa att han skulle ringa senare. När du återberättar i dåtid ändrar du alla verb: bor → bodde, har bott → hade bott, ska flytta → skulle flytta."]}],"G":{"pronouns":[["Meaning","En noun","Ett noun","Plural","Alone"],["some; any","någon bostad","något hus","några grannar","någon = someone; något = something"],["no; none","ingen bostad","inget hus","inga grannar","ingen = no one; ingenting = nothing"],["other","en annan bostad","ett annat hus","andra bostäder","någon annan = someone else"],["all","all mat","allt oväsen","alla grannar","alla = everyone; allt = everything"]],"plurals":[["Common plural pattern","Example","English"],["-or","en villa → villor → villorna","often en nouns ending in a"],["-ar","en granne → grannar → grannarna","many en nouns"],["-er","en bostad → bostäder → bostäderna","many loanwords and other en nouns"],["-n","ett ställe → ställen → ställena","many ett nouns ending in a vowel"],["no added plural ending","ett hus → hus → husen","many ett nouns ending in a consonant"],["irregular vowel or stem","en hand → händer; en bok → böcker","learn separately"]],"adjpattern":[["Pattern","En","Ett","Plural or weak form"],["regular","nyttig","nyttigt","nyttiga"],["ends in ad","balanserad","balanserat","balanserade"],["ends in en","medveten","medvetet","medvetna"],["unstressed e disappears","vacker","vackert","vackra"],["another e deletion","enkel","enkelt","enkla"],["irregular small","liten","litet","små; definite singular lilla"],["ends in double t","trött","trött","trötta"],["invariable example","bra","bra","bra"]],"adjdef":[["Indefinite","Definite","Possessive"],["en ny vana","den ,"Preterite","Supine","Imperative"],["1","träna","tränar","tränade","tränat","träna"],["2a","ställa","ställer","ställde","ställt","ställ"],["2b","köpa","köper","köpte","köpt","köp"],["3","bo","bor","bodde","bott","bo"],["4 strong","skriva","skriver","skrev","skrivit","skriv"],["irregular","vara","är","var","varit","var"]],"tenses1":[["Meaning","Svenska","English"],["habit or now","Jag promenerar varje dag.","I walk every day."],["completed event at a past time","Jag promenerade i går.","I walked yesterday."],["past connected to now","Jag har promenerat mycket den här veckan.","I have walked a lot this week."],["before a past reference point","Jag hade promenerat innan hon kom.","I had walked before she arrived."],["plan or intention","Jag ska promenera i kväll.","I am going to walk this evening."],["prediction","Jag kommer att må bättre efter vilan.","I will feel better after the rest."],["conditional possibility","Om jag hade mer tid skulle jag resa mer.","If I had more time I would travel more."]],"wordorder":[["First position","Finite verb","Subject if moved","Negation","Rest"],["Jag","har","—","inte","bokat resan."],["I dag","har","jag","inte","bokat resan."],["Därför","vill","hon","inte","resa."]],"links":[["Function","Link","Example with English"],["reason","eftersom","Jag går eftersom det är nära. I walk because it is close."],["result","därför","Det är nära. Därför går jag. It is close. Therefore I walk."],["contrast","men; däremot","Jag vill resa men hon vill stanna. I want to travel but she wants to stay."],["concession","trots att","Hon går ut trots att det regnar. She goes out although it is raining."],["condition","om","Om jag hinner kommer jag. If I have time I will come."],["purpose","för att + infinitive","Jag vilar för att orka. I rest to have energy."],["alternative","i stället för att","Jag går i stället för att åka. I walk instead of taking transport."],["addition","dessutom","Dessutom är det billigare. Moreover it is cheaper."]],"time":[["Svensk
