<style>
/* SFI Kompis — design system
   One typeface (Schibsted Grotesk, drawn for a Scandinavian news house), one accent (deep Swedish blue),
   cool paper background, hairline structure. The Swedish word is the hero: everything else stays quiet.
   Type scale 12 / 14 / 16 / 18 / 22 / 28 / 36. Radius: 14 containers, 10 controls, 999 chips. */
:root{
  --bg:#F4F6F8; --surface:#FFFFFF; --sunk:#EDF1F4; --ink:#13202B; --muted:#5D6B77; --faint:#8C98A3; --line:#DFE5EA; --line2:#CBD3DA;
  --accent:#1D4F82; --accent-ink:#FFFFFF; --accent-soft:#E7EEF6; --sign:#1D4F82; --sun:#E9B518; --sun-ink:#2B2200;
  --hero1:#1D4F82; --hero2:#1D4F82; --hero-ink:#FFFFFF; --hero-muted:#D6E2EF;
  --good:#1E7A50; --good-bg:#E7F3EC; --bad:#B4322A; --bad-bg:#F8E9E7; --warn:#946200; --warn-bg:#F7EFDC;
  --l0:var(--accent); --l1:var(--accent); --l2:var(--accent); --l3:var(--accent); --l4:var(--accent); --l5:var(--accent); --l6:var(--accent); --l7:var(--accent); --l8:var(--accent); --l9:var(--accent); --l10:var(--accent);
  --display:"Schibsted Grotesk", "Helvetica Neue", Arial, sans-serif;
  --body:"Schibsted Grotesk", "Helvetica Neue", Arial, sans-serif;
  --r:14px; --rctl:10px; --shadow:none; --lift:0 1px 2px rgba(19,32,43,.06);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E151C; --surface:#151F28; --sunk:#1B2732; --ink:#E7ECF0; --muted:#9AA7B2; --faint:#6F7C88; --line:#25323E; --line2:#33424F;
  --accent:#8AB6E3; --accent-ink:#0B1621; --accent-soft:#1C2D3E; --sign:#8AB6E3; --sun:#E9B518; --sun-ink:#231B00;
  --hero1:#1C2D3E; --hero2:#1C2D3E; --hero-ink:#E7ECF0; --hero-muted:#9AA7B2;
  --good:#5BC28E; --good-bg:#14281F; --bad:#EF8A80; --bad-bg:#2E1A18; --warn:#E0B357; --warn-bg:#2A2312;
  --lift:none; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E151C; --surface:#151F28; --sunk:#1B2732; --ink:#E7ECF0; --muted:#9AA7B2; --faint:#6F7C88; --line:#25323E; --line2:#33424F;
  --accent:#8AB6E3; --accent-ink:#0B1621; --accent-soft:#1C2D3E; --sign:#8AB6E3; --sun:#E9B518; --sun-ink:#231B00;
  --hero1:#1C2D3E; --hero2:#1C2D3E; --hero-ink:#E7ECF0; --hero-muted:#9AA7B2;
  --good:#5BC28E; --good-bg:#14281F; --bad:#EF8A80; --bad-bg:#2E1A18; --warn:#E0B357; --warn-bg:#2A2312;
  --lift:none; color-scheme:dark}

/* ---------- base ---------- */
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;-webkit-text-size-adjust:100%;overscroll-behavior:none;-webkit-font-smoothing:antialiased;font-feature-settings:"ss01" 0}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
input,textarea,select{font:inherit;color:var(--ink)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;font-weight:650;letter-spacing:-.015em}
h1{font-size:28px;line-height:1.15}h2{font-size:18px;line-height:1.3}h3{font-size:16px;line-height:1.35;font-weight:600}
svg{flex:none}
.muted{color:var(--muted)}
.small{font-size:14px}
.eyebrow{font-size:13px;font-weight:500;color:var(--muted);letter-spacing:0}
.hint{font-size:14px;color:var(--muted);line-height:1.45}
.foot{margin:2px 2px 0;font-size:13px;color:var(--faint);line-height:1.5}
.lab{display:block;font-size:13px;font-weight:500;color:var(--muted);margin-bottom:2px}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px}

/* ---------- shell ---------- */
.app{height:100%;display:flex;flex-direction:column;max-width:640px;margin:0 auto;position:relative}
.apphead{background:var(--bg);padding:10px max(20px,env(safe-area-inset-right,0px)) 0 max(20px,env(safe-area-inset-left,0px))}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:2px 0 10px}
.brand{display:flex;align-items:center;gap:10px}
.sfib{display:inline-grid;place-items:center;background:var(--sun);color:#1D4F82;font-weight:700;letter-spacing:-.01em;line-height:1;border-radius:7px;padding:5px 7px 4px;font-size:16px}
.brand{gap:8px}
.brand b{font-family:var(--display);font-weight:650;font-size:20px;letter-spacing:-.02em;line-height:1}
.iconbtn{width:40px;height:40px;border-radius:var(--rctl);display:grid;place-items:center;color:var(--muted);margin-right:-8px}
.iconbtn svg{width:22px;height:22px}
.iconbtn:active{background:var(--sunk)}
.tabs{display:grid;grid-template-columns:repeat(5,1fr);border-bottom:1px solid var(--line);padding:0 max(12px,env(safe-area-inset-right,0px)) 0 max(12px,env(safe-area-inset-left,0px));background:var(--bg);position:relative;z-index:2}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:54px;padding:6px 0 8px;font-size:12px;font-weight:500;color:var(--muted);position:relative}
.tab svg{width:21px;height:21px}
.tico{display:grid;place-items:center}
.tab[aria-current="page"]{color:var(--ink);font-weight:600}
.tab[aria-current="page"] .tico{color:var(--accent)}
.tab[aria-current="page"]::after{content:"";position:absolute;left:22%;right:22%;bottom:-1px;height:2px;border-radius:2px;background:var(--accent)}
.view{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:18px max(20px,env(safe-area-inset-right,0px)) 40px max(20px,env(safe-area-inset-left,0px))}

/* ---------- surfaces ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--lift)}
.list{overflow:hidden;padding:0}
.sect{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin:14px 2px -2px}
.sect:first-child{margin-top:0}
.sect h2{font-size:16px;font-weight:600;color:var(--ink);letter-spacing:-.01em}
.sect span{font-size:13px;color:var(--muted);text-align:right}
.chip{display:inline-flex;align-items:center;gap:5px;font-weight:500;font-size:13px;padding:4px 10px;border-radius:999px;background:var(--surface);border:1px solid var(--line);color:var(--ink);white-space:nowrap}
.chip svg{width:15px;height:15px}
.chip.okc{color:var(--good);border-color:color-mix(in srgb,var(--good) 40%,var(--line))}
.chips{display:flex;gap:8px;align-items:center}

/* list rows: the one menu component */
.lrow{display:flex;align-items:center;gap:14px;width:100%;min-height:66px;padding:12px 16px;text-align:left;border-bottom:1px solid var(--line);transition:background .12s}
.lrow:last-child{border-bottom:0}
.lrow:active{background:var(--sunk)}
.ri{flex:none;width:36px;height:36px;border-radius:9px;display:grid;place-items:center;background:color-mix(in srgb,var(--rc,var(--accent)) 10%,var(--surface));color:var(--rc,var(--accent))}
.ri svg{width:19px;height:19px}
.ri b{font-size:14px;font-weight:600;font-variant-numeric:tabular-nums}
.rt{flex:1;min-width:0;display:flex;flex-direction:column}
.rt b{font-size:16px;font-weight:600;line-height:1.3;letter-spacing:-.005em}
.rt span{font-size:14px;color:var(--muted);line-height:1.35;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rt .lab{white-space:normal}
.rchev{flex:none;width:16px;height:16px;color:var(--faint)}
.lrow.static{cursor:default}
.lrow.static:active{background:none}
.lrow.static .ri{width:48px}
.lrow.static .ri b{font-size:13px}

/* progress */
.pbar{display:block;height:4px;border-radius:2px;background:var(--sunk);overflow:hidden}
.pbar i{display:block;height:100%;background:var(--accent);border-radius:2px;min-width:2px}
.pbar.thin{height:3px;margin-top:9px}

/* ---------- home ---------- */
.today{padding:18px 18px 16px;display:flex;flex-direction:column;gap:10px}
.today .trow{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.today .trow b{font-size:22px;font-weight:650;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.today .pbar{height:6px;border-radius:3px}
.today .pbar i{background:var(--accent);border-radius:3px}
.today .tmeta{font-size:14px;color:var(--muted)}
.tstat{display:flex;gap:14px;font-size:15px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--ink)}
.tstat span{display:inline-flex;align-items:center;gap:5px}
.tstat svg{width:17px;height:17px;color:var(--muted)}
.go{display:flex;align-items:center;gap:14px;padding:16px 16px 16px 18px;width:100%;text-align:left;border-color:var(--line)}
.go .dot{flex:none;width:14px;height:14px;border-radius:50%;border:3px solid var(--accent);background:var(--surface);box-shadow:0 0 0 5px var(--accent-soft)}
.go .rt b{font-size:18px}
.gobtn{flex:none;margin-left:auto;background:var(--accent);color:var(--accent-ink);border-radius:var(--rctl);padding:0 18px;height:42px;display:grid;place-items:center;font-weight:600;font-size:15px}
.sync{font-size:13px;color:var(--faint);display:flex;align-items:center;gap:6px;margin-top:2px}
.sync i{width:6px;height:6px;border-radius:50%;background:var(--line2)}
.sync.on i{background:var(--good)}
/* legacy home pieces kept consistent if rendered */
.hero{padding:20px;display:grid;grid-template-columns:1fr auto;gap:14px;align-items:center;background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.hero h1{font-size:28px}.hero p{margin:6px 0 0;color:var(--muted)}
.ring{width:80px;height:80px;position:relative}
.ring svg{width:80px;height:80px;transform:rotate(-90deg)}
.ring .rv{position:absolute;inset:0;display:grid;place-items:center;text-align:center;font-weight:650;font-size:18px;line-height:1;font-variant-numeric:tabular-nums}
.ring .rv small{display:block;font-size:12px;color:var(--muted);font-weight:500;margin-top:3px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mode{padding:14px;text-align:left;display:flex;flex-direction:column;gap:8px;min-height:112px}
.mode .mi{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent)}
.mode .mi svg{width:19px;height:19px}
.mode b{font-size:16px;font-weight:600;line-height:1.2}
.mode span{font-size:14px;color:var(--muted);line-height:1.35}
.week{display:flex;align-items:flex-end;gap:8px;height:70px;padding:0 4px}
.week div{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end}
.week i{display:block;width:100%;max-width:22px;border-radius:3px;background:var(--line2);min-height:3px}
.week i.goal{background:var(--accent)}
.week span{font-size:12px;color:var(--muted)}

/* ---------- chapters (a quiet tunnelbana line) ---------- */
.unit{overflow:hidden}
.uhead{display:flex;align-items:center;gap:14px;padding:14px 16px;width:100%;text-align:left;min-height:70px}
.uhead .ri{background:var(--accent-soft);color:var(--accent)}
.unit.open .uhead .ri{background:var(--accent);color:var(--accent-ink)}
.uhead b{display:block;font-size:17px;font-weight:600;line-height:1.25}
.uhead .rt span.pbar{margin-top:9px}
.uhead .chev{margin-left:auto;flex:none;color:var(--faint);transition:transform .2s}
.uhead .chev svg{width:20px;height:20px}
.unit.open .chev{transform:rotate(180deg)}
.stations{list-style:none;margin:0;padding:0 16px 10px;border-top:1px solid var(--line)}
.st{display:flex;align-items:center;position:relative}
.st button{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:8px 0;min-height:58px}
.st .pip{flex:none;width:36px;display:flex;justify-content:center;position:relative;align-self:stretch}
.st .pip::before{content:"";position:absolute;top:0;bottom:0;left:50%;width:2px;margin-left:-1px;background:var(--line2)}
.st:first-child .pip::before{top:50%}
.st:last-child .pip::before{bottom:50%}
.st .pip i{position:relative;z-index:1;align-self:center;width:12px;height:12px;border-radius:50%;background:var(--surface);border:2px solid var(--line2)}
.st.done .pip i{background:var(--accent);border-color:var(--accent)}
.st.done .pip::before{background:color-mix(in srgb,var(--accent) 45%,var(--line2))}
.st.here .pip i{width:16px;height:16px;border:3px solid var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.st .rt b{font-size:15px;font-weight:500}
.st.here .rt b{font-weight:650}
.st .rt span{font-size:13px;white-space:nowrap}
.crowns{flex:none;display:flex;gap:2px;color:var(--accent)}
.crowns svg{width:14px;height:14px}
.crowns .off{color:var(--line2)}
.delhead{font-size:13px;font-weight:500;color:var(--muted);margin:12px 2px -2px}
.ubadge{flex:none;min-width:36px;height:36px;padding:0 6px;border-radius:9px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:600;font-size:14px}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:0 20px;border-radius:var(--rctl);font-weight:600;font-size:16px;letter-spacing:-.005em;background:var(--accent);color:var(--accent-ink);border:1px solid transparent;transition:background .12s,transform .08s}
.btn:active{transform:scale(.985)}
.btn.ghost{background:var(--surface);color:var(--ink);border-color:var(--line2)}
.btn.block{width:100%}
.btn[disabled]{opacity:.4;pointer-events:none}
.btn svg{width:19px;height:19px}
.linkbtn{color:var(--accent);font-weight:500;font-size:14px;text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:3px;align-self:flex-start;padding:6px 0}
.back{display:inline-flex;align-items:center;gap:2px;height:40px;padding:0 10px 0 0;margin-left:-6px;font-weight:500;font-size:16px;color:var(--ink);flex:none}
.back svg{width:22px;height:22px;color:var(--muted)}

/* ---------- session ---------- */
.session{position:fixed;inset:0;background:var(--bg);z-index:30;display:flex;flex-direction:column;max-width:640px;margin:0 auto}
.shead{display:flex;align-items:center;gap:12px;padding:calc(env(safe-area-inset-top,0px) + 10px) max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px))}
.prog{flex:1;height:4px;border-radius:2px;background:var(--line);overflow:hidden}
.prog i{display:block;height:100%;border-radius:2px;background:var(--accent);transition:width .35s ease}
.combo{font-weight:600;font-size:14px;color:var(--muted);min-width:34px;text-align:right;font-variant-numeric:tabular-nums}
.combo svg{color:var(--sun)}
.timer{font-weight:600;font-size:16px;font-variant-numeric:tabular-nums;min-width:40px;text-align:right}
#clock{font-variant-numeric:normal;min-width:52px;justify-content:center}
#clock.late{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 45%,var(--line))}
.stage{flex:1;overflow-y:auto;padding:14px max(20px,env(safe-area-inset-right,0px)) 24px max(20px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:18px}
.stage>*{flex-shrink:0}
.qlabel{font-size:13px;font-weight:500;color:var(--muted);letter-spacing:0}
.qtitle{font-size:20px;font-weight:600;line-height:1.35;letter-spacing:-.01em}
.bigword{font-family:var(--display);font-weight:650;font-size:36px;line-height:1.08;letter-spacing:-.03em;word-break:break-word}
.bigword .art{color:var(--faint);font-weight:400}
.say{display:inline-flex;align-items:center;gap:8px}
.spk{flex:none;width:44px;height:44px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;transition:background .12s}
.spk:active{background:color-mix(in srgb,var(--accent) 20%,var(--surface))}
.spk svg{width:20px;height:20px}
.spk.sm{width:32px;height:32px}
.spk.sm svg{width:16px;height:16px}
.spk.slow{background:var(--surface);color:var(--accent);border:1px solid var(--line2)}
.spk.big{width:76px;height:76px;background:var(--accent);color:var(--accent-ink)}
.spk.big svg{width:32px;height:32px}
.forms{display:flex;flex-wrap:wrap;gap:6px}
.forms span{background:var(--sunk);border-radius:8px;padding:4px 9px;font-size:14px}
.forms span em{font-style:normal;color:var(--muted);font-size:12px;display:block;line-height:1.2}
.intro{padding:22px;display:flex;flex-direction:column;gap:12px}
.newtag{align-self:flex-start;background:var(--accent-soft);color:var(--accent);font-weight:600;font-size:12px;padding:3px 9px;border-radius:999px}
.ex{border-left:2px solid var(--accent);padding:2px 0 2px 12px}
.ex p{margin:0}
.ex p+p{color:var(--muted);font-size:14px}
.cloze{font-size:22px;line-height:1.5;font-weight:500;letter-spacing:-.01em}
.cloze u{text-decoration:none;display:inline-block;min-width:70px;border-bottom:2px solid var(--accent);text-align:center;color:var(--accent)}

/* answer options */
.opts{display:grid;gap:10px}
.opt{display:flex;align-items:center;gap:12px;text-align:left;padding:14px 16px;min-height:56px;border-radius:var(--rctl);background:var(--surface);border:1px solid var(--line2);font-size:16px;font-weight:500;line-height:1.3;transition:border-color .12s,background .12s}
.opt .k{flex:none;width:24px;height:24px;border-radius:6px;background:var(--sunk);display:grid;place-items:center;font-size:12px;font-weight:600;color:var(--muted)}
.opt.sel{border-color:var(--accent);background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent)}
.opt.sel .k{background:var(--accent);color:var(--accent-ink)}
.opt.right .k{background:var(--good);color:var(--surface)}.opt.wrong .k{background:var(--bad);color:var(--surface)}
.opt.right{border-color:var(--good);background:var(--good-bg);box-shadow:inset 0 0 0 1px var(--good)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg);box-shadow:inset 0 0 0 1px var(--bad)}
.opts.two{grid-template-columns:1fr 1fr}
.opts.two .opt{justify-content:center;font-size:24px;font-weight:600;min-height:76px;letter-spacing:-.02em}

/* typing */
.typebox{display:flex;flex-direction:column;gap:8px}
.typebox input,.typebox textarea{width:100%;padding:14px 16px;border-radius:var(--rctl);border:1px solid var(--line2);background:var(--surface);font-size:18px;outline:none;transition:border-color .12s,box-shadow .12s}
.typebox textarea{min-height:120px;font-size:16px;line-height:1.5;resize:vertical}
.typebox textarea.tall{min-height:260px}
.typebox input:focus,.typebox textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.keys{display:flex;gap:6px}
.keys button{width:44px;height:38px;border-radius:8px;background:var(--surface);border:1px solid var(--line2);font-weight:500;font-size:17px}
.keys button:active{background:var(--sunk)}

/* sentence building */
.tiles{display:flex;flex-wrap:wrap;gap:8px;min-height:50px;align-content:flex-start}
.answerline{border-bottom:1px solid var(--line2);padding-bottom:10px;min-height:62px}
.tile{padding:9px 13px;border-radius:8px;background:var(--surface);border:1px solid var(--line2);font-size:16px;font-weight:500}
.tile:active{background:var(--sunk)}
.tile.used{visibility:hidden}

/* matching */
.match{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.match .col{display:flex;flex-direction:column;gap:10px}
.mt{min-height:56px;padding:10px;border-radius:var(--rctl);background:var(--surface);border:1px solid var(--line2);font-weight:500;font-size:15px;line-height:1.25;text-align:center;transition:border-color .12s,opacity .2s}
.mt.sel{border-color:var(--accent);background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent)}
.mt.ok{opacity:.3;border-color:var(--good);pointer-events:none}
.mt.no{border-color:var(--bad);animation:shake .3s}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}

/* feedback footer */
.sfoot{padding:14px max(20px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 14px) max(20px,env(safe-area-inset-left,0px));border-top:1px solid var(--line);background:var(--bg);display:flex;flex-direction:column;gap:10px}
.sfoot.good{background:var(--good-bg);border-color:color-mix(in srgb,var(--good) 25%,transparent)}
.sfoot.bad{background:var(--bad-bg);border-color:color-mix(in srgb,var(--bad) 25%,transparent)}
.sfoot.close{background:var(--warn-bg);border-color:color-mix(in srgb,var(--warn) 25%,transparent)}
.fb{display:flex;gap:12px;align-items:flex-start}
.fb .fi{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;color:var(--surface);margin-top:1px}
.sfoot.good .fi{background:var(--good)} .sfoot.bad .fi{background:var(--bad)} .sfoot.close .fi{background:var(--warn)}
.fb .fi svg{width:16px;height:16px}
.fb h3{font-size:17px;font-weight:650}
.sfoot.good h3{color:var(--good)} .sfoot.bad h3{color:var(--bad)} .sfoot.close h3{color:var(--warn)}
.fb p{margin:3px 0 0;font-size:15px}
.fb .ans{font-weight:600;font-size:16px}
.sfoot.good .btn{background:var(--good);color:var(--surface)} .sfoot.bad .btn{background:var(--bad);color:var(--surface)} .sfoot.close .btn{background:var(--warn);color:var(--surface)}

/* reading */
.reader p{margin:0 0 14px;font-size:18px;line-height:1.65;max-width:62ch}
.reader .enp{color:var(--muted);font-size:15px;border-left:2px solid var(--line2);padding-left:12px}
.para{display:flex;gap:12px;align-items:flex-start}
.para .spk{margin-top:3px}
.seg{display:flex;background:var(--sunk);border-radius:var(--rctl);padding:3px;gap:2px}
.seg button{flex:1;padding:8px 6px;border-radius:8px;font-weight:500;font-size:14px;color:var(--muted);transition:background .12s,color .12s}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(19,32,43,.08)}

/* completion */
.done-hero{text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px;padding-top:28px}
.done-hero .medal{width:64px;height:64px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;margin-bottom:4px}
.done-hero .medal svg{width:28px;height:28px}
.done-hero h1{font-size:28px}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:0;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);margin-top:6px;overflow:hidden}
.kpi{padding:14px 8px;text-align:center;border:0;border-radius:0;border-left:1px solid var(--line);background:none}
.kpi:first-child{border-left:0}
.kpi b{display:block;font-size:22px;font-weight:650;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.kpi span{font-size:13px;color:var(--muted)}

/* flashcards */
.fc{perspective:1200px;flex:1;min-height:340px;display:flex}
.fcin{position:relative;flex:1;transition:transform .45s cubic-bezier(.3,.7,.3,1);transform-style:preserve-3d}
.fc.flip .fcin{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;padding:24px;display:flex;flex-direction:column;gap:12px;justify-content:center;align-items:center;text-align:center;overflow:auto}
.face.back{transform:rotateY(180deg)}
.face .tag{position:absolute;top:14px;left:16px}
.rate{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.rate button{min-height:56px;border-radius:var(--rctl);font-weight:600;font-size:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;border:1px solid var(--line2);background:var(--surface)}
.rate button:active{background:var(--sunk)}
.rate button small{font-weight:400;font-size:12px;color:var(--muted)}
.rate .r1{color:var(--bad)} .rate .r2{color:var(--warn)} .rate .r3{color:var(--good)} .rate .r4{color:var(--accent)}
.rate button.sug{border-color:currentColor;box-shadow:inset 0 0 0 1px currentColor}
.rate button small{display:block}

/* memory */
.mem{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mc{display:block;width:100%;aspect-ratio:3/3.4;max-width:100%;perspective:800px}
.mc .in{display:block;position:relative;width:100%;height:100%;transition:transform .35s;transform-style:preserve-3d}
.mc.up .in,.mc.got .in{transform:rotateY(180deg)}
.mc .f,.mc .b{position:absolute;inset:0;border-radius:var(--rctl);backface-visibility:hidden;-webkit-backface-visibility:hidden;display:grid;place-items:center;padding:8px;text-align:center;font-weight:500;font-size:14px;line-height:1.25;overflow-wrap:anywhere;hyphens:auto;-webkit-hyphens:auto}
.mc .f{background:var(--surface);border:1px solid var(--line)}
.mc .f .sfib{font-size:15px;padding:5px 7px 4px}
.mc .b{transform:rotateY(180deg);background:var(--surface);border:1px solid var(--accent)}
.mc .b.sv{font-size:16px;font-weight:600}
.mc.got .b{border-color:var(--good);background:var(--good-bg)}
.mc.miss .b{border-color:var(--bad)}

/* dictionary */
.search{position:relative}
.search input{width:100%;padding:13px 14px 13px 42px;border-radius:var(--rctl);border:1px solid var(--line2);background:var(--surface);font-size:16px;outline:none}
.search input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.search svg{position:absolute;left:14px;top:50%;margin-top:-9px;width:18px;height:18px;color:var(--faint)}
.fchips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.fchips::-webkit-scrollbar{display:none}
.fchips button{flex:none;padding:6px 12px;border-radius:999px;border:1px solid var(--line2);background:var(--surface);font-weight:500;font-size:14px;color:var(--muted)}
.fchips button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.wl{list-style:none;margin:0;padding:0}
.wl li{display:flex;gap:12px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line)}
.wl li:last-child{border-bottom:0}
.wl .wt{flex:1;min-width:0}
.wl .wt b{font-size:16px;font-weight:600}
.wl .wt .art{color:var(--faint);font-weight:400}
.wl .wt div{font-size:14px;color:var(--muted)}
.wl .wt .ff{font-size:13px;color:var(--faint);margin-top:2px}
.lv{flex:none;width:4px;height:26px;border-radius:2px;background:var(--line)}
.lv.l1{background:var(--bad)}.lv.l2{background:var(--warn)}.lv.l3{background:color-mix(in srgb,var(--good) 55%,var(--line2))}.lv.l4,.lv.l5{background:var(--good)}
.libitem{padding:14px 16px;width:100%;text-align:left;display:flex;gap:12px;align-items:center}
.libitem b{display:block;font-size:16px}

/* sheet (settings) */
.sheet{position:fixed;inset:0;z-index:50;background:rgba(10,18,26,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet .panel{background:var(--bg);width:100%;max-width:640px;border-radius:18px 18px 0 0;max-height:88%;overflow:auto;padding:20px max(20px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 20px) max(20px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px}
.sheet .panel h2{font-size:22px}
.pick{display:flex;flex-wrap:wrap;gap:8px}
.pick button{padding:8px 14px;border-radius:999px;border:1px solid var(--line2);background:var(--surface);font-weight:500;font-size:14px}
.pick button[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}

/* results review */
.review{padding:4px 16px!important}
.review ul{padding:0;margin:0}
.review li{padding:14px 0;border-bottom:1px solid var(--line);list-style:none}
.review li:last-child{border-bottom:0}
.review h3{font-size:16px;font-weight:600;margin:14px 0 2px}
.review .ok{color:var(--good);font-weight:600}.review .no{color:var(--bad);font-weight:600}
.review details summary{cursor:pointer;color:var(--accent);font-weight:500;margin-top:10px;font-size:14px}
.rv{display:flex;gap:10px;margin-top:8px}

/* misc */
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 28px);transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:500;font-size:14px;z-index:60;max-width:90%;text-align:center;box-shadow:0 6px 20px rgba(0,0,0,.18)}
.aifb{background:var(--surface);border:1px solid var(--line);border-left:2px solid var(--accent);border-radius:var(--rctl);padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.aifb .eyebrow{color:var(--accent);font-weight:600}
.aifb p{margin:0;font-size:15px;line-height:1.5}
.aifb .spk{vertical-align:middle}
.aiwait{display:flex;align-items:center;justify-content:center;gap:10px;min-height:50px;font-weight:500;color:var(--muted)}
.spin{width:18px;height:18px;border-radius:50%;border:2px solid var(--line2);border-top-color:var(--accent);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* grammar */
.gcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;display:flex;flex-direction:column;gap:10px}
.gcard h3{font-size:14px;font-weight:600;color:var(--muted)}
.rules{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:7px;font-size:16px;line-height:1.5}
.rules li::marker{color:var(--faint)}
.gtable{overflow-x:auto;margin:0 -4px}
.gtable table{border-collapse:collapse;font-size:14px;min-width:100%}
.gtable th{text-align:left;font-size:13px;color:var(--muted);font-weight:500;padding:7px 8px;border-bottom:1px solid var(--line2);white-space:nowrap}
.gtable td{padding:8px;border-bottom:1px solid var(--line);white-space:nowrap}
.gtable tr:last-child td{border-bottom:0}
.gtable td.k{font-weight:600;color:var(--ink)}
.exl,.pit{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.exl li{display:flex;gap:12px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.exl li:last-child,.pit li:last-child{border-bottom:0}
.exl li div,.pit li div{display:flex;flex-direction:column;min-width:0}
.exl b{font-size:16px;font-weight:600}.exl span{font-size:14px;color:var(--muted)}
.pit li{padding:9px 0;border-bottom:1px solid var(--line)}
.pit s{color:var(--bad);font-size:14px;text-decoration-thickness:1px}.pit b{color:var(--good);font-size:16px;font-weight:600}.pit span{font-size:14px;color:var(--muted)}

/* mock exam */
.xtext{padding:18px;display:flex;flex-direction:column;gap:6px}
.xtext h3{margin:0 0 4px;font-size:19px;font-weight:650;letter-spacing:-.015em}

.xqs{display:flex;flex-direction:column;gap:18px}
.xq{display:flex;flex-direction:column;gap:8px}

.xn{flex:none;display:inline-grid;place-items:center;min-width:22px;height:22px;border-radius:6px;background:var(--sunk);color:var(--muted);font-size:12px;font-weight:600;margin-right:8px;font-variant-numeric:tabular-nums}
.xqq .xn{margin:1px 0 0}
.xopts{display:grid;gap:8px}
.xo{display:flex;align-items:center;gap:10px;text-align:left;padding:11px 14px;min-height:48px;border-radius:var(--rctl);background:var(--surface);border:1px solid var(--line2);font-size:15px;font-weight:400;line-height:1.35;transition:border-color .12s,background .12s}
.xo .k{flex:none;width:22px;height:22px;border-radius:6px;display:grid;place-items:center;background:var(--sunk);color:var(--muted);font-size:12px;font-weight:600}
.xo.sel{border-color:var(--accent);background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent)}
.xo.sel .k{background:var(--accent);color:var(--accent-ink)}
.xsel{width:100%;min-height:48px;padding:0 12px;border-radius:var(--rctl);border:1px solid var(--line2);background:var(--surface);color:var(--ink);font:inherit;font-size:15px}
.xsel:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.xsel.inl{display:inline-block;width:auto;min-height:34px;padding:0 6px;margin:2px 0;font-size:15px;border-color:var(--accent);background:var(--accent-soft)}
.navrow{display:flex;gap:10px}.navrow .btn{flex:1}
.playrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.livebox{padding:14px 16px;display:flex;flex-direction:column;gap:6px;border-color:color-mix(in srgb,var(--bad) 35%,var(--line))}
.livebox p{margin:0;font-size:16px;line-height:1.55}
.recdot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--bad);margin-right:6px;animation:pulse 1.2s infinite}
@keyframes pulse{50%{opacity:.25}}
#rec.stop,.stopbig{background:var(--bad);color:var(--surface)}
.stopbig{min-height:56px}
.stopbig svg{width:16px;height:16px}
.statrow{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
details.ctx summary{cursor:pointer;color:var(--accent);font-weight:500;font-size:14px}
details.ctx .reader p{font-size:14px}
.about{padding:16px 18px}
.about summary{cursor:pointer;display:flex;flex-direction:column;gap:2px;list-style:none}

.about .rules{margin-top:12px;font-size:14px}
audio{height:40px}
.dm{padding:18px;display:flex;flex-direction:column;gap:10px;background:var(--surface);border-left:3px solid var(--sun)}

.dmhead .chip svg{width:14px;height:14px}

.dmsv{margin:0;flex:1;font-size:22px;font-weight:600;line-height:1.3;letter-spacing:-.015em}
.dmen{margin:-4px 0 0;color:var(--muted);font-size:15px}
.dmrow{display:flex;justify-content:space-between;align-items:center;gap:10px}
.dmrow .btn{min-height:42px;font-size:15px;padding:0 16px}
.sftag{min-width:0;overflow:hidden;display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:#005A8E;background:#E3F0F8;border-radius:999px;padding:4px 10px 4px 6px;line-height:1.2;max-width:100%}

svg.flag{width:20px;height:13px;flex:none;border-radius:2px;box-shadow:0 0 0 1px rgba(0,0,0,.06)}

.sfhead{display:flex;justify-content:space-between;align-items:center;gap:8px;min-width:0}.sfhead .chip{flex:none}

.sfq{margin:2px 0 0;font-size:18px;font-weight:600;line-height:1.35;letter-spacing:-.01em}

@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .sftag{background:#123049;color:#9ED0F2}:root:not([data-theme="light"]) .sfc{border-color:#24496A;background:linear-gradient(180deg,#132A3E 0,var(--surface) 120px)}:root:not([data-theme="light"]) .sffact{background:#2E2A17}}

.bd:not(.got) svg.flag{filter:grayscale(1);opacity:.45}
.homefoot{display:flex;justify-content:space-between;align-items:center;gap:12px}.homefoot .linkbtn{font-size:13px}

.week span.tod{color:var(--ink);font-weight:600}

.lang{display:flex;background:var(--sunk);border-radius:999px;padding:2px;gap:0}

.instbtn{white-space:nowrap}.instbtn .ls{display:none}
@media (max-width:400px){.instbtn .ll{display:none}.instbtn .ls{display:inline}.brand b{font-size:18px}.sfib{font-size:14px}}
.instbtn{display:inline-flex;align-items:center;gap:5px;height:32px;padding:0 12px 0 10px;border-radius:999px;background:var(--sun);color:#1D4F82;font-size:13px;font-weight:600;letter-spacing:-.005em}

.steps{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:10px;font-size:16px;line-height:1.5}

/* life: moose, illustrations, celebrations, badges */
.greet{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:0 2px -4px}
.greet h2{font-size:24px;font-weight:650;letter-spacing:-.02em}
.greet span{font-size:14px;color:var(--muted)}
.greet .mz{width:78px;flex:none;margin-bottom:-8px}
.mz svg{display:block;width:100%;height:auto}
.done-hero .mz{width:170px;margin-bottom:-6px}
.mz.sm{width:72px;flex:none}
.mz.xs{width:52px;flex:none}
.banner{display:block;width:100%;background:var(--sky,#DCE8F3);overflow:hidden}
.banner svg{display:block;width:100%;height:auto}
.go2{display:flex;flex-direction:column;align-items:stretch;padding:0;gap:0;overflow:hidden}

.gorow{display:flex;align-items:center;gap:14px;padding:14px 16px}
.ubanner{aspect-ratio:640/220;border-top:1px solid var(--line)}
.ubanner svg,.donebanner svg{height:100%}
.donebanner{border-radius:var(--r);aspect-ratio:640/240;margin-bottom:-24px}
.gtitle{display:flex;align-items:center;gap:12px}
.gtitle h1{font-size:26px}
.pep{display:flex;align-items:center;gap:10px;background:var(--surface);border-radius:var(--rctl);padding:8px 12px 8px 6px;border:1px solid var(--line)}
.pep p{margin:0;font-size:14px;line-height:1.4;color:var(--ink)}
.badge-new{display:inline-flex;align-items:center;gap:6px;background:#FFF4D1;color:#7A5800;font-weight:600;font-size:13px;padding:6px 12px;border-radius:999px;margin:2px}
.badge-new svg{width:15px;height:15px}
.goalhit{display:inline-flex;align-items:center;gap:6px;color:#8A6400;font-weight:600;margin:6px 0 0}
.goalhit svg{width:16px;height:16px;color:var(--sun)}
.tstat .lit svg{color:var(--sun);animation:flame 1.4s ease-in-out infinite}
@keyframes flame{50%{transform:scale(1.18) rotate(-4deg)}}
.badges{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;padding:10px 8px}
.bd{display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px;padding:10px 4px}
.bd .bi{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:var(--sunk);color:var(--faint);border:2px dashed var(--line2)}
.bd .bi svg{width:22px;height:22px}
.bd b{font-size:12px;font-weight:600;line-height:1.25;color:var(--muted)}
.bd small{display:none}
.bd.got .bi{background:radial-gradient(circle at 35% 30%,#F6D96B,#E9B518 60%,#C99300);color:#1D4F82;border:2px solid #fff;box-shadow:0 0 0 2px #E9B518}
.bd.got b{color:var(--ink)}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:70;overflow:hidden}
.confetti i{position:absolute;top:-14px;width:9px;height:13px;border-radius:2px;animation:fall 2.2s cubic-bezier(.25,.6,.4,1) forwards;opacity:.95}
@keyframes fall{to{top:105%;transform:translateX(30px) rotate(540deg)}}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .badge-new{background:#3A3010;color:#F2D27A}:root:not([data-theme="light"]) .goalhit{color:#F2D27A}:root:not([data-theme="light"]) .banner{filter:brightness(.92) saturate(.95)}}
</style>
</head>

rige.","fe":"Norden (the Nordic countries) is five countries: Denmark, Finland, Iceland, Norway and Sweden."},{"n":4,"ch":0,"q":"Vilket är Sveriges högsta berg?","qe":"Which is Sweden's highest mountain?","o":["Kebnekaise","Skanderna","Treriksröset","Smygehuk"],"a":0,"f":"Sveriges högsta berg heter Kebnekaise. Det är ungefär 2 000 meter högt.","fe":"Sweden's highest mountain is Kebnekaise, about 2,000 metres high."},{"n":5,"ch":0,"q":"Vilka är Sveriges tre största sjöar?","qe":"Which are Sweden's three largest lakes?","o":["Vänern, Östersjön och Vättern","Kattegatt, Vänern och Mälaren","Mälaren, Siljan och Hjälmaren","Vänern, Vättern och Mälaren"],"a":3,"f":"Sveriges tre största sjöar är Vänern, Vättern och Mälaren.","fe":"Sweden's three largest lakes are Vänern, Vättern and Mälaren."},{"n":6,"ch":0,"q":"Hur många landskap finns det i Sverige?","qe":"How many landskap does Sweden have?","o":["290","21","25","29"],"a":2,"f":"Sverige har 25 landskap. Förr hade landskapen egna lagar. Sverige har också 21 län och 290 kommuner.","fe":"Sweden has 25 landskap (historical provinces), which once had their own laws. It also has 21 counties and 290 municipalities."},{"n":7,"ch":0,"q":"Var finns Sveriges största järnmalmsgruvor?","qe":"Where are Sweden's largest iron-ore mines located?","o":["Norrbottens län","Skåne län","Stockholms län","Gotlands län"],"a":0,"f":"Sveriges största järnmalmsgruvor finns i Norrbottens län, till exempel i Kiruna.","fe":"Sweden's largest iron-ore mines are in Norrbottens län, for example in Kiruna."},{"n":8,"ch":0,"q":"Vilket är ett av Sveriges klimatpolitiska mål för år 2045?","qe":"What is one of Sweden's climate-policy objectives for 2045?","o":["All el ska bara komma från solkraft","Utsläppen av växthusgaser ska vara så nära noll som möjligt","Staten ska äga all skog","Privata bilar ska förbjudas"],"a":1,"f":"Sveriges klimatmål: år 2045 ska utsläppen av växthusgaser vara så nära noll som möjligt.","fe":"Sweden's climate goal: by 2045 greenhouse-gas emissions should be as close to zero as possible."},{"n":9,"ch":1,"q":"Vad betyder ordet demokrati?","qe":"What does the word democracy mean?","o":["Kungen styr","Domarna styr","Myndigheterna styr","Folket styr"],"a":3,"f":"Demokrati betyder att folket styr. Ordet kommer från grekiskan.","fe":"Democracy means rule by the people. The word comes from Greek."},{"n":10,"ch":1,"q":"Vad innebär fria val enligt materialet?","qe":"What makes an election free according to the material?","o":["Bara partimedlemmar får rösta","Varje röstberättigad har en röst och kan rösta utan hot eller tvång","Väljarna måste säga öppet vad de röstar på","Regeringen väljer vilka kandidater som får ställa upp"],"a":1,"f":"Fria val betyder att alla röstberättigade har en röst och kan rösta utan hot eller tvång.","fe":"Free elections mean every eligible voter has one vote and can vote without threats or pressure."},{"n":11,"ch":1,"q":"Varför är valen hemliga?","qe":"Why are elections secret?","o":["Bara valarbetarna får veta vem som röstade","Rösterna kan räknas utan vittnen","Ingen ska behöva berätta vad man röstar på","Partierna får inte veta resultatet"],"a":2,"f":"Valen är hemliga. Ingen ska behöva berätta vad man har röstat på.","fe":"Elections are secret: nobody should have to say how they voted."},{"n":12,"ch":1,"q":"Vad betyder rättssäkerhet?","qe":"What does rättssäkerhet mean?","o":["Bara medborgare får använda domstolarna","Alla är lika inför lagen och har rätt till en rättvis rättegång","Alla brott ska ge fängelse","Domstolarna ska följa regeringens order"],"a":1,"f":"Rättssäkerhet betyder att alla är lika inför lagen och har rätt till en rättvis rättegång.","fe":"Rättssäkerhet (rule of law) means everyone is equal before the law and has the right to a fair trial."},{"n":13,"ch":1,"q":"Vilken handling är ett exempel på demokratiskt deltagande?","qe":"Which action is an example of democratic participation?","o":["Att sprida falsk information med flit","Att hota en journalist","Att hindra någon från att rösta","Att starta eller skriva under en namninsamling"],"a":3,"f":"Att starta eller skriva under en namninsamling är ett sätt att delta i demokratin.","fe":"Starting or signing a petition is one way of taking part in democracy."},{"n":14,"ch":1,"q":"Varför kan ett lågt valdeltagande försvaga demokratin?","qe":"Why can low voter turnout weaken democracy?","o":["Kommunerna kan inte ta in skatt","Valet blir ogiltigt","Kungen får mer makt","Människor kan få mindre inflytande över politiska beslut"],"a":3,"f":"Om få människor röstar kan folket få mindre inflytande över politiken. Det kan försvaga demokratin.","fe":"If few people vote, people can lose influence over politics. That can weaken democracy."},{"n":15,"ch":1,"q":"Vad betyder integration i materialet?","qe":"What does integration mean in the material?","o":["Människor med olika bakgrund ska bo i olika områden","Alla ska vara med i samma parti","Människor med olika bakgrund och ekonomi bor närmare varandra och känner sig delaktiga i samhället","Alla kommuner ska ha lika många invånare"],"a":2,"f":"Integration betyder att människor med olika bakgrund och ekonomi lever närmare varandra och känner sig delaktiga i samhället.","fe":"Integration means people with different backgrounds and finances live closer together and feel part of society."},{"n":16,"ch":2,"q":"På vilka nivåer är det politiska ansvaret fördelat i Sverige?","qe":"At which levels is political responsibility divided in Sweden?","o":["Nationell, regional och kommunal nivå","Bara kommunal nivå och domstolsnivå","Bara nationell och internationell nivå","Bara läns- och församlingsnivå"],"a":0,"f":"Den politiska makten i Sverige finns på tre nivåer: staten, regionerna och kommunerna.","fe":"Political power in Sweden sits at three levels: national, regional and municipal."},{"n":17,"ch":2,"q":"Hur många ledamöter har riksdagen?","qe":"How many members does riksdagen (parliament) have?","o":["350","21","290","349"],"a":3,"f":"Riksdagen har 349 ledamöter. De väljs av folket.","fe":"Riksdagen (parliament) has 349 members, elected by the people."},{"n":18,"ch":2,"q":"Vem väljer statsministern?","qe":"Who elects the prime minister?","o":["Riksdagen","Högsta domstolen","Regionerna","Kungen"],"a":0,"f":"Det är riksdagen som väljer statsministern.","fe":"Riksdagen (parliament) chooses the prime minister."},{"n":19,"ch":2,"q":"Vem väljer ministrarna i regeringen?","qe":"Who chooses the ministers in the government?","o":["Kommunfullmäktige","Statsministern","Hela riksdagen","Kungen"],"a":1,"f":"Statsministern väljer själv ministrarna i regeringen.","fe":"The prime minister chooses the ministers in the government."},{"n":20,"ch":2,"q":"Vad är budgetpropositionen?","qe":"What is budgetpropositionen?","o":["En dom om kommunalskatt","En regional plan för kollektivtrafik","Oppositionens lista med kandidater","Regeringens förslag till riksdagen om statens inkomster och utgifter"],"a":3,"f":"Budgetpropositionen är regeringens förslag till riksdagen om statens inkomster och utgifter.","fe":"Budgetpropositionen is the government's proposal to parliament on state income and spending."},{"n":21,"ch":2,"q":"Vilken uppgift har oppositionen?","qe":"What is the opposition’s role?","o":["Att genomföra alla regeringens beslut","Att representera kungafamiljen","Att utse domare","Att granska regeringen och föreslå en annan politik"],"a":3,"f":"Oppositionen är partierna som inte sitter i regeringen. De granskar regeringen och föreslår en annan politik.","fe":"The opposition is the parties outside government. They scrutinise it and propose other policies."},{"n":22,"ch":2,"q":"Vilket är regionernas främsta ansvarsområde?","qe":"What is the principal responsibility of the regions?","o":["Att utfärda pass","Hälso- och sjukvård","Försvaret","Utrikespolitiken"],"a":1,"f":"Regionernas viktigaste uppgift är hälso- och sjukvården.","fe":"The regions' main responsibility is health and medical care."},{"n":23,"ch":2,"q":"Vad innebär "n":28,"ch":3,"q":"Vad blev resultatet av folkomröstningen om euron år 2003?","qe":"What was the result of the 2003 referendum on the euro?","o":["Sverige behöll kronan","Resultatet blev ogiltigt","Sverige bytte till euro direkt","Sverige lämnade EU"],"a":0,"f":"I folkomröstningen 2003 röstade svenskarna nej till euron. Sverige behöll kronan.","fe":"In the 2003 referendum Swedes voted no to the euro, so Sweden kept the krona."},{"n":29,"ch":3,"q":"Vad betyder proportionella val?","qe":"What does a proportional election mean?","o":["Det största partiet får alla platser","Varje kommun får en plats","Kungen delar ut platserna","Partierna får platser efter hur stor andel av rösterna de får"],"a":3,"f":"Proportionella val betyder att partierna får platser efter hur stor andel av rösterna de får.","fe":"Proportional elections: parties get seats according to their share of the vote."},{"n":30,"ch":3,"q":"Hur stor andel av rösterna i riksdagsvalet måste ett parti normalt få för att komma in i riksdagen?","qe":"What percentage of the national vote must a party normally receive to enter riksdagen (parliament)?","o":["Tio procent","Fyra procent","Två procent","Fem procent"],"a":1,"f":"Ett parti behöver normalt minst fyra procent av rösterna för att komma in i riksdagen.","fe":"A party normally needs at least 4% of the vote to enter parliament."},{"n":31,"ch":4,"q":"Hur många grundlagar har Sverige?","qe":"How many fundamental laws does Sweden have?","o":["Sju","Tre","Fem","Fyra"],"a":3,"f":"Sverige har fyra grundlagar: regeringsformen, successionsordningen, tryckfrihetsförordningen och yttrandefrihetsgrundlagen.","fe":"Sweden has four fundamental laws: regeringsformen, successionsordningen, tryckfrihetsförordningen and yttrandefrihetsgrundlagen."},{"n":32,"ch":4,"q":"Vilken grundlag säger att all offentlig makt utgår från folket?","qe":"Which fundamental law states that all public power proceeds from the people?","o":["Tryckfrihetsförordningen","Yttrandefrihetsgrundlagen","Successionsordningen","Regeringsformen"],"a":3,"f":"Regeringsformen säger att all offentlig makt i Sverige utgår från folket.","fe":"Regeringsformen (the Instrument of Government) says all public power comes from the people."},{"n":33,"ch":4,"q":"Vad skyddar tryckfrihetsförordningen?","qe":"What does tryckfrihetsförordningen protect?","o":["Regeringens rätt att utse domare","Ordningen för vem som blir kung","Rätten till gratis universitet","Det fria ordet i tryck"],"a":3,"f":"Tryckfrihetsförordningen skyddar det fria ordet i tryckt form, till exempel i tidningar och böcker.","fe":"Tryckfrihetsförordningen protects the free word in print, such as newspapers and books."},{"n":34,"ch":4,"q":"Vad bestämmer successionsordningen?","qe":"What does successionsordningen determine?","o":["Vem som blir kung eller drottning efter den nuvarande","Hur riksdagsval går till","Vilka mål Högsta domstolen ska ta","Hur kommuner sätter skatten"],"a":0,"f":"Successionsordningen bestämmer vem som blir kung eller drottning efter den nuvarande.","fe":"Successionsordningen decides who becomes king or queen after the current monarch."},{"n":35,"ch":4,"q":"Vilket viktigt ansvar har man enligt allemansrätten?","qe":"What is an important responsibility under allemansrätten?","o":["Inte skada naturen eller störa markägaren","Bara tälta på kommunens mark","Alltid fråga staten innan man går in i skogen","Plocka alla fridlysta växter"],"a":0,"f":"Allemansrätten ger dig rätt att vara i naturen. Men du får inte skada naturen eller störa markägaren.","fe":"Allemansrätten lets you roam in nature, but you must not damage it or disturb the landowner."},{"n":36,"ch":4,"q":"Vilken myndighet avgör om en person som misstänks för brott ska ställas inför domstol?","qe":"Which authority decides whether a suspected person should be brought before a court?","o":["Åklagarmyndigheten","Skatteverket","Försäkringskassan","Arbetsförmedlingen"],"a":0,"f":"Det är åklagaren (Åklagarmyndigheten) som bestämmer om en misstänkt
