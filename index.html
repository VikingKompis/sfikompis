lagen","Successionsordningen","Diskrimineringslagen"],"a":1,"f":"Religionsfrihetslagen från 1951 gav full religionsfrihet. Man får välja religion helt fritt, eller ingen religion alls.","fe":"The 1951 Freedom of Religion Act gave full religious freedom: choose any religion, or none."},{"n":94,"ch":11,"q":"Vad hände med Svenska kyrkan år 2000?","qe":"What happened to Svenska kyrkan in 2000?","o":["Den slutade finnas","Den blev det enda lagliga samfundet","Den fick ansvar för riksdagsvalen","Den skildes från staten och blev ett av flera trossamfund"],"a":3,"f":"År 2000 skildes Svenska kyrkan från staten. Den är nu ett av flera trossamfund.","fe":"In 2000 the Church of Sweden was separated from the state and became one of several faith communities."},{"n":95,"ch":11,"q":"Ungefär hur många medlemmar har Svenska kyrkan enligt materialet?","qe":"Approximately how many members does Svenska kyrkan have according to the material?","o":["Tjugofem miljoner","Elva miljoner","Fem miljoner","En miljon"],"a":2,"f":"Svenska kyrkan har ungefär fem miljoner medlemmar.","fe":"The Church of Sweden has about five million members."},{"n":96,"ch":11,"q":"Vilken religion beskrivs som den näst största i dagens Sverige?","qe":"Which religion is described as the second largest in present-day Sweden?","o":["Buddhism","Hinduism","Judendom","Islam"],"a":3,"f":"Islam är den näst största religionen i dagens Sverige.","fe":"Islam is the second-largest religion in Sweden today."},{"n":97,"ch":12,"q":"Varför är den 6 juni Sveriges nationaldag?","qe":"Why is 6 June Sweden's nationaldag?","o":["Det är dagen då Sverige gick med i Nato","Det är dagen då Sverige gick med i EU","Gustav Vasa valdes till kung 1523 och en ny regeringsform antogs 1809","Det är minnet av första valet där kvinnor röstade"],"a":2,"f":"Nationaldagen den 6 juni: Gustav Vasa valdes till kung den dagen 1523, och 1809 fick Sverige en ny regeringsform.","fe":"National Day, 6 June: Gustav Vasa was elected king on that day in 1523, and a new constitution was adopted in 1809."},{"n":98,"ch":12,"q":"När firas midsommarafton?","qe":"When is midsommarafton celebrated?","o":["Första söndagen i juli","En fredag mellan 19 och 25 juni","Alltid den 6 juni","Den 30 april"],"a":1,"f":"Midsommarafton firas på en fredag mellan 19 och 25 juni.","fe":"Midsummer Eve is celebrated on a Friday between 19 and 25 June."},{"n":99,"ch":12,"q":"Vad brukar man göra på Alla helgons dag?","qe":"What is commonly done on Alla helgons dag?","o":["Barnen öppnar sista luckan i adventskalendern","Man tänder ljus på släktingars och vänners gravar","Facket ordnar demonstrationer","Man tänder stora brasor för att välkomna våren"],"a":1,"f":"På Alla helgons dag tänder många ljus på gravarna till släktingar och vänner.","fe":"On All Saints' Day many people light candles on the graves of relatives and friends."},{"n":100,"ch":12,"q":"Vilken högtid markerar slutet på fastemånaden ramadan?","qe":"Which tradition marks the end of the fasting month ramadan?","o":["Newroz","Lucia","Nouruz","Id al-fitr"],"a":3,"f":"Id al-fitr är högtiden som avslutar fastemånaden ramadan.","fe":"Id al-fitr is the festival that ends the fasting month of Ramadan."}]},"MK":{"mocks":[{"id":"p1","name":"Provträning 1","theme":"Vardag, boende och fritid","lasaA":[{"kind":"Annons","title":"Öppet hus på Solbergas vuxenutbildning","body":"Välkommen till öppet hus tisdagen den 14 mars kl. 15–19!\n\nKom och träffa våra lärare och studievägledare. Du kan få information om sfi, svenska som andraspråk och våra yrkesutbildningar inom vård, bygg och restaurang.\n\nStudievägledarna finns i rum 112 mellan kl. 16 och 18. Ta med betyg och intyg om du vill prata om just din utbildning.\n\nVi bjuder på kaffe och smörgås i matsalen. Barn är välkomna, och det finns en lekhörna på bottenvåningen.\n\nAnmälan behövs inte. Frågor? Ring receptionen på 08-123 45 00.","qs":[{"q":"När kan man träffa en studievägledare?","a":"Mellan kl. 16 och 18","o":["Hela kvällen, kl. 15–19","Mellan kl. 16 och 18","Bara före kl. 16","Efter att man har anmält sig"],"e":""},{"q":"Vad är bra att ta med sig?","a":"Betyg och intyg","o":["Kaffe och smörgås","En anmälan","Betyg och intyg","Legitimation och pengar"],"e":""},{"q":"Vad gäller för barn?","a":"De får följa med och kan leka på bottenvåningen.","o":["De måste anmälas i förväg.","De får följa med och kan leka på bottenvåningen.","De får inte följa med.","De får äta gratis i rum 112."],"e":""}]},{"kind":"Tabell","title":"Ekbackens simhall – priser","body":"Entré | Vuxen | Pensionär | Barn 4–17 år\nEnkelbiljett | 70 kr | 50 kr | 35 kr\nKlippkort 10 gånger | 600 kr | 420 kr | 300 kr\nMånadskort | 450 kr | 300 kr | 200 kr\n\nBarn under 4 år badar gratis i sällskap av en vuxen. Måndag–fredag kl. 6–9 är det motionssim med halva priset för alla.","qs":[{"q":"Hur mycket kostar ett klippkort för en pensionär?","a":"420 kr","o":["300 kr","420 kr","450 kr","600 kr"],"e":""},{"q":"När kan en vuxen simma för 35 kronor?","a":"En vardag mellan kl. 6 och 9","o":["På helgen","En vardag mellan kl. 6 och 9","Med ett barn under 4 år","Aldrig"],"e":"Halva priset av 70 kr är 35 kr."}]},{"kind":"E-post","title":"Från: Bostadsbolaget Hemma · Ämne: Stambyte i ditt hus","body":"Hej!\n\nUnder april och maj byter vi alla vatten- och avloppsrör i Lindvägen 4–8. Arbetet tar ungefär fyra veckor per trappuppgång. Under den tiden kan du inte använda badrummet. Du kan i stället duscha och använda toalett i en vagn på gården.\n\nVi behöver kunna komma in i din lägenhet. Om du inte är hemma, lämna en nyckel på vårt kontor senast den 25 mars. Vi kommer att skicka en exakt tidsplan för din trappuppgång två veckor innan arbetet börjar.\n\nHar du frågor eller särskilda behov, till exempel på grund av en funktionsnedsättning, kontakta oss så snart som möjligt.\n\nVänliga hälsningar\nAnna Berg, förvaltare","qs":[{"q":"Varför skriver bostadsbolaget?","a":"För att informera om en renovering","o":["För att höja hyran","För att informera om en renovering","För att sälja lägenheter","För att boka en visning"],"e":""},{"q":"Vad ska hyresgästerna göra om de inte är hemma?","a":"Lämna en nyckel på kontoret före den 25 mars","o":["Ringa förvaltaren i maj","Lämna en nyckel på kontoret före den 25 mars","Flytta ut i fyra veckor","Duscha hos grannen"],"e":""},{"q":"När får man veta exakt när arbetet börjar i sin trappuppgång?","a":"Två veckor innan arbetet börjar","o":["I dag","Den 25 mars","Två veckor innan arbetet börjar","När arbetet är klart"],"e":""}]},{"kind":"Lucktext","title":"Ett nytt kapitel","body":"När Samira kom till Sverige {1} hon inte ett ord svenska. Det första året bodde hon hos sin kusin, {2} hon ville snabbt ha en egen bostad. Hon {3} sig till sfi och började läsa två kvällar i veckan. {4} hon arbetade på dagarna gjorde hon stora framsteg. I dag har hon ett fast jobb och {5} med sin familj i en trea i Uppsala.","gaps":[{"a":"kunde","o":["kan","kunde","kunnat","kunna"]},{"a":"men","o":["men","eftersom","därför","om"]},{"a":"anmälde","o":["anmälde","anmälda","anmäler","anmäla"]},{"a":"Trots att","o":["Därför","Trots att","Eftersom att","Så"]},{"a":"bor","o":["bo","bodde","bor","boende"]}]}],"lasaB":[{"kind":"Nyhetsartikel","title":"Allt fler över 65 cyklar till jobbet","body":"Välj rätt rubrik till varje stycke.","match":[{"t":"Antalet äldre som cyklar har ökat med 30 procent på fem år, visar en ny undersökning från Trafikverket. Många arbetar längre upp i åldern och väljer cykeln för att röra på sig.","a":"Stor ökning på kort tid"},{"t":"– Jag mår mycket bättre sedan jag började cykla, säger 67-åriga Lena Holm som cyklar sju kilometer till sitt jobb på ett bibliotek. Jag sover bättre och har mer energi.","a":"En cyklist berättar"},{"t":"Men olyckorna har också blivit fler. Trafikverket påminner om att alltid använda hjälm och att ha lyse när det är mörkt.","a":"Risker och råd"}],"extra":["Elcyklar blir billigare","Kommunen bygger nya vägar"]},{"kind":"Insändare","title":"Låt biblioteket vara öppet på söndagar!","body":"Jag har bott i Västerby i tio år och använder biblioteket varje vecka. Där lånar jag böcker, läser tidningar och hjälper mina barn med läxorna. Nu har kommunen bestämt att biblioteket ska stänga på söndagar för att spara pengar.\n\nJag förstår att kommunen har en tuff ekonomi. Men söndagen är den enda dag då många familjer är lediga samtidigt. För dem som inte har en dator hemma är biblioteket också en viktig plats för att söka jobb och kontakta myndigheter.\n\nJag föreslår att biblioteket i stället stänger en förmiddag mitt i veckan, när det kommer minst besökare. Det skulle spara lika mycket pengar utan att drabba barnfamiljerna.\n\nAmira, mamma och flitig låntagare","qs":[{"q":"Vad är skribentens huvudsyfte?","a":"Att få kommunen att ändra sitt beslut","o":["Att berätta om sina favoritböcker","Att få kommunen att ändra sitt beslut","Att klaga på personalen","Att söka jobb på biblioteket"],"e":""},{"q":"Vilket argument använder skribenten?","a":"Många familjer är lediga samtidigt på söndagar.","o":["Biblioteket är för litet.","Böckerna är för gamla.","Många familjer är lediga samtidigt på söndagar.","Kommunen har gott om pengar."],"e":""},{"q":"Vad föreslår skribenten?","a":"Att biblioteket stänger en förmiddag mitt i veckan","o":["Att biblioteket stänger helt","Att man ska betala för att låna","Att biblioteket stänger en förmiddag mitt i veckan","Att barnen får läsa hemma"],"e":""}]},{"kind":"Intervju","title":"Från hobby till eget bageri","body":"Para ihop varje fråga med rätt svar.","match":[{"t":"Hur började du baka?","a":"Min mormor lärde mig när jag var liten. Vi bakade bröd varje lördag."},{"t":"Varför startade du ett eget företag?","a":"Jag var trött på att jobba natt på ett lager och ville göra något jag älskar."},{"t":"Vad har varit svårast?","a":"Att förstå reglerna för skatt och tillstånd. Jag gick en kurs för nya företagare."},{"t":"Vilka planer har du för framtiden?","a":"Jag vill öppna ett litet kafé bredvid bageriet nästa år."}],"extra":["Jag tycker mest om att baka kanelbullar."]}],"hora":[{"kind":"Kort berättelse","title":"Mitt intresse","lines":[{"s":"A","t":"Jag heter Tomas och jag sjunger i en kör. Vi träffas varje onsdag kväll i en kyrka i centrum. Jag började för tre år sedan, när jag hade flyttat hit och inte kände någon. Det bästa med kören är gemenskapen. Efter repetitionen fikar vi alltid tillsammans. I maj ska vi ha en konsert, och jag är lite nervös eftersom jag ska sjunga ett solo."}],"qs":[{"q":"När träffas kören?","a":"På onsdagskvällar","o":["På söndagar","På onsdagskvällar","Varje morgon","En gång i månaden"],"e":""},{"q":"Varför började Tomas sjunga i kören?","a":"Han kände ingen efter flytten.","o":["Hans fru sjunger där.","Han kände ingen efter flytten.","Han ville bli professionell.","Kyrkan behövde hjälp."],"e":""},{"q":"Varför är han nervös?","a":"Han ska sjunga ett solo.","o":["Han ska sluta i kören.","Han ska sjunga ett solo.","Konserten är i morgon.","Han har glömt texten."],"e":""}]},{"kind":"Samtal","title":"På vårdcentralen","lines":[{"s":"A","t":"Vårdcentralen Kärnan, du talar med Maria."},{"s":"B","t":"Hej, jag heter Johan. Jag har haft ont i halsen i en vecka och nu har jag feber också."},{"s":"A","t":"Hur hög feber har du?"},{"s":"B","t":"Trettioåtta och en halv i morse."},{"s":"A","t":"Jag kan ge dig en tid i morgon klockan halv tio. Passar det?"},{"s":"B","t":"Nej, då jobbar jag. Finns det något på eftermiddagen?"},{"s":"A","t":"Ja, klockan kvart över två."},{"s":"B","t":"Det blir bra. Tack!"},{"s":"A","t":"Ta med legitimation. Och drick mycket vatten tills dess."}],"qs":[{"q":"Varför ringer Johan?","a":"Han har ont i halsen och feber.","o":["Han vill förnya ett recept.","Han har ont i halsen och feber.","Han har ont i magen.","Han vill avboka en tid."],"e":""},{"q":"Vilken tid får Johan?","a":"Kvart över två i morgon","o":["Halv tio i morgon","Kvart över två i morgon","Kvart över två i dag","Halv tio i dag"],"e":""},{"q":"Vad ska Johan ta med sig?","a":"Legitimation","o":["Vatten","Legitimation","Sitt recept","En remiss"],"e":""}]},{"kind":"Nyheter","title":"Lokala nyheter","lines":[{"s":"N","t":"Nyhet ett. I natt föll det trettio centimeter snö i norra Sverige. Flera skolor håller stängt och tågen är försenade."},{"s":"N","t":"Nyhet två. Kommunen öppnar en ny lekplats i Parkstaden på lördag. Lekplatsen är anpassad för barn med funktionsnedsättning."},{"s":"N","t":"Nyhet tre. Priset på el har sjunkit för tredje månaden i rad. Experter tror att priset fortsätter att vara lågt under våren."}],"qs":[{"q":"Vilken rubrik passar nyhet ett?","a":"Snöovädret stoppar skolor och tåg","o":["Billigare el i vår","Snöovädret stoppar skolor och tåg","Ny park för alla barn","Tåg köper ny snöplog"],"e":""},{"q":"Vilken rubrik passar nyhet två?","a":"Ny lekplats för alla barn","o":["Ny lekplats för alla barn","Skolor stänger i Parkstaden","Elpriset stiger","Snö i söder"],"e":""},{"q":"Vilken rubrik passar nyhet tre?","a":"Elpriset fortsätter att sjunka","o":["Elpriset fortsätter att sjunka","El blir dyrare i vår","Kommunen sänker skatten","Experter varnar för kyla"],"e":""}]},{"kind":"Längre berättelse","title":"Mitt första år","lines":[{"s":"A","t":"När jag kom till Sverige för fem år sedan hade jag arbetat som sjuksköterska i Syrien i tio år. Jag trodde att jag snabbt skulle få jobba med samma sak här. Men först behövde jag lära mig svenska och sedan få min utbildning godkänd. Det tog nästan tre år. Under tiden jobbade jag som undersköterska på ett äldreboende, och det var faktiskt bra. Jag lärde mig hur vården fungerar i Sverige och fick många kollegor. I dag har jag svensk legitimation och arbetar på en akutmottagning. Mitt råd till nya i Sverige är: ge inte upp, även om det tar längre tid än du tror."}],"qs":[{"q":"Vad arbetade personen med innan hon kom till Sverige?","a":"Sjuksköterska","o":["Undersköterska","Läkare","Sjuksköterska","Lärare"],"e":""},{"q":"Hur tyckte hon att jobbet på äldreboendet var?","a":"Bra, hon lärde sig mycket","o":["Tråkigt och tungt","Bra, hon lärde sig mycket","För dåligt betalt","Svårt att få"],"e":""},{"q":"Vilket råd ger hon?","a":"Ge inte upp även om det tar tid.","o":["Lär dig svenska innan du flyttar.","Ge inte upp även om det tar tid.","Sök jobb på ett äldreboende.","Plugga till läkare."],"e":""}]}],"skriva":[{"n":1,"kind":"Informell text","task":"Din vän Lina ska börja en kurs på kvällstid och undrar hur det var när du gick din senaste kurs. Skriv ett mejl till Lina. Berätta vilken kurs du gick och hur det var. Ge henne två råd. Avsluta med ett förslag på när ni kan ses.","model":"Hej Lina! Vad roligt att du ska börja en kurs! Förra hösten gick jag en kurs i datorkunskap två kvällar i veckan. I början var det jobbigt att plugga efter jobbet, men läraren var duktig och gruppen var trevlig. Mitt första råd är att du gör läxorna direkt samma kväll, annars samlas de på hög. Mitt andra råd är att du lär känna någon i klassen så att ni kan hjälpa varandra. Ska vi ta en fika på lördag så kan jag berätta mer? Kram, Alex"},{"n":2,"kind":"Formell text","task":"Kommunen vill veta vad invånarna tycker om kollektivtrafiken. Skriv ett brev till kommunen. Beskriv hur du själv reser i vardagen och vad som fungerar bra eller dåligt. Diskutera sedan mer allmänt varför kollektivtrafiken är viktig för samhället. Ge ett förslag på en förbättring.","model":"Hej! Jag åker buss till jobbet varje dag och tycker att bussarna oftast går i tid. Ett problem är dock att det inte går några bussar efter klockan elva på kvällen. Det gör det svårt för personer som arbetar sent. Kollektivtrafiken är viktig för hela samhället. Den minskar utsläppen, gör det möjligt för människor utan bil att arbeta och studera och minskar trafiken i centrum. Jag föreslår därför att kommunen inför en nattbuss på fredagar och lördagar som ett första steg. Med vänliga hälsningar, Alex"}],"tala":[{"n":1,"kind":"Enskild uppgift","task":"Berätta om en plats som betyder mycket för dig.","help":["Var ligger platsen?","Hur ofta är du där?","Vad gör du där?","Varför är platsen viktig för dig?"],"model":"En plats som betyder mycket för mig är en liten sjö utanför staden. Jag åker dit nästan varje helg på sommaren. Där promenerar jag runt sjön eller sitter på en sten och läser. Platsen är viktig för mig eftersom jag får vila från stressen i vardagen."},{"n":2,"kind":"Samtal i par","task":"Hur kan man få en bra balans mellan arbete och fritid?","help":["Påstående: Man borde inte läsa jobbmejl på kvällen.","Påstående: Träning är det bästa sättet att koppla av.","Påstående: Det är arbetsgivarens ansvar att anställda inte blir stressade."],"partner":["Vad tycker du om det första påståendet?","Hur kopplar du själv av efter jobbet?","Håller du med om att arbetsgivaren har ansvaret? Varför?","Vad skulle du vilja ändra i din egen vardag?"]}]},{"id":"p2","name":"Provträning 2","theme":"Arbete, hälsa och samhälle","lasaA":[{"kind":"Platsannons","title":"Vi söker en barnskötare till förskolan Solrosen","body":"Förskolan Solrosen i Hagaby har fyra avdelningar med barn mellan ett och fem år. Vi söker nu en barnskötare på heltid från den 1 augusti.\n\nDu har utbildning till barnskötare eller annan relevant utbildning. Du talar och skriver svenska bra och tycker om att arbeta i team. Det är meriterande om du kan fler språk.\n\nVi erbjuder en trevlig arbetsplats, friskvårdsbidrag och möjlighet till fortbildning.\n\nSkicka din ansökan med CV och personligt brev senast den 15 maj till rekrytering@hagaby.se. Intervjuer sker löpande, så vänta inte med din ansökan.","qs":[{"q":"Vad är meriterande för tjänsten?","a":"Att kunna flera språk","o":["Att ha körkort","Att kunna flera språk","Att ha egna barn","Att ha jobbat i fem år"],"e":""},{"q":"Vad betyder \"intervjuer sker löpande\"?","a":"Man kan bli kallad till intervju innan sista ansökningsdagen.","o":["Alla intervjuer görs den 15 maj.","Man kan bli kallad till intervju innan sista ansökningsdagen.","Intervjun görs medan man springer.","Det blir inga intervjuer."],"e":""},{"q":"Vad ska man skicka med ansökan?","a":"CV och personligt brev","o":["Betyg och pass","CV och personligt brev","Ett foto","Bara ett mejl"],"e":""}]},{"kind":"Diagram","title":"Hur reser de anställda till jobbet?","body":"En undersökning bland 200 anställda på företaget Norrteknik:\n\nBil | 35 %\nBuss eller tåg | 30 %\nCykel | 25 %\nGång | 10 %\n\nFörra året åkte hälften av de anställda bil. Företaget har sedan dess byggt ett cykelgarage och erbjuder billigare busskort.","qs":[{"q":"Hur många procent cyklar till jobbet?","a":"25 %","o":["10 %","25 %","30 %","35 %"],"e":""},{"q":"Vad har hänt sedan förra året?","a":"Färre åker bil till jobbet.","o":["Fler åker bil till jobbet.","Färre åker bil till jobbet.","Alla cyklar nu.","Busskorten har blivit dyrare."],"e":""}]},{"kind":"Information","title":"Så söker du föräldrapenning","body":"Föräldrapenning får du när du är hemma med ditt barn i stället för att arbeta, studera eller söka arbete. Du ansöker hos Försäkringskassan, enklast via deras webbplats eller app.\n\nDu kan ansöka i förväg eller i efterhand, men senast 90 dagar efter den första dagen du var ledig. Du behöver ange vilka dagar du vill ta ut och hur stor del av dagen. Du kan ta ut hela, tre fjärdedels, halva, en fjärdedels eller en åttondels dag.\n\nKom ihåg att också meddela din arbetsgivare minst två månader innan du börjar din föräldraledighet.","qs":[{"q":"Var ansöker man om föräldrapenning?","a":"Hos Försäkringskassan","o":["Hos arbetsgivaren","Hos Försäkringskassan","På vårdcentralen","Hos Skatteverket"],"e":""},{"q":"När måste man senast tala om ledigheten för arbetsgivaren?","a":"Två månader innan","o":["Samma dag","En vecka innan","Två månader innan","Det behövs inte"],"e":""},{"q":"Vilket påstående stämmer?","a":"Man kan ta ut en del av en dag.","o":["Man kan bara ta ut hela dagar.","Man kan ta ut en del av en dag.","Man måste ansöka på papper.","Bara mammor kan ansöka."],"e":""}]},{"kind":"Lucktext","title":"Hälsa på jobbet","body":"Många arbetsgivare {1} sina anställda ett friskvårdsbidrag. Pengarna kan användas till träning, {2} gym eller simning. Forskning visar att anställda som rör på sig {3} sjuka mer sällan. Därför tjänar {4} på att erbjuda bidraget. Det är dock frivilligt, och alla anställda {5} inte bidraget.","gaps":[{"a":"erbjuder","o":["erbjuder","erbjöd","erbjudit","erbjuden"]},{"a":"till exempel","o":["därför","till exempel","trots","istället"]},{"a":"blir","o":["blir","blev","bli","blivit"]},{"a":"företagen","o":["företaget","företagen","företag","företagets"]},{"a":"använder","o":["använda","använder","användes","använt"]}]}],"lasaB":[{"kind":"Artikel","title":"Fyradagarsvecka – framtidens arbetsliv?","body":"Välj rätt rubrik till varje stycke.","match":[{"t":"Ett it-företag i Göteborg har testat att låta personalen arbeta fyra dagar i veckan med samma lön. Efter ett år är resultatet tydligt: sjukfrånvaron har minskat med en tredjedel.","a":"Färre sjukdagar"},{"t":"– Jag har mer tid för mina barn och kommer till jobbet med mer energi, säger projektledaren Omar Haddad.","a":"Personalen är nöjd"},{"t":"Men alla branscher kan inte göra likadant. På sjukhus och i butiker måste någon alltid vara på plats, och då kan kortare arbetstid kräva fler anställda.","a":"Svårt i vissa yrken"}],"extra":["Lönerna sänks","Företaget flyttar"]},{"kind":"Debattartikel","title":"Gör det lättare att få jobb inom sitt yrke","body":"Varje år kommer tusentals personer till Sverige med en utbildning som ingenjör, läkare eller lärare. Ändå arbetar många av dem i yrken där deras kompetens inte används. Det är ett slöseri både för individen och för samhället.\n\nEtt stort hinder är att det tar lång tid att få sin utbildning värderad. Ett annat är att arbetsgivare ofta kräver flytande svenska redan från början, även när arbetet främst handlar om teknik.\n\nVi menar att staten borde korta handläggningstiderna och att fler arbetsgivare borde erbjuda praktik med språkstöd. Då kan nyanlända börja arbeta i sitt yrke samtidigt som de lär sig svenska.","qs":[{"q":"Vilket problem tar skribenterna upp?","a":"Många nyanlända får inte använda sin utbildning.","o":["Det finns för få ingenjörer i världen.","Många nyanlända får inte använda sin utbildning.","Sfi är för dyrt.","Lärarna har för låga löner."],"e":""},{"q":"Vad menar skribenterna med \"slöseri\"?","a":"Att kompetens inte tas tillvara","o":["Att människor slösar pengar","Att kompetens inte tas tillvara","Att utbildningen är för lång","Att staten sparar för mycket"],"e":""},{"q":"Vilka två lösningar föreslår de?","a":"Kortare handläggning och praktik med språkstöd","o":["Högre löner och längre semester","Kortare handläggning och praktik med språkstöd","Fler sfi-lärare och nya skolor","Att alla läser teknik"],"e":""}]},{"kind":"Intervju","title":"Möt kommunens nya bibliotekarie","body":"Para ihop varje fråga med rätt svar.","match":[{"t":"Vad gör du på en vanlig dag?","a":"Jag hjälper besökare att hitta böcker och planerar aktiviteter för barn."},{"t":"Vad är det bästa med jobbet?","a":"Att träffa så många olika människor varje dag."},{"t":"Vilka nyheter kommer i höst?","a":"Vi startar språkcaféer på torsdagar där man kan öva svenska."},{"t":"Har du något boktips?","a":"Läs gärna lättlästa romaner. De är perfekta för den som lär sig svenska."}],"extra":["Jag har jobbat här i femton år."]}],"hora":[{"kind":"Kort berättelse","title":"Ett nytt jobb","lines":[{"s":"A","t":"Jag började på ett nytt jobb i måndags. Jag arbetar på ett lager och packar varor som kunderna har beställt på nätet. Det är ganska tungt, men mina kollegor är hjälpsamma. Det jobbigaste är att jag måste börja klockan sex på morgonen, så jag går och lägger mig redan klockan tio. Om ett halvår kan jag kanske bli arbetsledare."}],"qs":[{"q":"Vad gör personen på jobbet?","a":"Packar varor som har beställts på nätet","o":["Kör lastbil","Packar varor som har beställts på nätet","Säljer kläder i en butik","Svarar i telefon"],"e":""},{"q":"Vad tycker personen är jobbigast?","a":"Att börja tidigt på morgonen","o":["Kollegorna","Att börja tidigt på morgonen","Lönen","Att jobba på nätet"],"e":""},{"q":"Vad kan hända om ett halvår?","a":"Personen kan bli arbetsledare.","o":["Personen slutar.","Personen kan bli arbetsledare.","Lagret stänger.","Personen flyttar."],"e":""}]},{"kind":"Samtal","title":"Planera helgen","lines":[{"s":"A","t":"Ska vi göra något i helgen?"},{"s":"B","t":"Gärna! Jag tänkte att vi kunde gå på museet på lördag."},{"s":"A","t":"På lördag kan jag inte, då ska jag hjälpa min bror att flytta."},{"s":"B","t":"Okej. Söndag då? Museet har gratis entré på söndagar."},{"s":"A","t":"Perfekt. Ska vi ses vid stationen klockan ett?"},{"s":"B","t":"Hellre halv två, jag ska träna på förmiddagen."},{"s":"A","t":"Okej, halv två vid stationen."}],"qs":[{"q":"Varför kan A inte på lördag?","a":"A ska hjälpa sin bror att flytta.","o":["A ska träna.","A ska hjälpa sin bror att flytta.","Museet är stängt.","A ska jobba."],"e":""},{"q":"Varför passar söndag bra?","a":"Det är gratis entré.","o":["Det är mindre folk.","Det är gratis entré.","Museet har en ny utställning.","Tågen går oftare."],"e":""},{"q":"När ska de träffas?","a":"Halv två vid stationen","o":["Klockan ett vid museet","Halv två vid stationen","Klockan ett vid stationen","På förmiddagen"],"e":""}]},{"kind":"Nyheter","title":"Nyheter i korthet","lines":[{"s":"N","t":"Nyhet ett. Från och med januari blir det dyrare att åka buss i länet. En månadsbiljett kostar då femtio kronor mer."},{"s":"N","t":"Nyhet två. En ny undersökning visar att svenskar läser fler böcker än för fem år sedan. Det är framför allt ljudböcker som ökar."},{"s":"N","t":"Nyhet tre. Sjukhuset i Västerby har fått tjugo nya sjuksköterskor. Väntetiderna på akuten väntas nu bli kortare."}],"qs":[{"q":"Vilken rubrik passar nyhet ett?","a":"Bussresorna blir dyrare","o":["Bussresorna blir dyrare","Gratis buss i januari","Nya bussar i länet","Färre bussturer"],"e":""},{"q":"Vilken rubrik passar nyhet två?","a":"Ljudböcker allt populärare","o":["Biblioteken stänger","Ljudböcker allt populärare","Svenskar läser mindre","Ny bokhandel öppnar"],"e":""},{"q":"Vilken rubrik passar nyhet tre?","a":"Kortare väntan på akuten","o":["Sjukhuset stänger","Kortare väntan på akuten","Brist på läkare","Längre köer"],"e":""}]},{"kind":"Längre berättelse","title":"Ett beslut som förändrade mitt liv","lines":[{"s":"A","t":"För sju år sedan arbetade jag som revisor i en storstad. Jag tjänade bra men var stressad hela tiden och hann aldrig träffa mina barn. En dag bestämde jag och min man att flytta till landet. Vi köpte en gammal gård och började odla grönsaker. Det första året var tufft, för vi visste nästan ingenting om jordbruk. Men grannarna hjälpte oss, och i dag säljer vi grönsaker på en marknad varje lördag. Jag tjänar mindre än förr, men jag har mycket mer tid för min familj och jag ångrar ingenting."}],"qs":[{"q":"Varför flyttade familjen?","a":"Hon var stressad och hade lite tid för barnen.","o":["Hon förlorade sitt jobb.","Hon var stressad och hade lite tid för barnen.","Mannen fick jobb på landet.","Lägenheten var för dyr."],"e":""},{"q":"Vad var svårt det första året?","a":"De kunde nästan ingenting om jordbruk.","o":["Grannarna var otrevliga.","De kunde nästan ingenting om jordbruk.","Gården var för liten.","Ingen köpte grönsakerna."],"e":""},{"q":"Hur ser hon på sitt beslut i dag?","a":"Hon ångrar det inte.","o":["Hon vill flytta tillbaka.","Hon ångrar det inte.","Hon saknar sitt gamla jobb.","Hon tjänar mer nu."],"e":""}]}],"skriva":[{"n":1,"kind":"Informell text","task":"Du har just börjat på ett nytt jobb eller en ny praktikplats. Skriv ett meddelande till en vän. Berätta vad du gör, hur dina kollegor är och vad du tycker om arbetsplatsen. Fråga hur din vän har det.","model":"Hej Sara! Nu har jag jobbat på mitt nya ställe i två veckor. Jag arbetar i köket på ett hotell och förbereder frukosten. Mina kollegor är trevliga och hjälper mig när jag inte förstår något. Det enda jobbiga är att jag måste vara där redan halv sex. Men jag trivs bra och lär mig mycket svenska. Hur har du det? Har du fått svar på din ansökan? Kram, Alex"},{"n":2,"kind":"Formell text","task":"En lokaltidning frågar sina läsare: Ska alla arbetsplatser erbjuda flexibla arbetstider? Skriv en insändare. Berätta om dina egna erfarenheter och diskutera för- och nackdelar för både anställda och arbetsgivare. Avsluta med din åsikt.","model":"Flexibla arbetstider – ja, men inte överallt. Själv har jag flexibel arbetstid och kan börja mellan sju och nio. Det gör det lättare att lämna barnen på förskolan. För de anställda är fördelen att de kan anpassa jobbet efter familjen och undvika rusningstrafik. För arbetsgivaren kan det ge nöjdare personal. Nackdelen är att det blir svårare att planera möten, och i vissa yrken, till exempel i vården, måste någon alltid vara på plats. Min åsikt är att alla arbetsplatser borde undersöka om det går, men att det inte kan vara ett krav för alla."}],"tala":[{"n":1,"kind":"Enskild uppgift","task":"Berätta om ett arbete eller en uppgift som du är stolt över.","help":["Vad gjorde du?","När och var var det?","Vad var svårt?","Varför är du stolt?"],"model":"Jag är stolt över när jag organiserade en stor fest för min arbetsplats förra året. Jag bokade lokalen, planerade maten och ordnade musik. Det svåraste var att alla hade olika önskemål. Men festen blev lyckad och alla tackade mig efteråt."},{"n":2,"kind":"Samtal i par","task":"Vad är viktigast när man väljer ett arbete?","help":["Påstående: Lönen är det viktigaste.","Påstående: Trevliga kollegor betyder mer än en hög lön.","Påstående: Det är bättre att ha ett säkert jobb än ett roligt jobb."],"partner":["Vilket påstående håller du med om mest?","Har du själv valt bort ett jobb? Varför?","Vad betyder kollegorna för dig?","Hur tror du att arbetslivet ser ut om tio år?"]}]},{"id":"p3","name":"Provträning 3","theme":"Skola, ekonomi, miljö och familj","lasaA":[{"kind":"Meddelande","title":"Information från Björkskolan","body":"Hej vårdnadshavare!\n\nTorsdagen den 9 oktober är det studiedag för personalen och eleverna är lediga. Fritidshemmet är öppet som vanligt för barn som är anmälda. Anmäl ditt barn till fritids senast den 1 oktober via skolans app.\n\nVeckan efter, den 13–17 oktober, har vi utvecklingssamtal. Du får en kallelse med tid av ditt barns mentor. Om tiden inte passar, kontakta mentorn så snart som möjligt. Du kan också välja att ha samtalet digitalt.\n\nVänliga hälsningar\nRektor Eva Lund","qs":[{"q":"Vad händer den 9 oktober?","a":"Eleverna är lediga eftersom personalen har studiedag.","o":["Det är utvecklingssamtal.","Eleverna är lediga eftersom personalen har studiedag.","Fritids är stängt.","Skolan har föräldramöte."],"e":""},{"q":"Vad måste man göra senast den 1 oktober?","a":"Anmäla barnet till fritids om det behövs","o":["Boka utvecklingssamtal","Anmäla barnet till fritids om det behövs","Ringa rektorn","Ladda ner en ny app"],"e":""},{"q":"Vem ska man kontakta om tiden för samtalet inte passar?","a":"Mentorn","o":["Rektorn","Fritidshemmet","Mentorn","Skolans app"],"e":""}]},{"kind":"Tabell","title":"Familjen Karims budget i september","body":"Inkomster | 46 000 kr\nHyra | 12 500 kr\nMat | 8 000 kr\nTransport | 2 400 kr\nBarnens aktiviteter | 1 500 kr\nSparande | 3 000 kr\nÖvrigt | 5 000 kr\n\nI oktober planerar familjen att öka sparandet med 1 000 kronor genom att handla mat en gång i veckan i stället för varje dag.","qs":[{"q":"Vad är familjens största utgift?","a":"Hyran","o":["Mat","Hyran","Sparande","Övrigt"],"e":""},{"q":"Hur mycket planerar familjen att spara i oktober?","a":"4 000 kr","o":["1 000 kr","3 000 kr","4 000 kr","8 000 kr"],"e":""}]},{"kind":"Information","title":"Så sorterar du ditt avfall","body":"I alla hus i kommunen finns nu kärl för matavfall, plast, papper, glas och metall. Matavfallet läggs i de bruna papperspåsarna som du hämtar gratis i matbutiken.\n\nBatterier, lampor och elektronik får inte läggas i soporna. Lämna dem i stället på återvinningscentralen eller i röda insamlingslådor i matbutiker.\n\nStörre saker, som möbler och cyklar, kan du lämna på återvinningscentralen. Om du inte har bil kan kommunen hämta dem mot en avgift på 300 kronor.","qs":[{"q":"Var får man tag på påsar för matavfall?","a":"I matbutiken","o":["På kommunens kontor","I matbutiken","På återvinningscentralen","Man måste köpa dem på nätet"],"e":""},{"q":"Var ska man lämna batterier?","a":"På återvinningscentralen eller i en röd låda i butiken","o":["I plastkärlet","I hushållssoporna","På återvinningscentralen eller i en röd låda i butiken","I den bruna påsen"],"e":""},{"q":"Vad kostar det att få en soffa hämtad?","a":"300 kr","o":["Det är gratis.","300 kr","30 kr","3 000 kr"],"e":""}]},{"kind":"Lucktext","title":"Mitt första jobb i Sverige","body":"Mitt första jobb i Sverige var på en restaurang. Jag {1} disk och hjälpte kocken med enkla uppgifter. Jag hade aldrig {2} i ett kök tidigare, så allt var nytt för mig. Kocken var tålmodig och förklarade allt {3}. Efter ett år {4} jag erbjuden en fast anställning. I dag är jag själv kock och lär nya {5} hur man arbetar i köket.","gaps":[{"a":"diskade","o":["diskar","diskade","diskat","diska"]},{"a":"arbetat","o":["arbetat","arbetade","arbetar","arbeta"]},{"a":"noggrant","o":["noggrann","noggrant","noggranna","noggrannare"]},{"a":"blev","o":["blev","blir","blivit","bli"]},{"a":"kollegor","o":["kollega","kollegan","kollegor","kollegornas"]}]}],"lasaB":[{"kind":"Reportage","title":"Familjen som lever utan bil","body":"Välj rätt rubrik till varje stycke.","match":[{"t":"Familjen Nilsson sålde sin bil för två år sedan. Nu cyklar de till jobb och skola och tar tåget när de ska hälsa på släkten.","a":"Ett nytt sätt att resa"},{"t":"– Vi sparar ungefär 4 000 kronor i månaden, säger pappa Erik Nilsson. Pengarna lägger vi på resor på sommaren.","a":"Mer pengar över"},{"t":"Det är inte alltid lätt. När det regnar eller när de ska handla mycket mat hyr de en bil via en app. Det fungerar bra, men kräver planering.","a":"Lösningar när det blir svårt"}],"extra":["Bilen gick sönder","Kommunen förbjuder bilar"]},{"kind":"Insändare","title":"Mer läxhjälp i skolan, tack!","body":"Min son går i årskurs 7 och får mycket läxor. Jag vill gärna hjälpa honom, men jag förstår inte alltid uppgifterna eftersom jag fortfarande lär mig svenska. Många föräldrar är i samma situation.\n\nDet är inte rättvist att barnens resultat ska bero på hur mycket föräldrarna kan hjälpa till hemma. Därför borde alla skolor erbjuda läxhjälp efter skoltid, med lärare eller äldre elever.\n\nPå min sons skola finns läxhjälp en dag i veckan, men det räcker inte. Jag önskar att det fanns minst tre dagar. Det skulle göra skolan mer jämlik.\n\nFarid, pappa till tre barn","qs":[{"q":"Varför kan Farid inte alltid hjälpa sin son?","a":"Han förstår inte alltid uppgifterna på svenska.","o":["Han arbetar kvällar.","Han förstår inte alltid uppgifterna på svenska.","Sonen vill inte ha hjälp.","Han har för många barn."],"e":""},{"q":"Vad tycker Farid är orättvist?","a":"Att barnens resultat beror på föräldrarnas möjligheter att hjälpa","o":["Att lärarna får för låg lön","Att barnens resultat beror på föräldrarnas möjligheter att hjälpa","Att det finns för få skolor","Att läxorna är för lätta"],"e":""},{"q":"Vad vill Farid?","a":"Läxhjälp minst tre dagar i veckan","o":["Inga läxor alls","Läxhjälp minst tre dagar i veckan","Längre sommarlov","Fler prov"],"e":""}]},{"kind":"Intervju","title":"Hon startade ett språkcafé","body":"Para ihop varje fråga med rätt svar.","match":[{"t":"Varför startade du språkcaféet?","a":"Jag märkte att många nyanlända saknade någon att prata svenska med."},{"t":"Vilka kommer till caféet?","a":"Både svenskar som vill hjälpa till och personer som lär sig svenska."},{"t":"Vad pratar ni om?","a":"Allt från mat och väder till jobb och nyheter."},{"t":"Hur kan man vara med?","a":"Det är bara att komma, vi träffas varje tisdag klockan sex på biblioteket."}],"extra":["Jag har bott i staden hela mitt liv."]}],"hora":[{"kind":"Kort berättelse","title":"Min familj","lines":[{"s":"A","t":"Jag bor med min man och våra två döttrar i en lägenhet i Malmö. Min mamma bor i Polen, så vi ringer varandra nästan varje dag. På somrarna åker vi dit i tre veckor. Mina döttrar pratar både svenska och polska, och det är jag väldigt glad för. Nästa år ska min mamma komma och hälsa på oss i Sverige för första gången."}],"qs":[{"q":"Hur håller hon kontakten med sin mamma?","a":"De ringer nästan varje dag.","o":["De skriver brev.","De ringer nästan varje dag.","De träffas varje helg.","De har ingen kontakt."],"e":""},{"q":"Vad är hon glad för?","a":"Att döttrarna pratar två språk","o":["Att hon bor i Malmö","Att döttrarna pratar två språk","Att hon har en stor lägenhet","Att mamman flyttar till Sverige"],"e":""},{"q":"Vad ska hända nästa år?","a":"Mamman ska hälsa på i Sverige.","o":["Familjen ska flytta till Polen.","Mamman ska hälsa på i Sverige.","De ska åka till Polen i tre veckor.","Döttrarna ska börja skolan."],"e":""}]},{"kind":"Samtal","title":"I butiken","lines":[{"s":"A","t":"Hej, jag köpte de här skorna i förra veckan, men de är för små."},{"s":"B","t":"Har du kvittot?"},{"s":"A","t":"Ja, här."},{"s":"B","t":"Tyvärr har vi inte samma modell i en större storlek. Vill du byta till en annan modell eller få pengarna tillbaka?"},{"s":"A","t":"Jag tar hellre pengarna tillbaka."},{"s":"B","t":"Det går bra. Pengarna kommer tillbaka på ditt kort inom tre dagar."}],"qs":[{"q":"Vad är problemet med skorna?","a":"De är för små.","o":["De är trasiga.","De är för små.","De har fel färg.","De är för dyra."],"e":""},{"q":"Vad väljer kunden?","a":"Att få pengarna tillbaka","o":["En annan modell","Att få pengarna tillbaka","Ett presentkort","Samma skor i en annan färg"],"e":""},{"q":"När får kunden pengarna?","a":"Inom tre dagar","o":["Direkt","Inom tre dagar","Nästa månad","När skorna har skickats tillbaka"],"e":""}]},{"kind":"Nyheter","title":"Dagens nyheter","lines":[{"s":"N","t":"Nyhet ett. Fler familjer väljer att semestra i Sverige i år. Campingplatserna rapporterar rekordmånga besökare."},{"s":"N","t":"Nyhet två. Regeringen föreslår att barnbidraget höjs med hundra kronor per barn och månad från nästa år."},{"s":"N","t":"Nyhet tre. Allt fler skolor slutar använda mobiltelefoner på lektionerna. Lärarna säger att eleverna blir mer koncentrerade."}],"qs":[{"q":"Vilken rubrik passar nyhet ett?","a":"Rekord på campingplatserna","o":["Rekord på campingplatserna","Dyrare resor utomlands","Färre turister i Sverige","Ny campingplats öppnar"],"e":""},{"q":"Vilken rubrik passar nyhet två?","a":"Höjt barnbidrag föreslås","o":["Barnbidraget tas bort","Höjt barnbidrag föreslås","Fler barn föds","Skatten sänks"],"e":""},{"q":"Vilken rubrik passar nyhet tre?","a":"Mobilfria lektioner ger bättre fokus","o":["Elever får nya mobiler","Mobilfria lektioner ger bättre fokus","Lärarbrist i skolorna","Längre skoldagar"],"e":""}]},{"kind":"Längre berättelse","title":"Att lära sig ett nytt språk","lines":[{"s":"A","t":"När jag började på sfi kunde jag bara säga hej och tack. Jag var fyrtio år och tänkte att jag var för gammal för att lära mig ett nytt språk. Men min lärare sa något jag aldrig glömmer: det viktiga är inte hur snabbt du lär dig, utan att du fortsätter. Jag började lyssna på radio på svenska varje morgon och läste barnböcker med min son. Efter två år klarade jag kurs D. I dag pluggar jag till undersköterska, och ibland hjälper jag nya elever på sfi. Jag säger samma sak till dem som min lärare sa till mig."}],"qs":[{"q":"Vad trodde personen i början?","a":"Att hon var för gammal för att lära sig","o":["Att svenska var lätt","Att hon var för gammal för att lära sig","Att hon inte behövde svenska","Att sfi var för dyrt"],"e":""},{"q":"Hur övade hon hemma?","a":"Hon lyssnade på radio och läste barnböcker med sin son.","o":["Hon tittade på film varje kväll.","Hon lyssnade på radio och läste barnböcker med sin son.","Hon skrev dagbok.","Hon pratade med grannarna."],"e":""},{"q":"Vad gör hon i dag?","a":"Hon pluggar till undersköterska.","o":["Hon arbetar som sfi-lärare.","Hon pluggar till undersköterska.","Hon går fortfarande på sfi.","Hon jobbar på radio."],"e":""}]}],"skriva":[{"n":1,"kind":"Informell text","task":"Din kusin ska flytta till Sverige med sin familj och har frågat dig om skola och förskola för barnen. Skriv ett mejl. Berätta hur det fungerar och vad som är bra att tänka på. Ge två konkreta tips.","model":"Hej Ali! Vad roligt att ni ska komma! Barn mellan ett och fem år kan gå på förskola, och från sex års ålder börjar de i förskoleklass. Ni ansöker om förskola hos kommunen, gärna i god tid, eftersom det ibland finns kö. Skolan är gratis och barnen får lunch varje dag. Mitt första tips är att ni frågar om modersmålsundervisning, så att barnen kan fortsätta lära sig arabiska. Mitt andra tips är att ni går på föräldramöten, även om ni inte förstår allt i början. Hör av dig om du har fler frågor! Hälsningar, Alex"},{"n":2,"kind":"Formell text","task":"Din kommun vill minska mängden sopor. Skriv ett brev till kommunen. Berätta vad du själv gör för miljön och vad som är svårt. Diskutera varför det är viktigt att alla tar ansvar och ge minst ett förslag på hur kommunen kan göra det lättare för invånarna.","model":"Hej! Jag sorterar mina sopor och försöker köpa saker med mindre förpackningar. Det som är svårt är att återvinningsstationen ligger långt bort och att det ofta är fullt i kärlen. Det är viktigt att alla tar ansvar eftersom sopor påverkar både klimatet och naturen omkring oss. Om fler sorterar kan mer material återvinnas och användas igen. Jag föreslår att kommunen tömmer kärlen oftare och sätter upp tydliga skyltar med bilder på flera språk. Med vänliga hälsningar, Alex"}],"tala":[{"n":1,"kind":"Enskild uppgift","task":"Berätta om en person som har betytt mycket för dig.","help":["Vem är personen?","Hur länge har ni känt varandra?","Vad har ni gjort tillsammans?","Varför är personen viktig för dig?"],"model":"En person som har betytt mycket för mig är min mormor. Hon tog hand om mig när mina föräldrar arbetade. Vi lagade mat tillsammans och hon berättade historier från när hon var ung. Hon lärde mig att vara tålmodig och att alltid hjälpa andra."},{"n":2,"kind":"Samtal i par","task":"Hur ska familjer dela på ansvaret hemma?","help":["Påstående: Barn ska hjälpa till hemma från tidig ålder.","Påstående: Båda föräldrarna ska ta lika mycket föräldraledighet.","Påstående: Det är viktigare att äta middag tillsammans än att hinna med fritidsaktiviteter."],"partner":["Vad tycker du om att barn hjälper till hemma?","Hur delar ni på ansvaret i din familj?","Ska föräldraledigheten vara lika för båda? Varför?","Hur var det i ditt hemland när du var barn?"]}]}],"info":{"parts":[["Läsa","Två häften, A och B. Annonser, tabeller, e-post, artiklar, insändare och intervjuer. Uppgifter med svarsalternativ, rubriker, lucktext och frågor som ska paras ihop med svar."],["Höra","Inspelningar med korta berättelser, samtal, nyheter och längre berättelser. I övningen kan du lyssna högst två gånger på varje inspelning."],["Skriva","Två texter på 90 minuter. Uppgift 1 är informell (till exempel ett mejl till en vän). Uppgift 2 är mer formell och har en allmän del."],["Tala","En enskild uppgift (ungefär 5 minuter) och ett samtal i par (ungefär 10 minuter)."]],"note":"Övningsprovet följer upplägget i det nationella provet för sfi kurs D. Texterna och uppgifterna är nyskrivna för övning och är inte riktiga provuppgifter. Gränserna för godkänt bestäms för varje prov och visas därför inte här."}},"units":["bostad","halsa","fritid","gram1","skola","pengar","miljo","arbete","gram2","sprak","familj"],"W":[{"t":"n","w":"adjektiv","en":"adjective","c":[3,8],"g":"ett","f":["adjektivet","adjektiv","adjektiven"],"u":12,"i":0},{"t":"n","w":"aktivitet","en":"activity","c":[2,5],"g":"en","f":["aktiviteten","aktiviteter","aktiviteterna"],"u":18,"i":1},{"t":" l enthusiasm?","a":"Intresset kan slockna och lektionerna kan kännas tråkiga. Interest can fade and lessons can feel boring.","e":"","k":"open","acc":[],"u":4},{"s":"p2R","n":3,"ti":"Reading school and money","q":"Nämn lärarens, förälderns och elevens bidrag till en lyckad skolgång. Name the teacher's, parent's and pupil's contributions.","a":"Lärare anpassar undervisningen, föräldrar engagerar sig och elever gör sitt bästa. Teachers adapt instruction, parents get involved and pupils make an effort.","e":"","k":"open","acc":[],"u":4},{"s":"p2R","n":4,"ti":"Reading school and money","q":"Varför spelar sättet att tala om läxor roll? Why does the way of talking about homework matter?","a":"Stöd och samarbete kan kännas mer uppmuntrande än enbart order. Support and cooperation can be more encouraging than orders alone.","e":"","k":"open","acc":[],"u":4},{"s":"p2R","n":5,"ti":"Reading school and money","q":"Vilken texttyp är den första skoltexten? What type of text is the first school reading?","a":"Det är en argumenterande text av en engagerad förälder. It is an argumentative text by an engaged parent.","e":"","k":"open","acc":[],"u":4},{"s":"p2R","n":6,"ti":"Reading school and money","q":"Varför var Peters första dag både spännande och skrämmande? Why was Peter's first day both exciting and frightening?","a":"Han kände sig stor och stolt men allt kändes också allvarligt och skrämmande. He felt grown-up and proud, but everything also felt serious and frightening.","e":"","k":"open","acc":[],"u":4},{"s":"p2R","n":7,"ti":"Reading school and money","q":"När började hans intresse minska? When did his interest begin to fade?","a":"På mellanstadiet, i årskurs 4–6. In years 4–6.","e":"","k":"open","acc":[],"u":4},{"s":"p2R","n":8,"ti":"Reading school and money","q":"Vilka privata omständigheter kopplar Peter till svårigheterna? What personal circumstances does Peter connect to the difficulties?","a":"Föräldrarnas skilsmässa, ensamhet och begränsat stöd i början. His parents' divorce, loneliness and limited initial support.","e":"","k":"open","acc":[],"u":4},{"s":"p2R","n":9,"ti":"Reading school and money","q":"Vad skiljer ämneskunskap från god undervisning enligt Peter? What distinguishes subject knowledge from good teaching according to Peter?","a":"En lärare behöver kunna förklara, motivera och hjälpa eleverna att lära sig själva. Teaching needs explanation, motivation and helping pupils learn independently.","e":"","k":"open","acc":[],"u":4},{"s":"p2R","n":10,"ti":"Reading school and money","q":"Vilka insatser lyfter Peter fram i efterhand? Whose contributions does Peter highlight afterwards?","a":"Sina egna, de goda lärarnas och föräldrarnas senare insatser. His own efforts, good teachers and his parents' later contributions.","e":"","k":"open","acc":[],"u":4},{"s":"p2R","n":11,"ti":"Reading school and money","q":"Vad är skillnaden mellan pengar som medel och som mål? What is the difference between money as a means and as a goal?","a":"Ett medel hjälper oss att leva; ett mål blir något livet kretsar kring för sin egen skull. A means helps us live; a goal becomes an end in itself.","e":"","k":"open","acc":[],"u":5},{"s":"p2R","n":12,"ti":"Reading school and money","q":"Hur kan en stabil ekonomi ge trygghet? How can stable finances provide security?","a":"Den gör det lättare att betala kostnader och hantera oväntade händelser. It helps cover costs and unexpected events.","e":"","k":"open","acc":[],"u":5},{"s":"p2R","n":13,"ti":"Reading school and money","q":"När kan pengar skapa osämja enligt skribenten? When can money create conflict according to the writer?","a":"När pengarna styr valen för mycket och får för stor betydelse. When money controls choices too much and becomes too important.","e":"","k":"open","acc":[],"u":5},{"s":"p2R","n":14,"ti":"Reading school and money","q":"Nämn två utgifter utöver boenderäkningar i den första pengatexten. Name two expenses beyond housing bills in the first money text.","a":"Mat och nöjen. Food and entertainment.","e":"","k":"open","acc":[],"u":5},{"s":"p2R","n":15,"ti":"Reading school and money","q":"Vad betyder rätta munnen efter matsäcken? What does that idiom mean?","a":"Att anpassa utgifterna till det man har råd med. To live within one's means.","e":"","k":"open","acc":[],"u":5},{"s":"p2R","n":16,"ti":"Reading school and money","q":"Vad arbetar Erik och Elisabeth med? What are Erik's and Elisabeth's jobs?","a":"Erik är elektriker och Elisabeth är barnskötare på en förskola. Erik is an electrician and Elisabeth a preschool childcare worker.","e":"","k":"open","acc":[],"u":5},{"s":"p2R","n":17,"ti":"Reading school and money","q":"När köper familjen fredagsmys och varför behövs vinterkläder? When do they buy Friday treats and why are winter clothes needed?","a":"De köper fredagsmys inför helgen. Det blir vinter och barnen behöver varma kläder. They buy treats before the weekend; winter is coming and warm clothes are needed.","e":"","k":"open","acc":[],"u":5},{"s":"p2R","n":18,"ti":"Reading school and money","q":"Vilken är den största prissatta utgiften? What is the largest priced expense?","a":"Boendet, 15 000 kronor i månaden. Housing, 15,000 kronor monthly.","e":"","k":"open","acc":[],"u":5},{"s":"p2R","n":19,"ti":"Reading school and money","q":"Hur ska budgeten hjälpa familjen? How should the budget help the family?","a":"Den ska visa inkomster och utgifter och hjälpa dem att undvika onödiga spontanköp. It should reveal income and costs and help avoid unnecessary spontaneous purchases.","e":"","k":"open","acc":[],"u":5},{"s":"p2R","n":20,"ti":"Reading school and money","q":"Varför är 21 450 kronor inte ett säkert disponibelt överskott? Why is 21,450 kronor not a verified disposable surplus?","a":"Skattestatusen för lönerna är okänd och vissa utgifter saknar belopp. Salary tax status and some expense amounts are missing.","e":"","k":"open","acc":[],"u":5},{"s":"p2R","n":21,"ti":"Reading environment and work","q":"Vad vill miljöbloggaren att läsaren ska göra? What does the environmental blogger want the reader to do?","a":"Ta ansvar och börja göra miljövänligare val i vardagen. Take responsibility and begin making more environmentally friendly everyday choices.","e":"","k":"open","acc":[],"u":6},{"s":"p2R","n":22,"ti":"Reading environment and work","q":"Nämn två problem som hon beskriver. Name two problems she describes.","a":"Exempelvis stigande temperaturer och överutnyttjande av resurser. For example rising temperatures and overuse of resources, as described by the writer.","e":"","k":"open","acc":[],"u":6},{"s":"p2R","n":23,"ti":"Reading environment and work","q":"Nämn fyra konkreta vardagshandlingar ur texten. Name four everyday actions from the text.","a":"Stänga kranen, släcka lampor, källsortera och åka kollektivt. Turn off taps and lights, sort waste and use public transport.","e":"","k":"open","acc":[],"u":6},{"s":"p2R","n":24,"ti":"Reading environment and work","q":"Hur motiverar texten en tygkasse? How does the text justify a cloth bag?","a":"Texten beskriver den som mer hållbar än en plastpåse. The text describes it as more durable/sustainable than a plastic bag. A complete real-world comparison needs more information.","e":"","k":"open","acc":[],"u":6},{"s":"p2R","n":25,"ti":"Reading environment and work","q":"Vad betyder dra sitt strå till stacken? What does that idiom mean?","a":"Att bidra med sin del till ett gemensamt arbete. To do one's part in a shared effort.","e":"","k":"open","acc":[],"u":6},{"s":"p2R","n":26,"ti":"Reading environment and work","q":"Vad betyder miljö i arbetsmiljö? What does miljö mean in arbetsmiljö?","a":"Omgivningen och förhållandena där man arbetar. The surroundings and conditions in which one works.","e":"","k":"open","acc":[],"u":6},{"s":"p2R","n":27,"ti":"Reading environment and work","q":"Hur kan hög ljudnivå påverka människor enligt texten? How can high noise levels affect people according to the text?","a":"Den kan störa studier och skada hörseln. It can disturb studying and damage hearing.","e":"","k":"open","acc":[],"u":6},{"s":"p2R","n":28,"ti":"Reading environment and work","q":"Nämn två sociala kännetecken på en bra arbetsmiljö. Name two social features of a good work environment.","a":"Respekt och tillit/en vänlig stämning. Respect and trust/a friendly atmosphere.","e":"","k":"open","acc":[],"u":6},{"s":"p2R","n":29,"ti":"Reading environment and work","q":"Ge två exempel på anpassning av lokaler. Give two examples of adapting premises.","a":"Utrymme för rullstolar och fungerande ventilation för personer med allergier. Wheelchair access and functioning ventilation for people with allergies.","e":"","k":"open","acc":[],"u":6},{"s":"p2R","n":30,"ti":"Reading environment and work","q":"Vem ska enligt kurstexten ordna en trygg arbetsplats? Who should arrange a safe workplace according to the course text?","a":"Arbetsgivaren. The employer, according to the course text.","e":"","k":"open","acc":[],"u":6},{"s":"p2R","n":31,"ti":"Reading environment and work","q":"Vad illustrerar läkaren som arbetar som taxichaufför? What does the doctor working as a taxi driver illustrate?","a":"Att en persons utbildning och kompetens inte används fullt ut i arbetet. A person's education and skills may not be fully used in the job.","e":"","k":"open","acc":[],"u":7},{"s":"p2R","n":32,"ti":"Reading environment and work","q":"Förklara dilemmat med erfarenhetskrav. Explain the experience requirement dilemma.","a":"Man behöver erfarenhet för att få jobb men behöver jobb för att få erfarenhet. Experience is demanded for a job but a job is needed to gain experience.","e":"","k":"open","acc":[],"u":7},{"s":"p2R","n":33,"ti":"Reading environment and work","q":"Vad kan arbetsgivare missa om de bara ser erfarenhet? What might employers miss if they only look at experience?","a":"En ambitiös och kompetent persons potential. An ambitious and competent person's potential.","e":"","k":"open","acc":[],"u":7},{"s":"p2R","n":34,"ti":"Reading environment and work","q":"Vilka två hinder kopplade till språk eller namn nämns? Which two barriers linked to language or names are mentioned?","a":"Språkbrister kan dölja kompetens och ett ovanligt namn kan hindra en intervju. Language limitations may obscure skills and an unfamiliar name may prevent an interview, according to the writer.","e":"","k":"open","acc":[],"u":7},{"s":"p2R","n":35,"ti":"Reading environment and work","q":"Varför beskrivs arbete som en nyckel till integration? Why is work described as a key to integration?","a":"Arbete kan ge en plats i samhället och möjlighet att använda sin kompetens. Work can offer a place in society and a way to use skills.","e":"","k":"open","acc":[],"u":7},{"s":"p2R","n":36,"ti":"Reading environment and work","q":"Vilket hoppfullt perspektiv tillför den andra arbetstexten? What hopeful perspective does the second work text add?","a":"Det finns också personer som får kvalificerade arbeten eller startar framgångsrika företag. Some people also obtain qualified roles or build successful companies.","e":"","k":"open","acc":[],"u":7},{"s":"p2R","n":37,"ti":"Reading environment and work","q":"Varför flyttade Flora till Sverige? Why did Flora move to Sweden?","a":"Hon flyttade för kärlekens skull med sin man. She moved because of love, with her husband.","e":"","k":"open","acc":[],"u":7},{"s":"p2R","n":38,"ti":"Reading environment and work","q":"Vilket arbete hade hon haft och vad var hennes mål? What work had she done and what was her goal?","a":"Hon hade varit engelsklärare och ville arbeta som lärare igen. She had taught English and wanted to teach again.","e":"","k":"open","acc":[],"u":7},{"s":"p2R","n":39,"ti":"Reading environment and work","q":"Hur kombinerade Flora utbildning och andra ansvar? How did Flora combine education and other responsibilities?","a":"Hon läste svenska, arbetade, tog hand om barn och studerade senare till lärare. She learned Swedish, worked, cared for children and later studied teaching.","e":"","k":"open","acc":[],"u":7},{"s":"p2R","n":40,"ti":"Reading environment and work","q":"Varför ska vi inte läsa berättelsen som en garanti för framgång? Why should we not read the story as a guarantee of success?","a":"Det är ett individuellt exempel och människor möter olika hinder och möjligheter. It is an individual case and people face different barriers and opportunities.","e":"","k":"open","acc":[],"u":7},{"s":"p2a","n":41,"ti":"Reflexive verbs and tenses","q":"Fyll i pronomen: Jag koncentrerar ___. Fill in the pronoun: I concentrate.","a":"mig.","e":"Mig syftar tillbaka på subjektet jag. Mig refers back to the subject jag.","k":"fill","acc":[],"u":8},{"s":"p2a","n":42,"ti":"Reflexive verbs and tenses","q":"Vi måste anstränga ___. We must make an effort.","a":"oss.","e":"Vi → oss. We → ourselves.","k":"fill","acc":[],"u":8},{"s":"p2a","n":43,"ti":"Reflexive verbs and tenses","q":"De har bestämt ___ för att studera. They have decided to study.","a":"sig.","e":"De → sig. They → themselves.","k":"fill","acc":[],"u":8},{"s":"p2a","n":44,"ti":"Reflexive verbs and tenses","q":"Du behöver anmäla ___. You need to sign up.","a":"dig.","e":"Du → dig. You singular → yourself.","k":"fill","acc":[],"u":8},{"s":"p2a","n":45,"ti":"Reflexive verbs and tenses","q":"Ni ska sätta ___ här. You plural should sit down here.","a":"er.","e":"Ni → er. You plural → yourselves.","k":"fill","acc":[],"u":8},{"s":"p2a","n":46,"ti":"Reflexive verbs and tenses","q":"Förklara skillnaden: Hon tvättar sig / Hon tvättar henne. Explain the difference.","a":"Sig syftar på subjektet hon; henne syftar normalt på en annan person. Sig refers back to she; henne normally to another person.","e":"","k":"open","acc":[],"u":8},{"s":"p2a","n":47,"ti":"Reflexive verbs and tenses","q":"Byt till preteritum: Jag försover mig. Change to past tense.","a":"Jag försov mig.","e":"Försova är starkt: försov, försovit. Past: I overslept.","k":"fill","acc":[],"u":8},{"s":"p2a","n":48,"ti":"Reflexive verbs and tenses","q":"Byt till perfekt: k kom. Use except.","a":"utom.","e":"Except. Utesluter Erik.","k":"fill","acc":[],"u":8},{"s":"p2b","n":65,"ti":"Prepositions nouns and sentence order","q":"Svara ___ tio minuter. Use within.","a":"inom.","e":"Within a limit. Inom en gräns.","k":"fill","acc":[],"u":8},{"s":"p2b","n":66,"ti":"Prepositions nouns and sentence order","q":"Hon är yngst ___ syskonen. Use among.","a":"bland.","e":"Among a group. I en grupp.","k":"fill","acc":[],"u":8},{"s":"p2b","n":67,"ti":"Prepositions nouns and sentence order","q":"Ett halsband ___ silver. Choose a preposition.","a":"av.","e":"Material. Materialrelation.","k":"fill","acc":[],"u":8},{"s":"p2b","n":68,"ti":"Prepositions nouns and sentence order","q":"Brevet skrevs ___ henne. Choose a preposition.","a":"av.","e":"Passive agent. Passiv agent.","k":"fill","acc":[],"u":8},{"s":"p2b","n":69,"ti":"Prepositions nouns and sentence order","q":"Jag har bott här ___ 2020. Use since.","a":"sedan.","e":"Starting point continuing to now. Startpunkt som gäller fram till nu.","k":"fill","acc":[],"u":8},{"s":"p2b","n":70,"ti":"Prepositions nouns and sentence order","q":"Jag flyttade hit ___ två år ___. Use two years ago.","a":"för två år sedan.","e":"Ago construction. Uttryck för tid bakåt.","k":"fill","acc":[],"u":8},{"s":"p2b","n":71,"ti":"Prepositions nouns and sentence order","q":"Ge artikel och plural: lärare, mål, utgift, möjlighet. Give article and plural.","a":"en lärare, lärare; ett mål, mål; en utgift, utgifter; en möjlighet, möjligheter.","e":"Learn article and plural together. Lär artikel och plural tillsammans.","k":"fill","acc":[],"u":8},{"s":"p2b","n":72,"ti":"Prepositions nouns and sentence order","q":"Gör bestämd plural: skola, elev, barn, företag. Give definite plural.","a":"skolorna, eleverna, barnen, företagen.","e":"Definite plurals. Bestämd plural.","k":"fill","acc":[],"u":8},{"s":"p2b","n":73,"ti":"Prepositions nouns and sentence order","q":"Rätta: min skolan och hennes utbildningen. Correct the noun forms.","a":"mi es not come by itself.","e":"","k":"open","acc":[],"u":9,"ins":""},{"s":"p3R","n":2,"ti":"Läsfrågor, kapitel 8","q":"Vilka faktorer gör att vuxna ändå kan lära sig ett nytt språk?","a":"SV: Motivation, vilja och mod. EN: Motivation, willingness and courage.","e":"","k":"open","acc":[],"u":9,"ins":""},{"s":"p3R","n":3,"ti":"Läsfrågor, kapitel 8","q":"Varför lär sig barn ofta snabbare än vuxna?","a":"SV: De är modiga och inte rädda för att säga fel eller göra bort sig. EN: They are brave and not afraid of making mistakes.","e":"","k":"open","acc":[],"u":9,"ins":""},{"s":"p3R","n":4,"ti":"Läsfrågor, kapitel 8","q":"Ge två exempel på olika sätt att lära sig ett språk.","a":"SV: Genom grammatiska regler och övningar med penna och papper, eller genom samtal, sociala kontakter och vänner. EN: Through rules and written exercises, or through conversation and social contacts.","e":"","k":"open","acc":[],"u":9,"ins":""},{"s":"p3R","n":5,"ti":"Läsfrågor, kapitel 8","q":"Vad tycker Sebastian är bra med sfi?","a":"SV: Han lärde sig grunderna, fick grammatiken förklarad och kunde öva med elever på samma nivå. EN: He learned the basics, had grammar explained and could practise with learners at his level.","e":"","k":"open","acc":[],"u":9,"ins":""},{"s":"p3R","n":6,"ti":"Läsfrågor, kapitel 8","q":"Var lärde sig Nicolina svenska och vad hjälpte henne?","a":"SV: På ett tillfälligt jobb. Hon var modig och vågade prata trots att hon sa fel. EN: In a temporary job; she was brave and dared to speak despite mistakes.","e":"","k":"open","acc":[],"u":9,"ins":""},{"s":"p3R","n":7,"ti":"Läsfrågor, kapitel 8","q":"Hur skiljer sig vuxnas och barns sätt att lära sig enligt Susanne?","a":"SV: Vuxna tänker på grammatik och struktur innan de pratar. Barn pratar på utan att fundera. EN: Adults reflect on grammar first; children just talk.","e":"","k":"open","acc":[],"u":9,"ins":""},{"s":"p3R","n":8,"ti":"Läsfrågor, kapitel 8","q":"Vad har texterna gemensamt?","a":"SV: Alla kan lära sig, men man måste hitta sitt eget sätt och ha tålamod. EN: Everyone can learn, but you must find your own way and be patient.","e":"","k":"open","acc":[],"u":9,"ins":""},{"s":"p3R2","n":1,"ti":"Läsfrågor, kapitel 9","q":"Varför är tiden med familjen så viktig för Hans?","a":"SV: De skapar minnen tillsammans som de har med sig resten av livet. EN: They create memories they keep for the rest of their lives.","e":"","k":"open","acc":[],"u":10,"ins":""},{"s":"p3R2","n":2,"ti":"Läsfrågor, kapitel 9","q":"Vad kan hända när vardagsrutinerna tar över?","a":"SV: Man glömmer att ha roligt, blir distraherad och prioriterar saker i stället för personer. EN: You forget to have fun, get distracted and prioritise things over people.","e":"","k":"open","acc":[],"u":10,"ins":""},{"s":"p3R2","n":3,"ti":"Läsfrågor, kapitel 9","q":"Vad har Hans och hans fru bestämt?","a":"SV: Att ingenting annat ska gå före deras relation. EN: That nothing else should come before their relationship.","e":"","k":"open","acc":[],"u":10,"ins":""},{"s":"p3R2","n":4,"ti":"Läsfrågor, kapitel 9","q":"Vilket råd ger Hans när något bekymrar en?","a":"SV: Att ta upp det direkt och prata öppet med sin partner. EN: Raise it at once and talk openly with your partner.","e":"","k":"open","acc":[],"u":10,"ins":""},{"s":"p3R2","n":5,"ti":"Läsfrågor, kapitel 9","q":"Hur fick Daniel veta att pappa träffade Karin?","a":"SV: Pappa skulle gå på middag med en kollega, och när Daniel frågade vem det var berättade han. EN: His father was going to dinner with a colleague and told him when he asked.","e":"","k":"open","acc":[],"u":10,"ins":""},{"s":"p3R2","n":6,"ti":"Läsfrågor, kapitel 9","q":"Vad är huvudsaken enligt Miranda?","a":"SV: Att den som har valt att bli förälder tar ansvar för barnens uppfostran. EN: That whoever chose to become a parent takes responsibility for raising the children.","e":"","k":"open","acc":[],"u":10,"ins":""},{"s":"p3R2","n":7,"ti":"Läsfrågor, kapitel 9","q":"Hur var Margaretas pappa och mamma olika?","a":"SV: Pappa arbetade hela tiden och var frånvarande. Mamma var närvarande, glad och fanns alltid där. EN: Her father was always working and absent; her mother was present and always there.","e":"","k":"open","acc":[],"u":10,"ins":""},{"s":"p3R2","n":8,"ti":"Läsfrågor, kapitel 9","q":"Finns det en idealfamilj enligt texterna?","a":"SV: Nej, familjer ser olika ut. Det viktiga är kärlek, ansvar och tid tillsammans. EN: No, families differ; love, responsibility and time together matter most.","e":"","k":"open","acc":[],"u":10,"ins":""},{"s":"test3","n":141,"ti":"Slutprov del 3","q":"Bilda presens particip: skratta","a":"skrattande","e":"","k":"fill","acc":[],"u":-1,"ins":""},{"s":"test3","n":142,"ti":"Slutprov del 3","q":"Bilda presens particip: le","a":"leende","e":"","k":"fill","acc":[],"u":-1,"ins":""},{"s":"test3","n":143,"ti":"Slutprov del 3","q":"Fyll i: Det var en ___ resa. (spänna)","a":"spännande","e":"","k":"fill","acc":[],"u":-1,"ins":""},{"s":"test3","n":144,"ti":"Slutprov del 3","q":"Fyll i: Han kom ___ in i köket. (springa)","a":"springande","e":"","k":"fill","acc":[],"u":-1,"ins":""},{"s":"test3","n":145,"ti":"Slutprov del 3","q":"Rätta: ett krävandet arbete","a":"ett krävande arbete","e":"","k":"rewrite","acc":[],"u":-1,"ins":""},{"s":"test3","n":146,"ti":"Slutprov del 3","q":"Fyll i: Två ___ kallades till intervju. (söka)","a":"sökande","e":"","k":"fill","acc":[],"u":-1,"ins":""},{"s":"test3","n":147,"ti":"Slutprov del 3","q":"Fyll i: ___ mer jag övar, ___ bättre blir jag.","a":"Ju, desto","e":"","k":"fill","acc":[],"u":-1,"ins":""},{"s":"test3","n":148,"ti":"Slutprov del 3","q":"Ge preteritum och supinum: inse","a":"insåg, insett","e":"","k":"fill","acc":[],"u":-1,"ins":""},{"s":"test3","n":149,"ti":"Slutprov del 3","q":"Översätt: She dared to speak.","a":"Hon vågade prata.","e":"","k":"rewrite","acc":[],"u":-1,"ins":""},{"s":"test3","n":150,"ti":"Slutprov del 3","q":"Fyll i: Vi ___ i Sverige sedan 2020. (bo, perfekt)","a":"har bott","e":"","k":"fill","acc":[],"u":-1,"ins":""},{"s":"test3","n":151,"ti":"Slutprov del 3","q":"Fyll i: Förra året ___ vi till Göteborg. (flytta)","a":"flyttade","e":"","k":"fill","acc":[],"u":-1,"ins":""},{"s":"test3","n":152,"ti":"Slutprov del 3","q":"Fyll i: När jag kom ___ filmen redan börjat. (före då)","a":"hade","e":"","k":"fill","acc":[],"u":-1,"ins":""},{"s":"test3","n":153,"ti":"Slutprov del 3","q":"Fyll i: Han lovade att han ___ komma. (efter då)","a":"skulle","e":"","k":"fill","acc":[],"u":-1,"ins":""},{"s":"test3","n":154,"ti":"Slutprov del 3","q":"Vilken tempusform: \"kommer att bli\"?","a":"futurum","e":"","k":"fill","acc":[],"u":-1,"ins":""},{"s":"test3","n":155,"ti":"Slutprov del 3","q":"Skriv om i dåtid: Hon ringer sin mamma varje dag.","a":"Hon ringde sin mamma varje dag.","e":"","k":"rewrite","acc":[],"u":-1,"ins":""},{"s":"test3","n":156,"ti":"Slutprov del 3","q":"Ge preteritum och supinum: stjäla","a":"stal, stulit","e":"","k":"fill","acc":[],"u":-1,"ins":""},{"s":"test3","n":157,"ti":"Slutprov del 3","q":"Fyll i: Min mamma ___ alltid upp för mig. (preteritum)","a":"ställde","e":"","k":"fill","acc":[],"u":-1,"ins":""},{"s":"test3","n":158,"ti":"Slutprov del 3","q":"Översätt: The main thing is that the children are well.","a":"Huvudsaken är att barnen mår bra.","e":"","k":"rewrite","acc":[],"u":-1,"ins":""},{"s":"test3","n":159,"ti":"Slutprov del 3","q":"Översätt: I found out yesterday.","a":"Jag fick reda på det i går.","e":"","k":"rewrite","acc":[],"u":-1,"ins":""},{"s":"test3","n":160,"ti":"Slutprov del 3","q":"Fyll i adjektivet: Hon talade med ___ ord. (loving, plural)","a":"kärleksfulla","e":"","k":"fill","acc":[],"u":-1,"ins":""},{"s":"skriv","n":1,"ti":"Skriv","q":"Svara en vän som ska flytta till ditt område. Beskriv området, ge två praktiska tips, nämn en nackdel och föreslå en träff. (120–180 ord)","a":"SV: Hej! Vad roligt att du ska flytta hit. Jag trivs bra eftersom området är lugnt och det är nära till bussen. Det finns också en liten matbutik, men den är ganska dyr. Innan du flyttar tycker jag att du ska göra en lista över alla kostnader. Försök också boka hjälp med flytten i god tid. En nackdel med området är att det ibland är svårt att parkera. Hör gärna av dig om du behöver hjälp med några kartonger. Ska vi ses första helgen efter flytten? Kram, Alex EN: A friendly reply that describes the area, gives two tips, names a drawback and suggests meeting.","e":"Läs modellen efter att du har skrivit. Kontrollera verbets plats, en/ett och adjektivens böjning.","k":"open","acc":[],"u":0,"ins":""},{"s":"skriv","n":2,"ti":"Skriv","q":"Skriv ett brev om dina hälsovanor: en vana som fungerar, ett hinder och ett realistiskt mål. Använd minst två bisatser och tre rätt böjda adjektiv. (120–180 ord)","a":"SV: Hej Andreas! För mig är det viktigt att hitta vanor som fungerar i vardagen. Jag brukar promenera efter arbetet eftersom det hjälper mig att koppla av. Jag försöker också planera maten, men när jag är stressad blir det ibland något enkelt. Jag skulle vilja bli bättre på att ta pauser och lägga mig i tid. Min viktigaste erfarenhet är att det blir lättare att fortsätta med en vana när jag tycker om den. Med vänliga hälsningar, Alex EN: A letter about real habits, one obstacle and one realistic goal.","e":"Läs modellen efter att du har skrivit. Kontrollera verbets plats, en/ett och adjektivens böjning.","k":"open","acc":[],"u":1,"ins":""},{"s":"skriv","n":3,"ti":"Skriv","q":"Svara på en inbjudan från en vän. Tacka, föreslå vad ni kan göra, ge ett alternativ om vädret blir dåligt och föreslå en tid. (120–180 ord)","a":"SV: Hej min vän! Tack för ditt brev. Jag vill gärna träffas på lördag. Ska vi ta en promenad vid sjön och sedan fika? Om det regnar kan vi gå direkt till kaféet nära stationen. Jag kan komma klockan två och stanna till fem. Jag föredrar att göra något lugnt den här helgen eftersom veckan har varit intensiv. Skriv gärna om tiden passar dig. Jag ser fram emot att träffa dig! Kram, Alex EN: A reply that accepts, suggests an activity and a fallback, and proposes a time.","e":"Läs modellen efter att du har skrivit. Kontrollera verbets plats, en/ett och adjektivens böjning.","k":"open","acc":[],"u":2,"ins":""},{"s":"skriv","n":4,"ti":"Skriv","q":"Svara på skolans fråga om vad eleverna tycker. Ta med något bra och varför, något som behöver förbättras och ett praktiskt förslag. (130–180 ord)","a":"SV: Hej skolledningen! Tack för att ni vill veta vad vi elever tycker. Jag trivs på skolan eftersom lärarna är engagerade och förklarar svåra ord på flera sätt. Däremot är det ibland svårt att koncentrera sig när flera grupper arbetar i samma rum. Jag föreslår därför att vi använder olika rum vid vissa gruppövningar. Vi elever behöver förstås också ta ansvar genom att komma i tid. Vänliga hälsningar, Alex EN: Something good, something to improve and a practical suggestion, in a polite tone.","e":"Läs modellen efter att du har skrivit. Kontrollera verbets plats, en/ett och adjektivens böjning.","k":"open","acc":[],"u":4,"ins":""},{"s":"skriv","n":5,"ti":"Skriv","q":"Skriv till Erik och Elisabeth med förslag om sparande och hjälp dem att planera en budget. Förklara vilken information som saknas. Använd skulle kunna, bör och behöver. (140–190 ord)","a":"SV: Hej Erik och Elisabeth! Börja med att skriva upp alla inkomster som faktiskt betalas ut och kontrollera om lönerna är före eller efter skatt. Skriv sedan upp alla kostnader. Ni behöver också ta med försäkringar och kläder. Ni skulle kunna bestämma en gräns för spontana inköp och jämföra telefonkostnaderna. När alla belopp är kända kan ni se vad som blir kvar. Vänliga hälsningar, Alex EN: Practical, non-accusing budget advice that names the missing information.","e":"Läs modellen efter att du har skrivit. Kontrollera verbets plats, en/ett och adjektivens böjning.","k":"open","acc":[],"u":5,"ins":""},{"s":"skriv","n":6,"ti":"Skriv","q":"Skriv till kommunens politiker och ge två välmotiverade förslag som gör det lättare att leva miljövänligt. (140–190 ord)","a":"SV: Hej! Jag skriver för att föreslå två åtgärder. För det första önskar jag tydligare information om källsortering, gärna med bilder och på flera språk. För det andra föreslår jag att kommunen undersöker om gång- och cykelvägarna till skolorna kan förbättras. Trygga vägar gör det lättare att välja andra färdsätt än bil. Jag ser fram emot ert svar. Vänliga hälsningar, Alex EN: Two developed proposals, each with a reason and an effect.","e":"Läs modellen efter att du har skrivit. Kontrollera verbets plats, en/ett och adjektivens böjning.","k":"open","acc":[],"u":6,"ins":""},{"s":"skriv","n":7,"ti":"Skriv","q":"Skriv ett personligt brev till ett arbete som intresserar dig. Ange arbetet, förklara ditt intresse, koppla två förmågor till verkliga exempel och avsluta artigt. (150–200 ord)","a":"SV: Hej! Jag vill söka tjänsten som butiksmedarbetare hos er. Jag är intresserad av arbetet eftersom jag tycker om att möta människor och samarbeta. Under min praktik hjälpte jag kunder och såg till att hyllorna var välordnade. Där lärde jag mig att lyssna noga och be om hjälp när det behövdes. Jag berättar gärna mer vid en intervju. Vänliga hälsningar, Alex EN: Role, motivation, two abilities with examples and a polite close.","e":"Läs modellen efter att du har skrivit. Kontrollera verbets plats, en/ett och adjektivens böjning.","k":"open","acc":[],"u":7,"ins":""},{"s":"skriv","n":8,"ti":"Skriv","q":"Metoder och strategier: Skriv om hur du lär dig svenska. Vilka metoder fungerar för dig, vad är svårt och vilket råd skulle du ge en ny elev? Använd minst två presens particip och ju … desto. (120–180 ord)","a":"SV: Jag lär mig svenska både i skolan och på egen hand. Det som fungerar bäst för mig är att lyssna på texterna och sedan läsa dem högt. Jag skriver också upp nya ord och använder dem i egna meningar. Det svåraste är att våga prata snabbt, eftersom jag ofta funderar på grammatiken först. Ju mer jag pratar med kollegor, desto modigare blir jag. Det är krävande, men också spännande och berikande. Mitt råd till en ny elev är att hitta sitt eget sätt och ha tålamod. EN: Your methods, one difficulty and one piece of advice, with present participles and ju … desto.","e":"Läs modellen efter att du har skrivit. Kontrollera verbets plats, en/ett och adjektivens böjning.","k":"open","acc":[],"u":9,"ins":""},{"s":"skriv","n":9,"ti":"Skriv","q":"Min familj: Beskriv din familj eller en viktig person i ditt liv. Berätta något om hur det var förr, hur det är nu och vad ni ska göra i framtiden. Använd både nutid och dåtid. (120–180 ord)","a":"SV: Jag har en stor familj, men vi bor i olika länder. När jag var liten bodde vi alla i samma stad och vi åt middag tillsammans varje söndag. Min mamma hade alltid lagat mat innan vi kom. I dag ringer jag mina föräldrar varje vecka och vi har videosamtal med mina syskon. Jag har bott i Sverige i några år nu och jag trivs bra. Nästa sommar ska hela familjen träffas igen. Jag tror att det kommer att bli en fin vecka. EN: Then, now and the future, mixing perfekt, preteritum, pluskvamperfekt and futurum.","e":"Läs modellen efter att du har skrivit. Kontrollera verbets plats, en/ett och adjektivens böjning.","k":"open","acc":[],"u":10,"ins":""},{"s":"tala","n":1,"ti":"Tala","q":"Beskriv din bostad och en förändring du skulle vilja göra. Tala i två minuter: en beskrivning, ett skäl, ett exempel och en avslutande tanke.","a":"Exempel: Jag bor i en tvåa nära tunnelbanan. Det bästa är att det är lugnt. En nackdel är att köket är litet, så jag skulle vilja ha ett större kök eftersom jag lagar mycket mat.","e":"","k":"open","acc":[],"u":0,"ins":""},{"s":"tala","n":2,"ti":"Tala","q":"Ge en vän vänliga råd om en stressig vardag. Använd skulle kunna, bör och kanske.","a":"Exempel: Du skulle kunna ta en kort promenad efter jobbet. Du bör kanske lägga dig lite tidigare. Det viktigaste är att du väljer något du tycker om.","e":"","k":"open","acc":[],"u":1,"ins":""},{"s":"tala","n":3,"ti":"Tala","q":"Jämför din fritid med Saschas och Rimonas. Planerar du eller tar du dagen som den kommer?","a":"Exempel: Till skillnad från Sascha tycker jag om att planera. På helgerna brukar jag träna och träffa vänner, men ibland vill jag bara vila.","e":"","k":"open","acc":[],"u":2,"ins":""},{"s":"tala","n":4,"ti":"Tala","q":"Berätta vad en bra lärare gör och vad eleverna själva behöver ta ansvar för.","a":"Exempel: En bra lärare förklarar tydligt och kontrollerar att alla förstår. Eleverna behöver också anstränga sig och våga fråga.","e":"","k":"open","acc":[],"u":4,"ins":""},{"s":"tala","n":5,"ti":"Tala","q":"Förklara hur man gör en enkel budget och ge två tips för att spara pengar.","a":"Exempel: Först skriver man upp alla inkomster. Sedan skriver man upp alla utgifter. Man kan spara genom att planera matinköpen och jämföra mobilabonnemang.","e":"","k":"open","acc":[],"u":5,"ins":""},{"s":"tala","n":6,"ti":"Tala","q":"Berätta vad du gör för miljön i vardagen och vad mer du skulle kunna göra.","a":"Exempel: Jag källsorterar och åker kollektivt till jobbet. Jag skulle kunna köpa färre kläder och laga mer vegetarisk mat.","e":"","k":"open","acc":[],"u":6,"ins":""},{"s":"tala","n":7,"ti":"Tala","q":"Förbered dig för en jobbintervju: presentera dig, berätta om en erfarenhet och ställ en fråga till arbetsgivaren.","a":"Exempel: Jag heter Sam och jag har arbetat som elektriker i sex år. I mitt förra jobb ansvarade jag för ett stort projekt. Hur ser introduktionen ut för en ny medarbetare?","e":"","k":"open","acc":[],"u":7,"ins":""},{"s":"tala","n":8,"ti":"Tala","q":"Vad ska man tänka på när man vill lära sig ett nytt språk? Ge din åsikt och ett råd.","a":"Exempel: Jag tycker att man ska börja prata direkt, även om man säger fel. Man bör också läsa lite varje dag. Ju mer man övar, desto lättare blir det.","e":"","k":"open","acc":[],"u":9,"ins":""},{"s":"tala","n":9,"ti":"Tala","q":"Berätta hur du håller kontakten med din familj. Hur ofta hörs ni och vad pratar ni om?","a":"Exempel: Jag brukar ringa min familj på söndagar. Det är viktigt för mig att prata med mina barn varje dag. Förra månaden träffades vi alla för första gången på länge.","e":"","k":"open","acc":[],"u":10,"ins":""}],"R":[{"ti":"Det behövs fler bostäder","c":0,"sv":["Texten beskriver bostadsbristen i storstäderna. Många vill bo där, men byggandet hinner inte möta befolkningsökningen. Nya bostäder kostar mycket, och personer med små ekonomiska resurser har svårt att köpa en egen bostad. Därför bor en del unga kvar hos sina föräldrar eller blir inneboende. Innerstaden är särskilt efterfrågad eftersom många uppskattar läget och möjligheterna till arbete.","Johan är trettio år och arbetslös. Han bor hos sina föräldrar i en liten lägenhet. De har inte något emot det, men han vill kunna styra sitt eget liv. Han upplever både bekvämlighet och skam. När han fyller år kan han inte bjuda hem alla vänner eftersom det saknas plats."],"en":["The text describes a shortage of homes in major cities. Demand and population growth exceed the pace of construction. New homes are expensive, making ownership difficult for people with limited resources. Some young adults therefore stay with their parents or rent a room in someone else's home. Central locations are especially attractive because of convenience and job opportunities.","Johan is thirty and unemployed. He lives with his parents in a small flat. They accept the arrangement, but he wants independence. He finds it convenient while also feeling embarrassed. Lack of space prevents him from inviting all his friends to his birthday celebration."]},{"ti":"Hur bor jag","c":0,"sv":["Kim och hans flickvän prioriterar ett centralt läge. De bor på 46 kvadratmeter med nära till tunnelbana och matbutik. Nackdelarna är kostnaden, trängseln och konflikter om ljud. Kim tänker ibland att en villa skulle ge mer utrymme och större frihet. Alex är 22 år och tycker om att bo hemma eftersom hans mamma sköter hushållet. Han drömmer om en lyxbåt som går att flytta när han tröttnar p
