ithin ten minutes."],["Exception Undantag","Alla utom jag kom.","Everyone except me came."],["Group Grupp","Hon är yngst bland syskonen.","She is youngest among the siblings."],["Between Mellan","Han sitter mellan Erik och Ali.","He sits between Erik and Ali."],["Approximate time Ungefärlig tid","Vi börjar vid sjutiden.","We begin around seven."]],"av":[["Funktion Function","Svenska","English"],["Source Källa","Jag lånar pengar av min syster.","I borrow money from my sister."],["Cause Orsak","Hon gråter av glädje.","She cries with joy."],["Material","Ett halsband av silver.","A necklace made of silver."],["Part of a group Del av grupp","En av eleverna frågar.","One of the pupils asks."],["Passive agent Passiv agent","Boken skrevs av henne.","The book was written by her."],["Fixed phrase Fast uttryck","I slutet av månaden.","At the end of the month."]],"passive":[["Aktiv infinitiv Active infinitive","Passiv infinitiv Passive infinitive","Presens Present","Preteritum Past","Supinum Supine"],["tvätta","tvättas","tvättas","tvättades","tvättats"],["stänga","stängas","stängs","stängdes","stängts"],["läsa","läsas","läses","lästes","lästs"],["nå","nås","nås","nåddes","nåtts"],["vinna","vinnas","vinns","vanns","vunnits"],["äta","ätas","äts","åts","ätits"]],"participles":[["Verbgrupp Verb group","En form","Ett form","Plural och bestämd form Plural and definite","English"],["1 måla","målad","målat","målade","painted"],["2a stänga","stängd","stängt","stängda","closed"],["2b läsa","läst","läst","lästa","read"],["3 klä","klädd","klätt","klädda","dressed; covered"],["4 skriva","skriven","skrivet","skrivna","written"],["2a utföra","utförd","utfört","utförda","carried out"],["4 erbjuda","erbjuden","erbjudet","erbjudna","offered"],["1 renovera","renoverad","renoverat","renoverade","renovated"]],"bli":[["Tid Time","Bli passiv Bli passive","English"],["Nu Now","Breven blir skrivna.","The letters are being written."],["Då Past","Breven blev skrivna.","The letters were written."],["Perfekt Perfect","Breven har blivit skrivna.","The letters have been written."],["Framtid Future","Breven ska bli skrivna.","The letters will be written."],["Tillstånd State","Breven är skrivna.","The letters are written and ready."]],"budget":[["Post i berättelsen Item in the story","Kronor per månad SEK per month"],["Eriks lön Erik's salary","28 000"],["Elisabeths lön Elisabeth's salary","24 000"],["Barnbidrag Child benefit stated in the story","3 750"],["Summa angivna inkomster Total stated income","55 750"],["Barnens aktiviteter Children's activities","2 500"],["Boende inklusive räntor el värme vatten Housing including interest electricity heating water","15 000"],["Bilar Cars","5 000"],["Kollektivtrafik Public transport","1 800"],["Telefoner Phones","2 000"],["Mat Food","8 000"],["Summa prissatta utgifter Total priced expenses","34 300"],["Skillnad mellan dessa uppgifter Difference between those figures","21 450"]],"prespart":[["Infinitiv","Presens particip","English"],["skratta","skrattande","laughing"],["arbeta","arbetande","working"],["kräva","krävande","demanding"],["le","leende","smiling"],["bero","beroende","dependent"],["gå","gående","walking"],["springa","springande","running"],["gråta","gråtande","crying"],["studera","studerande","studying; student"],["söka","sökande","applying; applicant"],["resa","resande","travelling; traveller"],["spänna","spännande","exciting"],["berika","berikande","enriching"],["anstränga","ansträngande","strenuous"],["komma","kommande","coming; upcoming"],["följa","följande","following"]],"tempus":[["Tempus","Tid","Form","Exempel"],["perfekt","före nu","har + supinum","Jag har bott här i fem år."],["presens","nu","presens","Jag bor i Stockholm."],["futurum","efter nu","ska / kommer att + infinitiv","Jag ska flytta i vår."],["pluskvamperfekt","före då","hade + supinum","Jag hade bott där i ett år när jag träffade henne."],["preteritum","då","preteritum","Jag flyttade hit 2021."],["futurum preteritum","efter då","skulle + infinitiv","Han sa att han skulle komma senare."]]},"GR":[{"id":"pron","u":0,"ti":"Indefinita pronomen","en":"Indefinite pronouns: någon, ingen, annan, all","ren":["Indefinite pronouns talk about people or things in a vague way: some, any, no, other, all.","Before a noun they follow the noun: en-word, ett-word or plural.","Used alone, någon/ingen mean a person, något/inget/ingenting mean a thing, alla means everyone and allt means everything.","Ingen already contains \"not\". Never write inte ingen."],"rsv":["Indefinita pronomen säger något obestämt om personer eller saker.","Framför ett substantiv böjs de efter en-ord, ett-ord eller plural.","Ensamma: någon/ingen = person, något/inget/ingenting = sak, alla = alla människor, allt = allting.","Ingen innehåller redan inte. Skriv aldrig inte ingen."],"tb":{"h":["","En-ord","Ett-ord","Plural"],"r":[["some, any","någon","något","några"],["no, none","ingen","inget","inga"],["other","annan","annat","andra"],["all","all","allt","alla"]]},"ex":[["Har du någon bostad?","Do you have a home?"],["Vi har inget kök.","We have no kitchen."],["De vill flytta till en annan lägenhet.","They want to move to another flat."],["Alla grannar är trevliga.","All the neighbours are nice."],["Ingen har ringt i dag.","Nobody has called today."],["Allt är klart.","Everything is ready."]],"pit":[["Jag har inte ingen bil.","Jag har ingen bil. / Jag har inte någon bil.","Double negation is wrong in Swedish."],["ett annan hus","ett annat hus","Annan follows the gender: ett annat."],["Alla är klart.","Allt är klart.","Alla = people, allt = things."]],"pr":[{"q":"Jag har ___ bostad. (no)","a":"ingen","e":"","o":["ingen","inget","inga","inte någon"]},{"q":"Finns det ___ ledigt rum? (any)","a":"något","e":"","o":["någon","något","några","inget"]},{"q":"Vi har ___ grannar som vi inte känner. (some)","a":"några","e":"","o":["någon","något","några","alla"]},{"q":"De köpte ett ___ hus. (other)","a":"annat","e":"","o":["annan","annat","andra","annars"]},{"q":"___ barnen är hemma. (all)","a":"Alla","e":"","o":["All","Allt","Alla","Andra"]},{"q":"Har ___ sett min nyckel? (anyone)","a":"någon","e":"","o":["något","någon","några","ingen"]},{"q":"Jag hör ___ oväsen. (no)","a":"inget","e":"Oväsen är ett-ord: inget oväsen."},{"q":"Rätta: Vi har inte inga pengar.","a":"Vi har inga pengar.","e":"Ingen dubbel negation.","acc":["Vi har inte några pengar."]}]},{"id":"noun","u":0,"ti":"Substantiv i fyra former","en":"Nouns: en/ett, definite and plural","ren":["Learn every noun with four forms: en bostad – bostaden – bostäder – bostäderna.","The definite article is an ending: -en/-n for en-words, -et/-t for ett-words.","Plural endings: -or (en flicka → flickor), -ar (en bil → bilar), -er (en park → parker), -n (ett äpple → äpplen), no ending (ett hus → hus).","In compounds the last word decides: ett rum → ett sovrum, en kostnad → en boendekostnad."],"rsv":["Lär dig varje substantiv med fyra former: en bostad – bostaden – bostäder – bostäderna.","Bestämd form är en ändelse: -en/-n för en-ord, -et/-t för ett-ord.","Pluraländelser: -or, -ar, -er, -n eller ingen ändelse.","I sammansatta ord bestämmer sista ordet: ett sovrum, en boendekostnad."],"tb":{"h":["Plural","Obestämd","Bestämd","Plural","Bestämd plural"],"r":[["-or","en flicka","flickan","flickor","flickorna"],["-ar","en granne","grannen","grannar","grannarna"],["-er","en bostad","bostaden","bostäder","bostäderna"],["-n","ett ställe","stället","ställen","ställena"],["–","ett hus","huset","hus","husen"]]},"ex":[["Lägenheten ligger centralt.","The flat is centrally located."],["Vi har två sovrum.","We have two bedrooms."],["Grannarna är tysta.","The neighbours are quiet."],["Husen i området är gamla.","The houses in the area are old."],["Hyran är hög.","The rent is high."]],"pit":[["ett lägenhet","en lägenhet","Learn the article with the word."],["två husar","två hus","Ett-words ending in a consonant often take no plural ending."],["min lägenheten","min lägenhet","After min/din/hans the noun has no definite ending."]],"pr":[{"q":"Bestämd form av en bostad:","a":"bostaden","e":"","o":["bostadet","bostaden","bostäder","bostäderna"]},{"q":"Plural av ett hus:","a":"hus","e":"","o":["husar","huser","hus","husen"]},{"q":"Plural av en granne:","a":"grannar","e":"","o":["granner","grannar","grannor","grannen"]},{"q":"Bestämd plural av ett barn:","a":"barnen","e":"","o":["barnena","barnen","barnet","barnarna"]},{"q":"En eller ett: ___ sovrum","a":"ett","e":"","o":["en","ett"]},{"q":"Skriv bestämd form: ett kök","a":"köket","e":""},{"q":"Skriv plural: en hand","a":"händer","e":""},{"q":"Rätta: Jag gillar min nya lägenheten.","a":"Jag gillar min nya lägenhet.","e":""}]},{"id":"adj","u":1,"ti":"Adjektiv: en, ett och plural","en":"Adjective agreement","ren":["An adjective agrees with its noun: no ending for en-words, -t for ett-words, -a for plural.","The same rule applies after är: Huset är stort. Husen är stora.","Adjectives ending in -en change -n to -t: medveten → medvetet. In plural the -e- disappears: medvetna, enkla, vackra.","Some adjectives never change: bra, kul, gratis, and all present participles (spännande)."],"rsv":["Adjektivet böjs efter substantivet: ingen ändelse för en-ord, -t för ett-ord, -a för plural.","Samma regel gäller efter är: Huset är stort. Husen är stora.","Adjektiv på -en byter -n mot -t: medvetet. I plural försvinner -e-: medvetna, enkla, vackra.","Vissa adjektiv böjs aldrig: bra, kul, gratis och presens particip."],"tb":{"h":["Typ","En-ord","Ett-ord","Plural"],"r":[["vanlig","en allvarlig sjukdom","ett allvarligt problem","allvarliga fall"],["-en","en medveten person","ett medvetet val","medvetna personer"],["-er","en vacker bukett","ett vackert leende","vackra blommor"],["-el","en enkel fråga","ett enkelt beslut","enkla frågor"],["-d","en röd bil","ett rött hus","röda bilar"]]},"ex":[["Det är en nyttig måltid.","It is a nutritious meal."],["Det var ett medvetet val.","It was a conscious choice."],["Hon har vackra ögon.","She has beautiful eyes."],["Huset är stort.","The house is big."],["Vi är trötta.","We are tired."],["Maten är bra.","The food is good."]],"pit":[["ett nyttig val","ett nyttigt val","Ett-words take -t."],["De är trött.","De är trötta.","Plural subject: -a after är too."],["ett medvetent val","ett medvetet val","-en becomes -et, not -ent."]],"pr":[{"q":"ett ___ val (medveten)","a":"medvetet","e":"","o":["medveten","medvetet","medvetna","medvetent"]},{"q":"en ___ kost (balanserad)","a":"balanserad","e":"","o":["balanserad","balanserat","balanserade"]},{"q":"___ människor (trött)","a":"trötta","e":"","o":["trött","trötta","trötte"]},{"q":"Huset är ___. (stor)","a":"stort","e":"","o":["stor","stort","stora"]},{"q":"ett ___ leende (vacker)","a":"vackert","e":"","o":["vacker","vackert","vackra","vackret"]},{"q":"Skriv rätt form: två ___ frågor (enkel)","a":"enkla","e":""},{"q":"Skriv rätt form: ett ___ hus (röd)","a":"rött","e":""},{"q":"Rätta: Barnen är glad.","a":"Barnen är glada.","e":""}]},{"id":"adjdef","u":1,"ti":"Bestämd form och possessiv","en":"Definite and possessive adjectives","ren":["With den/det/de + adjective + definite noun, the adjective takes -a: den nya vanan, det nya valet, de nya vanorna.","After possessives (min, din, hans, Kims) the adjective takes -a, but the noun stays indefinite: min nya vana, mitt nya val.","Liten is irregular: en liten hund, ett litet hus, den lilla hunden, små hundar, de små hundarna.","Gammal becomes gamla in the weak form: den gamla bilen."],"rsv":["Med den/det/de + adjektiv + bestämt substantiv får adjektivet -a: den nya vanan.","Efter possessiva pronomen får adjektivet -a men substantivet står i obestämd form: min nya vana.","Liten är oregelbundet: den lilla hunden, små hundar.","Gammal blir gamla: den gamla bilen."],"tb":{"h":["Obestämd","Bestämd","Possessiv"],"r":[["en ny vana","den nya vanan","min nya vana"],["ett nytt val","det nya valet","mitt nya val"],["nya vanor","de nya vanorna","mina nya vanor"],["en liten hund","den lilla hunden","min lilla hund"]]},"ex":[["Den nya lägenheten är ljus.","The new flat is bright."],["Det stora huset ligger vid sjön.","The big house is by the lake."],["Mina gamla vänner bor kvar i Göteborg.","My old friends still live in Gothenburg."],["De små barnen sover.","The little children are asleep."],["Kims nya jobb är spännande.","Kim's new job is exciting."]],"pit":[["den ny bilen","den nya bilen","After den/det/de the adjective takes -a."],["min nya bilen","min nya bil","No definite ending on the noun after min."],["den liten hunden","den lilla hunden","Liten → lilla in the definite form."]],"pr":[{"q":"Den ___ vanan är svår. (ny)","a":"nya","e":"","o":["ny","nytt","nya"]},{"q":"Mitt ___ jobb är roligt. (ny)","a":"nya","e":"","o":["nytt","nya","ny"]},{"q":"Välj rätt: min nya ___","a":"lägenhet","e":"","o":["lägenhet","lägenheten","lägenheter"]},{"q":"Den ___ hunden sover. (liten)","a":"lilla","e":"","o":["liten","lilla","små","litet"]},{"q":"De ___ husen ligger här. (stor)","a":"stora","e":"","o":["stor","stort","stora"]},{"q":"Skriv: de ___ hundarna (liten)","a":"små","e":""},{"q":"Skriv: det ___ huset (gammal)","a":"gamla","e":""},{"q":"Rätta: Jag älskar min gamla bilen.","a":"Jag älskar min gamla bil.","e":""}]},{"id":"komp","u":1,"ti":"Komparation","en":"Comparison of adjectives","ren":["Most adjectives add -are and -ast: rolig – roligare – roligast. The definite superlative adds -e: den roligaste.","Some change vowel and add -re/-st: ung – yngre – yngst, stor – större – störst, låg – lägre – lägst.","Irregular: bra – bättre – bäst, dålig – sämre – sämst, gammal – äldre – äldst, liten – mindre – minst, många – fler – flest, mycket – mer – mest.","Long adjectives and words ending in -isk use mer/mest: mer romantisk, mest praktisk.","Compare with än: Hon är äldre än jag."],"rsv":["De flesta adjektiv får -are och -ast: roligare, roligast, den roligaste.","Vissa byter vokal: ung – yngre – yngst, stor – större – störst.","Oregelbundna: bra – bättre – bäst, gammal – äldre – äldst, liten – mindre – minst, många – fler – flest.","Adjektiv på -isk använder mer/mest: mer romantisk.","Jämför med än: Hon är äldre än jag."],"tb":{"h":["Grundform","Komparativ","Superlativ","Bestämd"],"r":[["rolig","roligare","roligast","roligaste"],["vacker","vackrare","vackrast","vackraste"],["ung","yngre","yngst","yngsta"],["stor","större","störst","största"],["bra","bättre","bäst","bästa"],["gammal","äldre","äldst","äldsta"],["liten","mindre","minst","minsta"],["romantisk","mer romantisk","mest romantisk","mest romantiska"]]},"ex":[["Mitt rum är större än ditt.","My room is bigger than yours."],["Hon är yngst i familjen.","She is the youngest in the family."],["Det här är den bästa dagen.","This is the best day."],["Jag mår bättre i dag.","I feel better today."],["Vi behöver mer tid.","We need more time."],["Det kommer färre gäster i år.","Fewer guests are coming this year."]],"pit":[["storare","större","Stor changes vowel."],["den bäst dagen","den bästa dagen","Definite superlative takes -a/-e."],["romantiskare","mer romantisk","-isk adjectives use mer."],["mer gäster","fler gäster","Fler for things you can count, mer for amounts."]],"pr":[{"q":"Mitt rum är ___ än ditt. (stor)","a":"större","e":"","o":["storare","större","störst"]},{"q":"Hon är ___ än jag. (ung)","a":"yngre","e":"","o":["ungare","yngre","yngst"]},{"q":"Jag mår ___ nu. (bra)","a":"bättre","e":"","o":["bra","bättre","bäst"]},{"q":"Det kommer ___ gäster i år. (få)","a":"färre","e":"","o":["mindre","färre","fåare"]},{"q":"Det är den ___ lösningen. (bra)","a":"bästa","e":"","o":["bäst","bästa","bättre"]},{"q":"Resan är ___ än vi trodde. (romantisk)","a":"mer romantisk","e":"","o":["romantiskare","mer romantisk","mest romantisk"]},{"q":"Skriv: Han är min ___ bror. (gammal)","a":"äldsta","e":""},{"q":"Skriv: Vi behöver ___ tid. (mycket, komparativ)","a":"mer","e":"","acc":["mera"]}]},{"id":"trans","u":2,"ti":"Transitiva och intransitiva verb","en":"Lägga/ligga, ställa/stå, sätta/sitta","ren":["A transitive verb has an object: Jag lägger boken på bordet. An intransitive verb has no object: Boken ligger på bordet.","Learn them in pairs: lägga/ligga, ställa/stå, sätta/sitta, bränna/brinna, släcka/slockna, väcka/vakna.","Ask: am I doing something to something (transitive), or is something just in a position or happening (intransitive)?","Reflexive forms describe your own body: Jag sätter mig (I sit down) → Jag sitter (I am sitting)."],"rsv":["Transitiva verb har objekt: Jag lägger boken på bordet. Intransitiva verb har inget objekt: Boken ligger på bordet.","Lär dig paren: lägga/ligga, ställa/stå, sätta/sitta, bränna/brinna, släcka/slockna, väcka/vakna.","Fråga dig: gör jag något med något (transitivt) eller beskriver jag ett läge (intransitivt)?","Jag sätter mig (förändring) → Jag sitter (läge)."],"tb":{"h":["Transitivt (med objekt)","Böjning","Intransitivt","Böjning"],"r":[["lägga","lägger – lade – lagt","ligga","ligger – låg – legat"],["ställa","ställer – ställde – ställt","stå","står – stod – stått"],["sätta","sätter – satte – satt","sitta","sitter – satt – suttit"],["bränna","bränner – brände – bränt","brinna","brinner – brann – brunnit"],["släcka","släcker – släckte – släckt","slockna","slocknar – slocknade – slocknat"],["väcka","väcker – väckte – väckt","vakna","vaknar – vaknade – vaknat"]]},"ex":[["Jag lägger nycklarna på hyllan.","I put the keys on the shelf."],["Nycklarna ligger på hyllan.","The keys are on the shelf."],["Hon ställde glaset på bordet.","She put the glass on the table."],["Glaset står på bordet.","The glass is standing on the table."],["Han satte sig bredvid mig.","He sat down next to me."],["Barnet vaknade klockan sex.","The child woke up at six."]],"pit":[["Boken lägger på bordet.","Boken ligger på bordet.","No object → ligga."],["Han har satt i soffan i en timme.","Han har suttit i soffan i en timme.","Sitta → suttit."],["Jag vaknade barnet.","Jag väckte barnet.","With an object use väcka."]],"pr":[{"q":"Nu ___ jag boken på bordet.","a":"lägger","e":"","o":["lägger","ligger"]},{"q":"Boken har ___ här hela dagen.","a":"legat","e":"","o":["lagt","legat"]},{"q":"Glaset ___ på bordet.","a":"står","e":"","o":["ställer","står"]},{"q":"Han har ___ på stolen länge.","a":"suttit","e":"","o":["satt","suttit"]},{"q":"Ljuset ___ när vi kom in.","a":"brann","e":"","o":["brände","brann"]},{"q":"Hon ___ barnet klockan sju.","a":"väckte","e":"","o":["väckte","vaknade"]},{"q":"Skriv rätt form: Jag har ___ mig på stolen. (sätta)","a":"satt","e":""},{"q":"Skriv rätt form: Ljuset har ___. (slockna)","a":"slocknat","e":""}]},{"id":"part","u":2,"ti":"Partikelverb och reflexiva uttryck","en":"Particle verbs","ren":["Many verbs get a new meaning with a particle: koppla av (relax), koppla bort (switch off), ta upp (bring up), ge upp (give up), hälsa på (visit), tycka om (like).","The particle is stressed when you speak: Vi hälsar PÅ mormor.","The particle stays after the verb in all tenses: Hon ger upp – hon gav upp – hon har gett upp.","Some expressions are reflexive: ta det lugnt, ha roligt, roa sig, njuta av något."],"rsv":["Många verb får ny betydelse med en partikel: koppla av, ta upp, ge upp, hälsa på, tycka om.","Partikeln är betonad: Vi hälsar PÅ mormor.","Partikeln står kvar i alla tempus: ger upp – gav upp – har gett upp.","Lär dig uttrycken som helheter: njuta av, se fram emot, turas om."],"tb":{"h":["Partikelverb","Betydelse","Exempel"],"r":[["koppla av","relax","Jag kopplar av med en bok."],["koppla bort","switch off (mentally)","Det är svårt att koppla bort jobbet."],["hälsa på","visit","Vi hälsar på mormor."],["tycka om","like","Jag tycker om att resa."],["ge upp","give up","Ge inte upp!"],["se fram emot","look forward to","Jag ser fram emot semestern."]]},"ex":[["På helgen kopplar jag av.","At the weekend I relax."],["Vi turas om att laga mat.","We take turns cooking."],["Hon njuter av semestern.","She is enjoying the holiday."],["Jag ser fram emot att träffa dig.","I look forward to seeing you."],["Han gav aldrig upp.","He never gave up."]],"pit":[["Hon njuter från semestern.","Hon njuter av semestern.","Learn njuta av as one unit."],["Vi ser fram emot resa.","Vi ser fram emot att resa.","Preposition + verb needs att."],["Jag tycker om dig. (stressing om)","Jag tycker OM dig.","Stress the particle when speaking."]],"pr":[{"q":"Hon njuter ___ semestern.","a":"av","e":"","o":["från","av","med","på"]},{"q":"Vi ser fram ___ resan.","a":"emot","e":"","o":["till","emot","på"]},{"q":"Koppla av betyder:","a":"relax","e":"","o":["relax","disconnect","connect","switch on"]},{"q":"Preteritum: Hon ___ upp. (ge)","a":"gav","e":"","o":["gav","gade","ge"]},{"q":"Vi ___ om att boka resan. (take turns)","a":"turas","e":"","o":["tur","turas","tar"]},{"q":"Skriv: Jag ser fram emot ___ träffa dig.","a":"att","e":""},{"q":"Skriv perfekt: Han ___ ___ upp. (ge)","a":"har gett","e":"","acc":["har givit"]},{"q":"Översätt: We visit grandma.","a":"Vi hälsar på mormor.","e":"","acc":["Vi hälsar på farmor."]}]},{"id":"vgr","u":3,"ti":"Verbgrupper","en":"Verb groups and principal parts","ren":["Swedish verbs have four main forms: infinitive, present, preterite, supine (used after har/hade).","Group 1: -ar, -ade, -at (träna). Group 2a: -er, -de, -t (ställa). Group 2b: -er, -te, -t after p, t, k, s, x (köpa). Group 3: short verbs -r, -dde, -tt (bo). Group 4: strong verbs change vowel (skriva – skrev – skrivit).","The imperative is the stem: träna!, ställ!, köp!, bo!, skriv!","Learn strong verbs as a chant: gå – gick – gått, se – såg – sett, ta – tog – tagit, sitta – satt – suttit."],"rsv":["Verben har fyra huvudformer: infinitiv, presens, preteritum och supinum.","Grupp 1: -ar, -ade, -at. Grupp 2a: -er, -de, -t. Grupp 2b: -er, -te, -t. Grupp 3: -r, -dde, -tt. Grupp 4: starka verb byter vokal.","Imperativ är verbets stam: träna!, ställ!, köp!","Lär dig de starka verben utantill: gå – gick – gått, se – såg – sett."],"tb":{"h":["Grupp","Infinitiv","Presens","Preteritum","Supinum"],"r":[["1","träna","tränar","tränade","tränat"],["2a","ställa","ställer","ställde","ställt"],["2b","köpa","köper","köpte","köpt"],["3","bo","bor","bodde","bott"],["4","skriva","skriver","skrev","skrivit"],["4","gå","går","gick","gått"],["oregelbundet","vara","är","var","varit"]]},"ex":[["Jag tränar varje dag.","I exercise every day."],["I går köpte jag en jacka.","Yesterday I bought a jacket."],["Vi har bott här i två år.","We have lived here for two years."],["Hon skrev ett brev.","She wrote a letter."],["Köp mjölk på vägen hem!","Buy milk on the way home!"]],"pit":[["Jag har gick hem.","Jag har gått hem.","After har use the supine."],["köpde","köpte","Group 2b after p, t, k, s takes -te."],["skrivade","skrev","Strong verbs change vowel."]],"pr":[{"q":"Preteritum av köpa:","a":"köpte","e":"","o":["köpde","köpte","köpade"]},{"q":"Supinum av gå:","a":"gått","e":"","o":["gick","gått","gåt"]},{"q":"Preteritum av bo:","a":"bodde","e":"","o":["bodde","bode","boade"]},{"q":"Vilken grupp är träna?","a":"1","e":"","o":["1","2a","2b","4"]},{"q":"Supinum av skriva:","a":"skrivit","e":"","o":["skrivit","skrivt","skrev"]},{"q":"Skriv preteritum: ställa","a":"ställde","e":""},{"q":"Skriv imperativ: köpa","a":"köp","e":""},{"q":"Rätta: Jag har gick hem.","a":"Jag har gått hem.","e":""}]},{"id":"modal","u":3,"ti":"Modala hjälpverb och att","en":"Modal verbs and infinitive with att","ren":["Modal verbs (kan, vill, ska, måste, bör, får, brukar) are followed by the infinitive without att: Jag vill träna.","Other verbs and expressions need att + infinitive: Jag tycker om att träna. Det är viktigt att vila. Jag försöker att… (att is optional after försöka, börja, sluta).","After a preposition you always need att: Jag ser fram emot att resa.","Skulle vilja is a polite way to say what you want: Jag skulle vilja ha ett extra rum."],"rsv":["Modala hjälpverb (kan, vill, ska, måste, bör, får, brukar) följs av infinitiv utan att: Jag vill träna.","Andra verb och uttryck behöver att: Jag tycker om att träna. Det är viktigt att vila.","Efter preposition behövs alltid att: Jag ser fram emot att resa.","Skulle vilja är artigt: Jag skulle vilja ha ett extra rum."],"tb":{"h":["Utan att","Med att"],"r":[["Jag vill resa.","Jag tycker om att resa."],["Du bör vila.","Det är viktigt att vila."],["Vi måste spara.","Vi har bestämt oss för att spara."],["Hon brukar promenera.","Hon älskar att promenera."]]},"ex":[["Jag kan inte komma i dag.","I cannot come today."],["Du bör ta det lugnt.","You should take it easy."],["Vi brukar äta middag klockan sex.","We usually eat dinner at six."],["Det är svårt att lära sig ett nytt språk.","It is hard to learn a new language."],["Jag skulle vilja boka ett bord.","I would like to book a table."]],"pit":[["Jag vill att träna.","Jag vill träna.","No att after modal verbs."],["Jag tycker om träna.","Jag tycker om att träna.","Tycka om needs att."],["Vi kan sparar pengar.","Vi kan spara pengar.","Modal + infinitive, not present."]],"pr":[{"q":"Jag vill ___ i dag.","a":"träna","e":"","o":["att träna","träna","tränar"]},{"q":"Jag tycker om ___.","a":"att läsa","e":"","o":["läsa","att läsa","läser"]},{"q":"Det är viktigt ___ vila.","a":"att","e":"","o":["att","–","för"]},{"q":"Du måste ___ läxan.","a":"göra","e":"","o":["göra","att göra","gör"]},{"q":"Vi ser fram emot ___ er.","a":"att träffa","e":"","o":["träffa","att träffa","träffar"]},{"q":"Skriv rätt: Hon brukar ___ (promenera) efter jobbet.","a":"promenera","e":""},{"q":"Rätta: Jag kan att simma.","a":"Jag kan simma.","e":""},{"q":"Översätt artigt: I would like a coffee.","a":"Jag skulle vilja ha en kaffe.","e":"","acc":["Jag skulle vilja ha kaffe."]}]},{"id":"ordf","u":3,"ti":"Ordföljd i huvudsats","en":"Main clause word order (V2 and inversion)","ren":["In a main clause the finite verb is always in second place.","If something other than the subject comes first (a time, place, or därför), the subject moves after the verb: I dag tränar jag.","Inte comes after the finite verb in a main clause: Jag tränar inte. I dag tränar jag inte.","In questions the verb comes first (Bor du här?) or after the question word (Var bor du?)."],"rsv":["I en huvudsats står det finita verbet alltid på plats två.","Om något annat än subjektet står först byter subjektet plats med verbet: I dag tränar jag.","Inte står efter det finita verbet i huvudsats: Jag tränar inte.","I frågor står verbet först eller efter frågeordet: Var bor du?"],"tb":{"h":["Plats 1","Verb","Subjekt","Inte/adverb","Resten"],"r":[["Jag","tränar","","inte","i dag."],["I dag","tränar","jag","inte",""],["Därför","kan","jag","inte","komma."],["Var","bor","du","","nu?"],["","Bor","du","","här?"]]},"ex":[["I morgon reser vi till Malmö.","Tomorrow we travel to Malmö."],["På helgerna brukar jag vila.","At weekends I usually rest."],["Därför bor vi i en villa.","That is why we live in a house."],["Nu förstår jag.","Now I understand."],["Varför kommer du inte?","Why are you not coming?"]],"pit":[["I dag jag tränar.","I dag tränar jag.","Verb in second place."],["Därför jag kan inte komma.","Därför kan jag inte komma.","Därför starts a main clause."],["Jag inte tränar.","Jag tränar inte.","Inte after the finite verb."]],"pr":[{"q":"Välj rätt: I dag ___","a":"tränar jag","e":"","o":["jag tränar","tränar jag"]},{"q":"Välj rätt: Därför ___ komma.","a":"kan jag inte","e":"","o":["jag kan inte","kan jag inte","jag inte kan"]},{"q":"Välj rätt fråga:","a":"Var bor du?","e":"","o":["Var du bor?","Var bor du?","Du bor var?"]},{"q":"Välj rätt: Jag ___ i dag.","a":"tränar inte","e":"","o":["inte tränar","tränar inte"]},{"q":"Börja med I morgon: Jag reser till Malmö i morgon.","a":"I morgon reser jag till Malmö.","e":""},{"q":"Börja med Ofta: Vi äter pizza ofta.","a":"Ofta äter vi pizza.","e":""},{"q":"Rätta: På kvällen jag läser.","a":"På kvällen läser jag.","e":""},{"q":"Gör en fråga: du / bor / här","a":"Bor du här?","e":""}]},{"id":"bisats","u":3,"ti":"Bisats och BIFF-regeln","en":"Subordinate clauses","ren":["A subordinate clause starts with a word like att, eftersom, om, när, som, därför att, trots att, innan.","In a subordinate clause the subject comes first and inte comes BEFORE the finite verb: BIFF – Bisats Inte Före Finit.","…att han inte tränar. …eftersom jag inte har råd.","If the sentence starts with the subordinate clause, the main clause starts with the verb: Om jag är ledig, reser jag."],"rsv":["En bisats börjar med till exempel att, eftersom, om, när, som, trots att, innan.","I bisatsen står inte före det finita verbet: BIFF – Bisats Inte Före Finit.","…att han inte tränar. …eftersom jag inte har råd.","Börjar meningen med bisatsen kommer verbet först i huvudsatsen: Om jag är ledig, reser jag."],"tb":{"h":["Huvudsats","Bisats"],"r":[["Han tränar inte.","Jag vet att han inte tränar."],["Jag har inte råd.","…eftersom jag inte har råd."],["Hon kommer inte.","Jag tror att hon inte kommer."],["Jag är ledig. Jag reser.","Om jag är ledig, reser jag."]]},"ex":[["Jag stannar hemma eftersom jag är sjuk.","I stay at home because I am ill."],["Han säger att han inte kan komma.","He says that he cannot come."],["När jag kom hem, sov barnen.","When I came home the children were asleep."],["Jag hoppas att du mår bra.","I hope that you are well."],["Om det regnar, stannar vi inne.","If it rains we stay in."]],"pit":[["…att han tränar inte.","…att han inte tränar.","BIFF: inte before the verb."],["Om jag är ledig, jag reser.","Om jag är ledig, reser jag.","Main clause after a subordinate clause starts with the verb."],["…eftersom jag har inte tid.","…eftersom jag inte har tid.","BIFF."]],"pr":[{"q":"Jag vet att han ___.","a":"inte tränar","e":"","o":["tränar inte","inte tränar"]},{"q":"Vi stannar hemma eftersom vi ___.","a":"inte har tid","e":"","o":["har inte tid","inte har tid"]},{"q":"Om det regnar, ___ inne.","a":"stannar vi","e":"","o":["vi stannar","stannar vi"]},{"q":"Välj bisatsordet för orsak:","a":"eftersom","e":"","o":["eftersom","därför","men","och"]},{"q":"Börja med Jag vet att: Hon kommer inte.","a":"Jag vet att hon inte kommer.","e":""},{"q":"Sätt ihop med eftersom: Jag vilar. Jag är trött.","a":"Jag vilar eftersom jag är trött.","e":""},{"q":"Börja med Om: Jag är ledig. Jag reser.","a":"Om jag är ledig, reser jag.","e":"","acc":["Om jag är ledig reser jag."]},{"q":"Rätta: …eftersom hon vill inte ge upp.","a":"eftersom hon inte vill ge upp.","e":""}]},{"id":"bind","u":3,"ti":"Bindeord","en":"Linking words","ren":["Linking words show how ideas connect: reason (eftersom, för att), result (därför, så), contrast (men, däremot, trots att), addition (och, dessutom), purpose (för att + infinitive).","Därför starts a main clause, so the verb comes next: Därför går jag.","Eftersom and trots att start subordinate clauses, so BIFF applies: …trots att det inte är nära.","Men and och do not change word order: Jag vill resa, men hon vill stanna."],"rsv":["Bindeord visar hur tankar hänger ihop: orsak (eftersom), följd (därför, så), motsats (men, däremot, trots att), tillägg (dessutom), syfte (för att).","Därför inleder en huvudsats: Därför går jag.","Eftersom och trots att inleder bisatser: BIFF gäller.","Men och och ändrar inte ordföljden."],"tb":{"h":["Funktion","Ord","Exempel"],"r":[["orsak","eftersom","Jag går eftersom det är nära."],["följd","därför","Det är nära. Därför går jag."],["motsats","men / däremot","Jag vill resa, men hon vill stanna."],["trots","trots att","Hon går ut trots att det regnar."],["tillägg","dessutom","Dessutom är det billigare."],["syfte","för att","Jag vilar för att orka."]]},"ex":[["Jag sparar pengar eftersom jag vill resa.","I save money because I want to travel."],["Bussen var sen. Därför kom jag för sent.","The bus was late. So I was late."],["Hon är trött, men hon tränar ändå.","She is tired but trains anyway."],["Vi cyklar för att spara pengar.","We cycle to save money."],["Han kom trots att han var sjuk.","He came although he was ill."]],"pit":[["Därför jag går.","Därför går jag.","Verb second after därför."],["för att jag vill spara (meaning purpose with a verb)","för att spara","Purpose: för att + infinitive."],["trots att det regnar inte","trots att det inte regnar","BIFF."]],"pr":[{"q":"Jag stannar hemma ___ jag är sjuk. (because)","a":"eftersom","e":"","o":["eftersom","därför","men","dessutom"]},{"q":"Det regnar. ___ tar jag bussen. (therefore)","a":"Därför","e":"","o":["Eftersom","Därför","Trots att"]},{"q":"Hon går ut ___ det regnar. (although)","a":"trots att","e":"","o":["därför","trots att","eftersom"]},{"q":"Vi cyklar ___ spara pengar. (in order to)","a":"för att","e":"","o":["för att","därför","eftersom"]},{"q":"Välj rätt: Därför ___","a":"går jag","e":"","o":["jag går","går jag"]},{"q":"Skriv med därför: Det är nära. Jag går.","a":"Det är nära. Därför går jag.","e":""},{"q":"Skriv med eftersom: Jag går. Det är nära.","a":"Jag går eftersom det är nära.","e":""},{"q":"Fyll i: Jag vill resa, ___ hon vill stanna. (but)","a":"men","e":""}]},{"id":"som","u":3,"ti":"Relativa bisatser med som","en":"Relative clauses with som","ren":["Som joins information about a person or thing: Jag har en granne som spelar piano.","Som works for people and things, en-words, ett-words and plural.","BIFF applies: en granne som inte hälsar.","Som can be left out when it is the object: Boken (som) jag läser är bra."],"rsv":["Som binder ihop information om en person eller sak: Jag har en granne som spelar piano.","Som fungerar för personer och saker, en-ord, ett-ord och plural.","BIFF gäller: en granne som inte hälsar.","Som kan strykas när det är objekt: Boken (som) jag läser är bra."],"tb":{"h":["Två meningar","Med som"],"r":[["Jag har en granne. Hon spelar piano.","Jag har en granne som spelar piano."],["Vi bor i ett hus. Det är gammalt.","Vi bor i ett hus som är gammalt."],["Jag läser en bok. Den är spännande.","Boken som jag läser är spännande."]]},"ex":[["Läraren som undervisar oss är bra.","The teacher who teaches us is good."],["Det är ett område som är lugnt.","It is an area that is quiet."],["Vi har grannar som inte hälsar.","We have neighbours who do not say hello."],["Filmen (som) vi såg var lång.","The film (that) we saw was long."]],"pit":[["en granne vem spelar piano","en granne som spelar piano","Use som, not vem."],["en granne som hälsar inte","en granne som inte hälsar","BIFF in a som-clause."]],"pr":[{"q":"Jag har en granne ___ spelar piano.","a":"som","e":"","o":["som","vem","vad","vilken"]},{"q":"Vi har grannar som ___.","a":"inte hälsar","e":"","o":["hälsar inte","inte hälsar"]},{"q":"Kan som strykas i: Boken som jag läser är bra.","a":"ja","e":"","o":["ja","nej"]},{"q":"Kan som strykas i: Mannen som bor här är lärare.","a":"nej","e":"Som är subjekt i bisatsen och kan inte strykas.","o":["ja","nej"]},{"q":"Sätt ihop med som: Vi bor i ett hus. Det är gammalt.","a":"Vi bor i ett hus som är gammalt.","e":""},{"q":"Sätt ihop med som: Jag har en vän. Han bor i Malmö.","a":"Jag har en vän som bor i Malmö.","e":""},{"q":"Rätta: Kvinnan vem bor här är trevlig.","a":"Kvinnan som bor här är trevlig.","e":""}]},{"id":"indfr","u":3,"ti":"Indirekta frågor och anföring","en":"Embedded questions and reported speech","ren":["A question inside a sentence uses subordinate clause order: Var bor du? → Jag undrar var du bor.","Yes/no questions become om: Kommer du? → Han frågar om du kommer.","BIFF applies: Jag undrar varför han inte kommer.","In reported speech in the past, move the tense back: Hon sa: \"Jag är trött.\" → Hon sa att hon var trött."],"rsv":["En fråga inuti en mening får bisatsordföljd: Jag undrar var du bor.","Ja/nej-frågor blir om: Han frågar om du kommer.","BIFF gäller: Jag undrar varför han inte kommer.","I återberättad dåtid flyttas tempus bakåt: Hon sa att hon var trött."],"tb":{"h":["Direkt fråga","Indirekt fråga"],"r":[["Var bor du?","Jag undrar var du bor."],["Kommer du?","Han frågar om du kommer."],["Varför kommer han inte?","Jag undrar varför han inte kommer."],["När börjar kursen?","Vet du när kursen börjar?"]]},"ex":[["Kan du säga var stationen ligger?","Can you tell me where the station is?"],["Jag vet inte om hon har tid.","I do not know if she has time."],["Han frågade vad jag hette.","He asked what my name was."],["Hon sa att hon skulle komma.","She said that she would come."]],"pit":[["Jag undrar var bor du.","Jag undrar var du bor.","Subject before verb in an embedded question."],["Han frågar kommer du.","Han frågar om du kommer.","Yes/no questions become om."]],"pr":[{"q":"Jag undrar var ___.","a":"du bor","e":"","o":["bor du","du bor"]},{"q":"Han frågar ___ du kommer.","a":"om","e":"","o":["om","att","vad"]},{"q":"Jag undrar varför han ___.","a":"inte kommer","e":"","o":["kommer inte","inte kommer"]},{"q":"Vet du när kursen ___?","a":"börjar","e":"","o":["börjar","den börjar"]},{"q":"Gör indirekt: När börjar filmen? → Vet du…","a":"Vet du när filmen börjar?","e":""},{"q":"Gör indirekt: Har du tid? → Hon undrar…","a":"Hon undrar om du har tid.","e":""},{"q":"Återberätta i dåtid: Han sa: \"Jag är sjuk.\"","a":"Han sa att han var sjuk.","e":""}]},{"id":"tid","u":3,"ti":"Tidsuttryck","en":"Time expressions","ren":["i går, i dag, i morgon: a specific day. förra veckan, nästa vecka: relative time.","i två timmar: duration (for two hours). för två timmar sedan: ago. om två timmar: in two hours (future).","på måndag: this coming Monday. på måndagar: every Monday. i måndags: last Monday.","sedan 2020: since. två gånger i veckan: frequency."],"rsv":["i går, i dag, i morgon: bestämd dag. förra veckan, nästa vecka: relativ tid.","i två timmar: hur länge. för två timmar sedan: bakåt. om två timmar: framåt.","på måndag: kommande måndag. på måndagar: varje måndag. i måndags: förra måndagen.","sedan 2020: sedan. två gånger i veckan: hur ofta."],"tb":{"h":["Uttryck","Betydelse"],"r":[["i två timmar","for two hours"],["för två timmar sedan","two hours ago"],["om två timmar","in two hours"],["på måndag","on (this) Monday"],["på måndagar","on Mondays"],["i måndags","last Monday"],["sedan 2020","since 2020"],["två gånger i veckan","twice a week"]]},"ex":[["Jag har bott här i fem år.","I have lived here for five years."],["Vi flyttade hit för två år sedan.","We moved here two years ago."],["Bussen går om tio minuter.","The bus leaves in ten minutes."],["Jag tränar tre gånger i veckan.","I train three times a week."],["Vi ses på fredag.","See you on Friday."]],"pit":[["Jag flyttade hit sedan två år.","Jag flyttade hit för två år sedan.","Ago = för … sedan."],["Jag har bott här för fem år.","Jag har bott här i fem år.","Duration = i."],["på måndag (meaning every Monday)","på måndagar","Plural = every."]],"pr":[{"q":"Jag flyttade hit ___ två år sedan.","a":"för","e":"","o":["för","i","om","på"]},{"q":"Jag har bott här ___ fem år.","a":"i","e":"","o":["i","för","om","sedan"]},{"q":"Bussen går ___ tio minuter.","a":"om","e":"","o":["i","om","för","på"]},{"q":"Jag tränar på ___. (every Monday)","a":"måndagar","e":"","o":["måndag","måndagar","måndags"]},{"q":"Jag har bott här ___ 2020.","a":"sedan","e":"","o":["sedan","i","från","för"]},{"q":"Översätt: three times a week","a":"tre gånger i veckan","e":""},{"q":"Översätt: last Monday","a":"i måndags","e":""}]},{"id":"refl","u":4,"ti":"Reflexiva verb","en":"Reflexive verbs","ren":["A reflexive verb points back to the subject: Jag tvättar mig. The pronoun changes with the subject.","jag → mig, du → dig, han/hon/den/det/de → sig, vi → oss, ni → er.","Some verbs are always reflexive: gifta sig, bestämma sig, koncentrera sig, anpassa sig, bry sig, ångra sig, försova sig, anstränga sig.","Compare: Hon tvättar sig (herself) – Hon tvättar henne (another woman)."],"rsv":["Reflexiva verb pekar tillbaka på subjektet: Jag tvättar mig.","jag → mig, du → dig, han/hon/den/det/de → sig, vi → oss, ni → er.","Alltid reflexiva: gifta sig, bestämma sig, koncentrera sig, anpassa sig, bry sig, ångra sig, försova sig.","Hon tvättar sig (sig själv) – Hon tvättar henne (en annan person)."],"tb":{"h":["Subjekt","Reflexiv","Objekt","Exempel"],"r":[["jag","mig","mig","Jag koncentrerar mig."],["du","dig","dig","Du anstränger dig."],["han","sig","honom","Han tvättar sig."],["hon","sig","henne","Hon gifte sig i fjol."],["vi","oss","oss","Vi bestämde oss."],["ni","er","er","Sätt er här!"],["de","sig","dem","De har anmält sig."]]},"ex":[["Jag försov mig i morse.","I overslept this morning."],["Vi har bestämt oss för att studera.","We have decided to study."],["Du måste koncentrera dig.","You must concentrate."],["De anpassade sig snabbt.","They adapted quickly."],["Hon lär sig svenska.","She is learning Swedish."]],"pit":[["De har anmält dem.","De har anmält sig.","Same people as the subject → sig."],["Vi koncentrerar sig.","Vi koncentrerar oss.","vi → oss."],["Jag lär svenska.","Jag lär mig svenska.","Lära sig = learn."]],"pr":[{"q":"Jag koncentrerar ___.","a":"mig","e":"","o":["mig","sig","dig"]},{"q":"Vi måste anstränga ___.","a":"oss","e":"","o":["sig","oss","er"]},{"q":"De har bestämt ___.","a":"sig","e":"","o":["dem","sig","oss"]},{"q":"Ni ska sätta ___ här.","a":"er","e":"","o":["er","sig","oss"]},{"q":"Han tvättar ___ (himself).","a":"sig","e":"","o":["honom","sig"]},{"q":"Skriv preteritum: Jag försover mig.","a":"Jag försov mig.","e":""},{"q":"Skriv perfekt: Hon lär sig svenska.","a":"Hon har lärt sig svenska.","e":""},{"q":"Översätt: We have decided to study.","a":"Vi har bestämt oss för att studera.","e":""}]},{"id":"sin","u":4,"ti":"Sin, sitt, sina eller hans, hennes","en":"Reflexive possessives","ren":["Use sin/sitt/sina when the owner is the subject of the same clause: Flora beskriver sin utbildning (her own).","Use hans/hennes/deras when the owner is someone else or is the subject itself: Hennes utbildning var lång.","Sin follows the gender of the thing owned: sin bil, sitt hus, sina barn.","Never use sin in the subject: Hans fru (not Sin fru) arbetar."],"rsv":["Använd sin/sitt/sina när ägaren är subjektet i samma sats: Flora beskriver sin utbildning.","Använd hans/hennes/deras när ägaren är någon annan eller när ordet är subjekt.","Sin böjs efter det ägda: sin bil, sitt hus, sina barn.","Sin står aldrig i subjektet: Hans fru arbetar."],"tb":{"h":["Mening","Betydelse"],"r":[["Erik ringer sin bror.","Erik calls his own brother."],["Erik ringer hans bror.","Erik calls another man's brother."],["Hon säljer sitt hus.","She sells her own house."],["De besöker sina föräldrar.","They visit their own parents."]]},"ex":[["Flora älskar sitt arbete.","Flora loves her job."],["Peter tackar sina lärare.","Peter thanks his teachers."],["Hennes lärare var duktig.","Her teacher was skilled."],["Han hämtar sina barn.","He picks up his children."]],"pit":[["Sin bror bor i Malmö.","Hans bror bor i Malmö.","Never sin in the subject."],["Hon säljer sin hus.","Hon säljer sitt hus.","Ett hus → sitt."]],"pr":[{"q":"Flora beskriver ___ egen utbildning.","a":"sin","e":"","o":["sin","hennes","sitt"]},{"q":"Hon säljer ___ hus.","a":"sitt","e":"","o":["sin","sitt","sina"]},{"q":"De besöker ___ föräldrar.","a":"sina","e":"","o":["sin","deras","sina"]},{"q":"___ bror bor i Malmö. (Eriks)","a":"Hans","e":"","o":["Sin","Hans"]},{"q":"Peter tackar ___ lärare. (his own, plural)","a":"sina","e":"","o":["hans","sina","sin"]},{"q":"Rätta: Sin fru arbetar på en skola.","a":"Hans fru arbetar på en skola.","e":"","acc":["Hennes fru arbetar på en skola."]}]},{"id":"prep","u":5,"ti":"Prepositioner","en":"Prepositions of place, time and av","ren":["Place: innanför (inside), utanför (outside), ovanför (above), nedanför (below), framför (in front of), bakom (behind), bredvid (next to), mellan (between), bland (among).","Time: inför (before / in preparation for), inom (within), sedan (since), vid (around a time: vid sjutiden), om (in, future).","Av has many jobs: from a person (låna av), cause (gråta av glädje), material (av guld), one of a group (en av oss), and the doer in passive (målad av Picasso).","Utom = except: Alla utom jag."],"rsv":["Plats: innanför, utanför, ovanför, nedanför, framför, bakom, bredvid, mellan, bland.","Tid: inför, inom, sedan, vid sjutiden, om.","Av: från en person (låna av), orsak (gråta av glädje), material (av guld), urval (en av oss), passiv (målad av Picasso).","Utom = förutom: Alla utom jag."],"tb":{"h":["Preposition","Exempel","English"],"r":[["utanför","Taxin står utanför huset.","outside"],["ovanför","Grannarna ovanför oss är trevliga.","above"],["inför","Vi planerar inför resan.","in preparation for"],["inom","Jag ringer inom tio minuter.","within"],["utom","Alla kom utom jag.","except"],["bland","Han är yngst bland syskonen.","among"],["vid","Vi ses vid sjutiden.","around (time)"],["av","Ringen är gjord av guld.","made of"]]},"ex":[["Jag lånade pengar av min syster.","I borrowed money from my sister."],["Hon grät av glädje.","She cried with joy."],["Vi sparar inför semestern.","We save ahead of the holiday."],["Familjen samlas kring bordet.","The family gathers around the table."],["Svara inom en vecka.","Reply within a week."]],"pit":[["låna pengar från min syster (from a person)","låna pengar av min syster","Låna av someone."],["ett halsband från silver","ett halsband av silver","Material = av."],["innan resan","inför resan","Inför before a noun, innan before a clause."]],"pr":[{"q":"Bilen står ___ huset. (outside)","a":"utanför","e":"","o":["utanför","innanför","ovanför"]},{"q":"Jag övar ___ intervjun. (in preparation for)","a":"inför","e":"","o":["innan","inför","före"]},{"q":"Alla kom ___ Erik. (except)","a":"utom","e":"","o":["utan","utom","ute"]},{"q":"Hon gråter ___ glädje.","a":"av","e":"","o":["av","från","med"]},{"q":"Ett halsband ___ silver.","a":"av","e":"","o":["från","av","med"]},{"q":"Svara ___ tio minuter. (within)","a":"inom","e":"","o":["inom","innan","om"]},{"q":"Skriv: Han är yngst ___ syskonen. (among)","a":"bland","e":""},{"q":"Skriv: Vi ses ___ sjutiden. (around)","a":"vid","e":""}]},{"id":"pass","u":6,"ti":"Passiv form","en":"The passive","ren":["The passive puts the focus on what happens, not who does it: Kläderna tvättas.","Form it by adding -s: tvättar → tvättas, tvättade → tvättades, har tvättat → har tvättats. In the present the -r disappears (and often -e-): stänger → stängs, läser → läses.","The doer can be added with av: Cupen vanns av vårt lag.","You can also use bli + perfect participle: Maten blev lagad.","Not every -s verb is passive: hoppas, trivas, lyckas, minnas are deponent verbs with active meaning."],"rsv":["Passiv sätter fokus på det som händer: Kläderna tvättas.","Lägg till -s: tvättas, tvättades, har tvättats. I presens försvinner -r: stängs, läses.","Den som gör något kan läggas till med av: Cupen vanns av vårt lag.","Man kan också använda bli + perfekt particip: Maten blev lagad.","Alla s-verb är inte passiva: hoppas, trivas, lyckas, minnas."],"tb":{"h":["Grupp","Infinitiv","Presens","Preteritum","Supinum"],"r":[["1","tvättas","tvättas","tvättades","tvättats"],["2a","stängas","stängs","stängdes","stängts"],["2b","läsas","läses","lästes","lästs"],["3","nås","nås","nåddes","nåtts"],["4","vinnas","vinns","vanns","vunnits"],["4","ätas","äts","åts","ätits"]]},"ex":[["Butiken stängs klockan åtta.","The shop closes at eight."],["Bilen tvättades i går.","The car was washed yesterday."],["Brevet ska läsas av alla.","The letter is to be read by everyone."],["Dörren har inte stängts.","The door has not been closed."],["Plast kan återvinnas.","Plastic can be recycled."]],"pit":[["Butiken stängers.","Butiken stängs.","Drop -er before -s."],["Maten blev lagades.","Maten blev lagad.","Bli + participle, not double passive."],["Jag hoppas (thinking it is passive)","Hoppas means hope, active.","Deponent verbs."]],"pr":[{"q":"Passiv presens av stänga:","a":"stängs","e":"","o":["stängas","stängs","stängers"]},{"q":"Passiv preteritum av tvätta:","a":"tvättades","e":"","o":["tvättades","tvättas","tvättats"]},{"q":"Passiv presens av läsa:","a":"läses","e":"","o":["läsas","läses","läss"]},{"q":"Är lyckas passivt i \"Hon lyckas\"?","a":"nej","e":"Lyckas är deponens.","o":["ja","nej"]},{"q":"Välj: Maten blev ___.","a":"lagad","e":"","o":["lagades","lagad","lagat"]},{"q":"Gör passiv: Han tvättade bilen i går.","a":"Bilen tvättades i går.","e":""},{"q":"Gör passiv: Någon ska läsa brevet.","a":"Brevet ska läsas.","e":""},{"q":"Gör passiv med agent: Vårt lag vann cupen.","a":"Cupen vanns av vårt lag.","e":""}]},{"id":"pp","u":7,"ti":"Perfekt particip","en":"Past participles","ren":["The past participle is an adjective made from a verb: en målad vägg, ett målat hus, målade väggar.","It is formed from the supine and agrees like an adjective (en, ett, plural/definite).","Group 1: målad – målat – målade. Group 2a: stängd – stängt – stängda. Group 2b: läst – läst – lästa. Group 3: klädd – klätt – klädda. Group 4: skriven – skrivet – skrivna.","Use it after vara and bli: Dörren är stängd (state). Dörren blev stängd (event).","Do not mix it up with the supine after har: Hon har skrivit (supine) – Brevet är skrivet (participle)."],"rsv":["Perfekt particip är ett adjektiv som bildas av ett verb: en målad vägg, ett målat hus, målade väggar.","Det bildas av supinum och böjs som ett adjektiv.","Grupp 1: målad – målat – målade. 2a: stängd – stängt – stängda. 2b: läst – läst – lästa. 3: klädd – klätt – klädda. 4: skriven – skrivet – skrivna.","Används efter vara och bli: Dörren är stängd. Dörren blev stängd.","Blanda inte ihop med supinum: Hon har skrivit – Brevet är skrivet."],"tb":{"h":["Grupp","En-ord","Ett-ord","Plural / bestämd"],"r":[["1 måla","målad","målat","målade"],["2a stänga","stängd","stängt","stängda"],["2b läsa","läst","läst","lästa"],["3 klä","klädd","klätt","klädda"],["4 skriva","skriven","skrivet","skrivna"],["4 erbjuda","erbjuden","erbjudet","erbjudna"]]},"ex":[["Lägenheten är renoverad.","The flat is renovated."],["Fönstret är stängt.","The window is closed."],["Breven är skrivna.","The letters are written."],["Hon blev anställd i maj.","She was hired in May."],["Det stängda fönstret.","The closed window."]],"pit":[["Brevet är skrivit.","Brevet är skrivet.","After är use the participle, not the supine."],["Hon har skrivet ett brev.","Hon har skrivit ett brev.","After har use the supine."],["Barnen blev klätt.","Barnen blev klädda.","Plural agreement."]],"pr":[{"q":"en ___ dörr (stänga)","a":"stängd","e":"","o":["stängd","stängt","stängda"]},{"q":"ett ___ fönster (stänga)","a":"stängt","e":"","o":["stängd","stängt","stängda"]},{"q":"Brevet är ___. (skriva)","a":"skrivet","e":"","o":["skrivit","skrivet","skriven"]},{"q":"Hon har ___ ett brev. (skriva)","a":"skrivit","e":"","o":["skrivit","skrivet"]},{"q":"två ___ böcker (läsa)","a":"lästa","e":"","o":["läst","lästa","läste"]},{"q":"Skriv: en ___ vägg (måla)","a":"målad","e":""},{"q":"Skriv: Barnen blev ___. (klä)","a":"klädda","e":""},{"q":"Skriv med bli: Maten lagades i går.","a":"Maten blev lagad i går.","e":""}]},{"id":"prp","u":9,"ti":"Presens particip","en":"Present participles","ren":["The present participle is formed from the infinitive: -a verbs add -nde (skratta → skrattande), other verbs add -ende (le → leende, gå → gående).","It never changes: en krävande kurs, ett krävande arbete, krävande uppgifter.","Uses: before a noun (ett leende barn), after vara/bli (Filmen var spännande), after verbs of movement (Hon kom springande), and as a noun for people (en studerande, två sökande).","Swedish does not use it for ongoing actions: I am reading = Jag läser."],"rsv":["Presens particip bildas av infinitiven: -nde efter -a (skrattande), -ende annars (leende, gående).","Det böjs aldrig: en krävande kurs, ett krävande arbete, krävande uppgifter.","Används framför substantiv, efter vara/bli, efter rörelseverb (Hon kom springande) och som substantiv (en studerande, två sökande).","Inte för pågående handling: Jag läser, inte \"jag är läsande\"."],"tb":{"h":["Infinitiv","Presens particip","Exempel"],"r":[["skratta","skrattande","ett skrattande barn"],["kräva","krävande","ett krävande jobb"],["spänna","spännande","en spännande film"],["le","leende","ett leende"],["bero","beroende","beroende av vädret"],["gå","gående","en gående man"],["söka","sökande","två sökande"],["studera","studerande","en studerande"]]},"ex":[["Hon kom springande.","She came running."],["Det är ett krävande arbete.","It is demanding work."],["Filmen var spännande.","The film was exciting."],["Alla sökande fick svar.","All applicants got a reply."],["Följande ord är viktiga.","The following words are important."]],"pit":[["ett krävandet arbete","ett krävande arbete","Never add -t."],["Jag är läsande.","Jag läser.","Use the present tense."],["två sökanden","två sökande","No plural ending."]],"pr":[{"q":"Bilda presens particip av skratta:","a":"skrattande","e":"","o":["skrattande","skrattende","skrattad"]},{"q":"Bilda presens particip av le:","a":"leende","e":"","o":["lende","leende","leande"]},{"q":"Det var en ___ film. (spänna)","a":"spännande","e":"","o":["spännad","spännande","spänd"]},{"q":"Barnet kom ___. (springa)","a":"springande","e":"","o":["springande","springer","sprang"]},{"q":"Två ___ väntar. (söka)","a":"sökande","e":"","o":["sökanden","sökande","sökare"]},{"q":"Skriv: ett ___ arbete (kräva)","a":"krävande","e":""},{"q":"Skriv: Svara på ___ frågor. (följa)","a":"följande","e":""},{"q":"Rätta: Jag är läsande en bok.","a":"Jag läser en bok.","e":""}]},{"id":"temp","u":10,"ti":"Tempus","en":"Tenses: now and then","ren":["Present system (from now): perfekt har + supinum (before now), presens (now), futurum ska / kommer att / tänker + infinitive (after now).","Past system (from a past moment): pluskvamperfekt hade + supinum (before then), preteritum (then), futurum preteritum skulle + infinitive (after then).","Use preteritum with a finished time (i går, förra året, 2019). Use perfekt when there is no time or it is still true (har bott här sedan 2019).","When you retell in the past, shift every verb: bor → bodde, har bott → hade bott, ska → skulle."],"rsv":["Nutid: perfekt har + supinum (före nu), presens (nu), futurum ska / kommer att + infinitiv (efter nu).","Dåtid: pluskvamperfekt hade + supinum (före då), preteritum (då), futurum preteritum skulle + infinitiv (efter då).","Preteritum med avslutad tid (i går, förra året). Perfekt utan tid eller när det gäller nu (sedan 2019).","Återberättar du i dåtid flyttar alla verb: bor → bodde, har bott → hade bott, ska → skulle."],"tb":{"h":["","Före","Nu / då","Efter"],"r":[["Nutid","har bott","bor","ska bo"],["Dåtid","hade bott","bodde","skulle bo"]]},"ex":[["Jag har bott i Sverige sedan 2019.","I have lived in Sweden since 2019."],["I går åt vi hos mina föräldrar.","Yesterday we ate at my parents."],["Vi ska flytta i vår.","We are going to move in the spring."],["När jag kom hem hade barnen redan ätit.","When I came home the children had already eaten."],["Han sa att han skulle ringa.","He said that he would call."],["Jag flyttar nästa vecka.","I am moving next week."]],"pit":[["I går har jag träffat henne.","I går träffade jag henne.","Finished time → preteritum."],["Jag bor här sedan 2019.","Jag har bott här sedan 2019.","Still true → perfekt."],["Han sa att han ska komma.","Han sa att han skulle komma.","Shift to futurum preteritum."]],"pr":[{"q":"Jag ___ i Sverige sedan 2019.","a":"har bott","e":"","o":["bodde","har bott","hade bott"]},{"q":"I går ___ vi middag.","a":"åt","e":"","o":["har ätit","åt","äter"]},{"q":"När jag kom hem ___ barnen redan ätit.","a":"hade","e":"","o":["har","hade","skulle"]},{"q":"Han sa att han ___ ringa senare.","a":"skulle","e":"","o":["ska","skulle","har"]},{"q":"Vilken tempusform är \"hade bott\"?","a":"pluskvamperfekt","e":"","o":["perfekt","pluskvamperfekt","preteritum"]},{"q":"Vilken tempusform är \"kommer att bli\"?","a":"futurum","e":"","o":["futurum","futurum preteritum","presens"]},{"q":"Skriv om i dåtid: Jag bor i Stockholm och ska flytta.","a":"Jag bodde i Stockholm och skulle flytta.","e":""},{"q":"Rätta: I går har jag träffat min syster.","a":"I går träffade jag min syster.","e":""}]},{"id":"vinf","u":3,"ti":"Verbformer 1: Infinitiv","en":"The infinitive: the dictionary form","ren":["The infinitive is the dictionary form: tala, köpa, skriva. Most end in -a. Short verbs end in another vowel: bo, gå, se, tro.","Use it after modal verbs, without att: Jag kan simma. Vi ska åka. Hon brukar cykla.","Use att + infinitive after most other verbs, after expressions like Det är viktigt and after prepositions: Jag tycker om att läsa. Det är svårt att vänta. Jag sparar för att resa.","The infinitive never changes: it is the same for jag, du, hon, vi and de, and it never shows time.","Memory rule: look at the word before. Kan, vill, ska, måste, bör, brukar or att in front means infinitive."],"rsv":["Infinitiv är grundformen, den som står i ordboken: tala, köpa, skriva. De flesta slutar på -a. Korta verb slutar på en annan vokal: bo, gå, se, tro.","Efter modala hjälpverb kommer infinitiv utan att: Jag kan simma. Vi ska åka. Hon brukar cykla.","Efter de flesta andra verb, efter uttryck som Det är viktigt och efter prepositioner kommer att + infinitiv: Jag tycker om att läsa. Jag sparar för att resa.","Infinitiv ändras aldrig. Den är likadan för alla personer och visar ingen tid.","Minnesregel: titta på ordet före. Står kan, vill, ska, måste, bör, brukar eller att före, ska verbet stå i infinitiv."],"tb":{"h":["Före verbet","Exempel"],"r":[["kan, vill, ska, måste, bör, får","Jag vill äta."],["brukar","Vi brukar äta klockan sex."],["att","Jag gillar att äta ute."],["för att","Jag sparar för att köpa en bil."],["utan att","Han gick utan att säga hej."],["Det är + adjektiv + att","Det är roligt att dansa."]]},"ex":[["Jag kan tala lite svenska.","I can speak a little Swedish."],["Vi måste gå nu.","We have to go now."],["Hon vill bli sjuksköterska.","She wants to become a nurse."],["Jag tycker om att laga mat.","I like cooking."],["Det är viktigt att sova bra.","It is important to sleep well."],["Vi sparar pengar för att resa.","We are saving money to travel."]],"pit":[["Jag kan talar svenska.","Jag kan tala svenska.","After a modal verb, use the infinitive."],["Jag vill att resa.","Jag vill resa.","Modal verbs take no att."],["Jag tycker om läsa.","Jag tycker om att läsa.","Tycka om is not a modal verb, so it needs att."]],"pr":[{"q":"Jag kan ___ svenska. (tala)","a":"tala","e":"","o":["tala","talar","talade","talat"]},{"q":"Vi måste ___ nu. (gå)","a":"gå","e":"","o":["går","gick","gå","gått"]},{"q":"Hon vill ___ läkare. (bli)","a":"bli","e":"","o":["blir","bli","blev","blivit"]},{"q":"Jag tycker om ___ laga mat.","a":"att","e":"Tycka om behöver att före infinitiv.","o":["att","och","som"]},{"q":"Det är viktigt ___ sova bra.","a":"att","e":"","o":["att","som","för"]},{"q":"Vilken mening är rätt?","a":"Jag brukar cykla till jobbet.","e":"","o":["Jag brukar cyklar till jobbet.","Jag brukar cykla till jobbet.","Jag brukar att cyklar till jobbet."]},{"q":"Vi sparar pengar för att ___ en bil. (köpa)","a":"köpa","e":"","o":["köper","köpa","köpte","köpt"]},{"q":"Skriv infinitiv: hon skriver","a":"skriva","e":""},{"q":"Skriv infinitiv: vi bodde","a":"bo","e":""},{"q":"Rätta: Jag ska åker till Göteborg.","a":"Jag ska åka till Göteborg.","e":""},{"q":"Rätta: Han vill att stanna hemma.","a":"Han vill stanna hemma.","e":""}],"ord":7.1},{"id":"vpres","u":3,"ti":"Verbformer 2: Presens","en":"The present tense: now, usually and planned","ren":["Presens is for now, for habits and for planned future: Jag jobbar nu. Jag jobbar varje dag. I morgon jobbar jag hemma.","Group 1: infinitive + r (tala → talar). Groups 2 and 4: remove -a and add -er (köpa → köper, skriva → skriver). Group 3: + r (bo → bor).","If the stem already ends in r, add nothing: köra → kör, höra → hör, lära → lär, göra → gör.","The form is the same for every person: jag, du, hon, vi, de talar. Learn the irregular ones: vara → är, ha → har, veta → vet, kunna → kan, vilja → vill.","Memory rule: presens ends in -r. Talar, köper, bor, kör, är, har. Only the modal verbs (kan, vill, ska, måste) and vet break the rule."],"rsv":["Presens används för nu, för vanor och för planerad framtid: Jag jobbar nu. Jag jobbar varje dag. I morgon jobbar jag hemma.","Grupp 1: infinitiv + r (tala → talar). Grupp 2 och 4: ta bort -a och lägg till -er (köpa → köper, skriva → skriver). Grupp 3: + r (bo → bor).","Om stammen redan slutar på r lägger man inte till något: köra → kör, höra → hör, göra → gör.","Formen är samma för alla personer. Lär dig de oregelbundna: vara → är, ha → har, veta → vet, kunna → kan, vilja → vill.","Minnesregel: presens slutar på -r. Bara de modala hjälpverben (kan, vill, ska, måste) och vet bryter regeln."],"tb":{"h":["Grupp","Infinitiv","Presens","Så gör du"],"r":[["1","tala","talar","+ r"],["2a","ställa","ställer","-a blir -er"],["2b","köpa","köper","-a blir -er"],["3","bo","bor","+ r"],["4","skriva","skriver","-a blir -er"],["stam på r","köra","kör","inget läggs till"],["oregelbundna","vara, ha, veta","är, har, vet","lär dig utantill"]]},"ex":[["Jag bor i Uppsala.","I live in Uppsala."],["Bussen går klockan åtta.","The bus leaves at eight."],["Hon kör till jobbet varje dag.","She drives to work every day."],["Vi flyttar nästa vecka.","We are moving next week."],["Barnen leker ute.","The children are playing outside."],["Vet du var stationen ligger?","Do you know where the station is?"]],"pit":[["Han körer bil.","Han kör bil.","The stem kör already ends in r."],["Jag är bo här.","Jag bor här.","Swedish has no \"am living\" form. Bor is enough."],["De talas svenska.","De talar svenska.","An -s ending makes the verb passive or reciprocal."]],"pr":[{"q":"Jag ___ i en lägenhet. (bo)","a":"bor","e":"","o":["bo","bor","bodde","bott"]},{"q":"Hon ___ bil till jobbet. (köra)","a":"kör","e":"","o":["körer","kör","köra","körde"]},{"q":"Vi ___ svenska varje dag. (tala)","a":"talar","e":"","o":["tala","talar","taler","talade"]},{"q":"Han ___ en bok just nu. (läsa)","a":"läser","e":"","o":["läsar","läser","läste","läsa"]},{"q":"___ du var stationen ligger? (veta)","a":"Vet","e":"","o":["Veter","Vet","Vetar","Visste"]},{"q":"Barnen ___ musik. (höra)","a":"hör","e":"","o":["hörer","hör","hörde","höra"]},{"q":"Vilken mening handlar om framtiden?","a":"Vi åker till Malmö i morgon.","e":"Presens + ett tidsord för framtid, till exempel i morgon, betyder framtid.","o":["Vi åker till Malmö i morgon.","Vi åkte till Malmö i går.","Vi har åkt till Malmö."]},{"q":"Skriv presens: stänga","a":"stänger","e":""},{"q":"Skriv presens: göra","a":"gör","e":""},{"q":"Skriv presens: vara","a":"är","e":""},{"q":"Rätta: Han körer till jobbet.","a":"Han kör till jobbet.","e":""}],"ord":7.2},{"id":"vpret","u":3,"ti":"Verbformer 3: Preteritum","en":"The past tense: finished, at a known time","ren":["Preteritum is for something finished at a time you know: I går köpte jag en jacka. 2019 flyttade vi hit. När jag var liten bodde jag i Bagdad.","Group 1: -ade (tala → talade). Group 2a: -de (ställa → ställde). Group 2b: -te after p, t, k, s, x (köpa → köpte, läsa → läste). Group 3: -dde (bo → bodde).","Group 4, the strong verbs, change the vowel and add no ending: skriva → skrev, sitta → satt, dricka → drack. Some are fully irregular: gå → gick, göra → gjorde, vara → var.","If the stem ends in d or t, it is not doubled before the ending: använda → använde, möta → mötte.","Memory rule: can you say when? Then it is preteritum. Words like i går, förra veckan, 2020 and när jag var liten point to preteritum."],"rsv":["Preteritum används när något är slut och man vet när: I går köpte jag en jacka. 2019 flyttade vi hit.","Grupp 1: -ade (tala → talade). Grupp 2a: -de (ställa → ställde). Grupp 2b: -te efter p, t, k, s, x (köpa → köpte). Grupp 3: -dde (bo → bodde).","Grupp 4, de starka verben, byter vokal och får ingen ändelse: skriva → skrev, sitta → satt, dricka → drack. Några är helt oregelbundna: gå → gick, göra → gjorde, vara → var.","Om stammen slutar på d eller t blir det inte dubbelt: använda → använde, möta → mötte.","Minnesregel: kan du säga när? Då är det preteritum. Ord som i går, förra veckan, 2020 och när jag var liten pekar på preteritum."],"tb":{"h":["Grupp","Infinitiv","Preteritum","Ändelse"],"r":[["1","tala","talade","-ade"],["2a","ställa","ställde","-de"],["2b","köpa","köpte","-te efter p, t, k, s, x"],["3","bo","bodde","-dde"],["4","skriva","skrev","ny vokal"],["4","dricka","drack","ny vokal"],["oregelbundna","gå, göra, vara","gick, gjorde, var","lär dig utantill"]]},"ex":[["I går tränade jag på gymmet.","Yesterday I worked out at the gym."],["Förra året köpte vi en bil.","Last year we bought a car."],["Hon bodde i Polen i tio år.","She lived in Poland for ten years."],["Vi gick på bio i lördags.","We went to the cinema on Saturday."],["När jag var barn läste jag mycket.","When I was a child I read a lot."]],"pit":[["Jag köpde en jacka.","Jag köpte en jacka.","After p, t, k, s and x the ending is -te."],["Jag har köpt en bil i går.","Jag köpte en bil i går.","I går is a finished time, so use preteritum without har."],["Han gådde hem.","Han gick hem.","Gå is irregular: gick."]],"pr":[{"q":"I går ___ jag hela dagen. (arbeta)","a":"arbetade","e":"","o":["arbetar","arbetade","arbetat","arbetde"]},{"q":"Förra veckan ___ hon en ny dator. (köpa)","a":"köpte","e":"","o":["köpde","köpte","köpade","köper"]},{"q":"Vi ___ i Göteborg i fem år. (bo)","a":"bodde","e":"","o":["bodde","bode","boade","bott"]},{"q":"Han ___ hem klockan sex. (gå)","a":"gick","e":"","o":["gådde","gick","gått","går"]},{"q":"De ___ ett brev till kommunen. (skriva)","a":"skrev","e":"","o":["skrivade","skrev","skrivit","skriver"]},{"q":"Jag ___ en bok i somras. (läsa)","a":"läste","e":"","o":["läsde","läste","läsade","läst"]},{"q":"Vilken mening är rätt?","a":"I går såg jag en bra film.","e":"I går är en avslutad tid. Då används preteritum.","o":["I går har jag sett en bra film.","I går såg jag en bra film.","I går ser jag en bra film."]},{"q":"Skriv preteritum: använda","a":"använde","e":""},{"q":"Skriv preteritum: dricka","a":"drack","e":""},{"q":"Skriv preteritum: göra","a":"gjorde","e":""},{"q":"Rätta: Jag har flyttat hit 2021.","a":"Jag flyttade hit 2021.","e":"Med ett årtal används preteritum."}],"ord":7.3},{"id":"vsup","u":3,"ti":"Verbformer 4: Supinum","en":"The supine: the form after har and hade","ren":["Supinum is the form you use after har or hade. It never stands alone: jag har talat, vi hade ätit.","Perfekt = har + supinum. Use it when something has happened but you do not say when, or when it is still true now: Jag har varit i Kiruna. Vi har bott här sedan 2021.","Pluskvamperfekt = hade + supinum. Use it for something that happened before another past event: När jag kom hade filmen redan börjat.","Forms: group 1 -at (talat), group 2 -t (ställt, köpt), group 3 -tt (bott), group 4 -it (skrivit, druckit). Irregular: gå → gått, vara → varit, göra → gjort.","Memory rule: har or hade before the verb means supinum, and supinum almost always ends in -t.","Do not mix it up with the participle after är or blir: Jag har stängt dörren (supinum). Dörren är stängd (participle)."],"rsv":["Supinum är formen efter har eller hade. Den står aldrig ensam: jag har talat, vi hade ätit.","Perfekt = har + supinum. Det har hänt, men man säger inte när, eller så gäller det fortfarande: Jag har varit i Kiruna. Vi har bott här sedan 2021.","Pluskvamperfekt = hade + supinum. Det hände före något annat i dåtid: När jag kom hade filmen redan börjat.","Former: grupp 1 -at (talat), grupp 2 -t (ställt, köpt), grupp 3 -tt (bott), grupp 4 -it (skrivit, druckit). Oregelbundna: gå → gått, vara → varit, göra → gjort.","Minnesregel: står har eller hade före verbet är det supinum, och supinum slutar nästan alltid på -t.","Blanda inte ihop med particip efter är eller blir: Jag har stängt dörren (supinum). Dörren är stängd (particip)."],"tb":{"h":["Grupp","Infinitiv","Supinum","Perfekt"],"r":[["1","tala","talat","har talat"],["2a","ställa","ställt","har ställt"],["2b","köpa","köpt","har köpt"],["3","bo","bott","har bott"],["4","skriva","skrivit","har skrivit"],["4","dricka","druckit","har druckit"],["oregelbundna","gå, vara, göra","gått, varit, gjort","har gått"]]},"ex":[["Jag har aldrig varit i Norrland.","I have never been to Norrland."],["Har du ätit?","Have you eaten?"],["Vi har bott här sedan 2021.","We have lived here since 2021."],["Hon hade redan gått när jag kom.","She had already left when I came."],["Jag har glömt min nyckel.","I have forgotten my key."]],"pit":[["Jag har gick hem.","Jag har gått hem.","After har use the supine, not preteritum."],["Jag har skriven ett brev.","Jag har skrivit ett brev.","Skriven is the participle. After har use skrivit."],["Han talat svenska.","Han har talat svenska.","The supine never stands alone."]],"pr":[{"q":"Jag har ___ hela dagen. (arbeta)","a":"arbetat","e":"","o":["arbetade","arbetat","arbeta","arbetar"]},{"q":"Har du ___ filmen? (se)","a":"sett","e":"","o":["såg","sett","se","sedd"]},{"q":"Vi har ___ här i tre år. (bo)","a":"bott","e":"","o":["bodde","bott","bor","bo"]},{"q":"Hon har ___ ett mejl. (skriva)","a":"skrivit","e":"","o":["skrev","skrivit","skriven","skrivat"]},{"q":"När vi kom hade de redan ___. (äta)","a":"ätit","e":"","o":["åt","ätit","ätat","äten"]},{"q":"Jag har ___ min plånbok. (glömma)","a":"glömt","e":"","o":["glömde","glömt","glömd","glömmat"]},{"q":"Vilken mening är rätt?","a":"Jag har varit i Kiruna.","e":"","o":["Jag har var i Kiruna.","Jag har varit i Kiruna.","Jag har vara i Kiruna."]},{"q":"Vilket ord är supinum?","a":"druckit","e":"","o":["drack","druckit","dricker","druckna"]},{"q":"Skriv supinum: ta","a":"tagit","e":""},{"q":"Skriv supinum: göra","a":"gjort","e":""},{"q":"Rätta: Hon har gick hem.","a":"Hon har gått hem.","e":""}],"ord":7.4},{"id":"vimp","u":3,"ti":"Verbformer 5: Imperativ","en":"The imperative: commands, instructions and invitations","ren":["Imperativ is for commands, instructions and invitations: Kom hit! Stäng dörren! Ta en kaka!","Take the infinitive and remove the last -a: stänga → stäng, skriva → skriv, köpa → köp, köra → kör.","Group 1 keeps its -a, because the a belongs to the stem: vänta → vänta!, öppna → öppna!, tala → tala! Short verbs stay the same: bo!, gå!, se!","The same form is used for one person and many. For a negative command, put inte after the verb: Glöm inte nycklarna! Spring inte!","Make it polite with gärna or snälla, or ask a question instead: Sätt dig gärna. Kan du stänga fönstret?","Memory rule: imperativ is the shortest form of the verb, with no -r. Say the infinitive and cut the -a if you can."],"rsv":["Imperativ används för uppmaningar, instruktioner och inbjudningar: Kom hit! Stäng dörren! Ta en kaka!","Ta infinitiv och ta bort sista -a: stänga → stäng, skriva → skriv, köpa → köp, köra → kör.","Grupp 1 behåller -a, eftersom a hör till stammen: vänta → vänta!, öppna → öppna! Korta verb är likadana: bo!, gå!, se!","Samma form för en och flera personer. Negativ uppmaning: inte efter verbet. Glöm inte nycklarna!","Gör det artigt med gärna eller snälla, eller ställ en fråga: Sätt dig gärna. Kan du stänga fönstret?","Minnesregel: imperativ är verbets kortaste form, utan -r. Säg infinitiven och klipp bort -a om det går."],"tb":{"h":["Grupp","Infinitiv","Imperativ","Exempel"],"r":[["1","vänta","vänta!","Vänta här!"],["2a","stänga","stäng!","Stäng fönstret!"],["2b","köpa","köp!","Köp bröd!"],["3","gå","gå!","Gå till höger!"],["4","skriva","skriv!","Skriv ditt namn!"],["stam på r","köra","kör!","Kör försiktigt!"],["negation","glömma","glöm inte!","Glöm inte väskan!"]]},"ex":[["Ring mig i kväll!","Call me tonight!"],["Läs texten två gånger.","Read the text twice."],["Ta med legitimation.","Bring ID."],["Glöm inte att boka tid.","Do not forget to book an appointment."],["Sätt dig gärna här.","Please sit here."],["Vänta lite!","Wait a moment!"]],"pit":[["Stänga dörren!","Stäng dörren!","Cut the -a: stäng."],["Väntar här!","Vänta här!","The imperative has no -r."],["Inte glöm!","Glöm inte!","Inte comes after the verb."]],"pr":[{"q":"___ dörren, tack! (stänga)","a":"Stäng","e":"","o":["Stänga","Stäng","Stänger","Stängde"]},{"q":"___ här en stund! (vänta)","a":"Vänta","e":"","o":["Vänt","Vänta","Väntar","Väntade"]},{"q":"___ ditt namn här. (skriva)","a":"Skriv","e":"","o":["Skriva","Skriv","Skriver","Skrev"]},{"q":"___ försiktigt! (köra)","a":"Kör","e":"","o":["Köra","Kör","Körer","Körde"]},{"q":"Säg det negativt: Glöm nycklarna!","a":"Glöm inte nycklarna!","e":"","o":["Inte glöm nycklarna!","Glöm inte nycklarna!","Glömmer inte nycklarna!"]},{"q":"Vilken mening är artigast?","a":"Kan du stänga fönstret?","e":"","o":["Stäng fönstret!","Kan du stänga fönstret?","Fönstret, nu!"]},{"q":"Skriv imperativ: läsa","a":"läs","e":""},{"q":"Skriv imperativ: öppna","a":"öppna","e":""},{"q":"Skriv imperativ: gå","a":"gå","e":""},{"q":"Rätta: Tar med passet!","a":"Ta med passet!","e":""}],"ord":7.5},{"id":"vform","u":3,"ti":"Verbformer: vilken ska jag välja?","en":"Choosing the right verb form, with memory rules","ren":["Look at the word before the verb. Kan, vill, ska, måste, brukar or att means infinitiv: Jag vill äta.","Har or hade before the verb means supinum, and it ends in -t: Jag har ätit.","No helper verb, and it happens now, usually or soon: presens, it ends in -r: Jag äter.","No helper verb, and it happened at a finished time you can name: preteritum: I går åt jag.","Telling someone to do something: imperativ, the short form with no -r: Ät nu!","Learn every new verb as a chant of its four forms: äta – äter – åt – ätit."],"rsv":["Titta på ordet före verbet. Kan, vill, ska, måste, brukar eller att betyder infinitiv: Jag vill äta.","Har eller hade före verbet betyder supinum, och det slutar på -t: Jag har ätit.","Inget hjälpverb, och det händer nu, brukar hända eller ska hända snart: presens, det slutar på -r: Jag äter.","Inget hjälpverb, och det hände vid en avslutad tid som du kan säga: preteritum: I går åt jag.","Du säger åt någon att göra något: imperativ, den korta formen utan -r: Ät nu!","Lär dig varje nytt verb som en ramsa med fyra former: äta – äter – åt – ätit."],"tb":{"h":["Fråga dig","Form","Exempel"],"r":[["Står kan, vill, ska, måste eller att före?","infinitiv","Jag ska äta."],["Står har eller hade före?","supinum","Jag har ätit."],["Nu, ofta eller alltid?","presens","Jag äter nu."],["Kan du säga när det var?","preteritum","Jag åt i går."],["Säger du åt någon?","imperativ","Ät!"]]},"ex":[["Jag brukar äta lunch klockan tolv.","I usually have lunch at twelve."],["I dag äter jag på restaurang.","Today I am eating at a restaurant."],["I går åt jag hemma.","Yesterday I ate at home."],["Jag har redan ätit.","I have already eaten."],["Ät mer grönsaker!","Eat more vegetables!"]],"pit":[["Jag har åt.","Jag har ätit.","After har use the supine."],["I går har jag ätit pizza.","I går åt jag pizza.","A finished time takes preteritum."],["Jag vill äter.","Jag vill äta.","After a modal verb use the infinitive."]],"pr":[{"q":"Jag vill ___ en ny jacka. (köpa)","a":"köpa","e":"","o":["köper","köpa","köpte","köpt"]},{"q":"I fjol ___ vi till Sverige. (flytta)","a":"flyttade","e":"","o":["flyttar","flyttade","flyttat","flytta"]},{"q":"Hon har ___ här i två år. (jobba)","a":"jobbat","e":"","o":["jobbade","jobbat","jobbar","jobba"]},{"q":"Varje morgon ___ jag kaffe. (dricka)","a":"dricker","e":"","o":["dricka","drack","dricker","druckit"]},{"q":"___ hit och titta! (komma)","a":"Kom","e":"","o":["Komma","Kom","Kommer","Kommit"]},{"q":"Jag har aldrig ___ i Norge. (vara)","a":"varit","e":"","o":["var","varit","vara","är"]},{"q":"Har du ___ läxan? (göra)","a":"gjort","e":"","o":["gjorde","gjort","göra","gör"]},{"q":"Han ___ svenska på kvällarna. (läsa)","a":"läser","e":"","o":["läsa","läser","läste","läst"]},{"q":"Skriv rätt form: Vi brukar ___ på söndagar. (vila)","a":"vila","e":""},{"q":"Skriv rätt form: Hon ___ en roman förra året. (skriva)","a":"skrev","e":""},{"q":"Skriv rätt form: I går ___ jag hem tidigt. (gå)","a":"gick","e":""},{"q":"Rätta: Jag har köpte en ny telefon.","a":"Jag har köpt en ny telefon.","e":"Efter har kommer supinum.","acc":["Jag köpte en ny telefon."]}],"ord":7.6}]};</script>

  const lv=Math.min(2,P.done[st.id]||0); const qs=[];
  if(st.kind==='words'){const ws=st.ws;
    if(lv===0){const a=ws.slice(0,4),b=ws.slice(4);
      for(const grp of [a,b]){if(!grp.length)continue;grp.forEach(w=>{qs.push(Q.intro(w));qs.push(Q.svEn(w))});if(grp.length>=3)qs.push(Q.match(grp))}

    else{shuffle(ws).forEach(w=>qs.push(wordQ(w,lv)));qs.push(Q.match(shuffle(ws).slice(0,5)));shuffle(ws).forEach(w=>qs.push(wordQ(w,2)))}}
  else if(st.kind==='sent'){st.ss.forEach(s=>qs.push(Q.build(s,false)));shuffle(st.ss).slice(0,3).forEach(s=>qs.push(Q.sMc(s)));if(TTS)shuffle(st.ss).slice(0,3).forEach(s=>qs.push(Q.build(s,true)))}
  else if(st.kind==='gram'){qs.push({type:'gram',g:st.g});st.g.pr.forEach((p,j)=>qs.push(gramQ(st.g,j)))}
  else if(st.kind==='note'){qs.push({type:'note',l:st.l});const tn=Object.entries(TD).find(([n,c])=>c.u===st.ui);}
  else if(st.kind==='table'){for(let i=0;i<10;i++)qs.push(Q.table(st.tn))}
  else if(st.kind==='read'){qs.push({type:'read',r:st.r});const txt=norm(st.r.sv.join(' '));
    const hits=shuffle(UW[st.ui].filter(w=>txt.includes(norm(w.w))&&w.w.length>3)).slice(0,6);hits.forEach(w=>qs.push(Math.random()<.5?Q.svEn(w):Q.enSv(w)));
    const os=UX[st.ui].filter(x=>x.k==='open').slice(0,0);os.forEach(x=>qs.push(Q.ex(x)))}
  else if(st.kind==='ex'){st.xs.forEach(x=>qs.push(Q.ex(x)))}
  else if(st.kind==='check'){const ws=shuffle(UW[st.ui]).slice(0,10);ws.forEach(w=>qs.push(wordQ(w,2)));
    shuffle(US[st.ui]).slice(0,3).forEach(s=>qs.push(Q.build(s,false)));
    shuffle(UX[st.ui].filter(x=>x.k!=='open')).slice(0,4).forEach(x=>qs.push(Q.ex(x)))}
  return qs.filter(Boolean);
}

/* ---------- sheets ---------- */
function sheet(html,onMount){const s=document.createElement('div');s.className='sheet';s.innerHTML=`<div class="panel" role="dialog" aria-modal="true">${html}</div>`;
  s.addEventListener('click',e=>{if(e.target===s)s.remove()});document.body.appendChild(s);onMount&&onMount(s.firstChild,()=>s.remove());return s}
function openAbout(){sheet(`<div class="row"><h2>Om SFI Kompis</h2><button class="iconbtn" data-close aria-label="Stäng">${I.x}</button></div><div class="aboutt"><p>SFI Kompis är ett privat studieprojekt. Appen hjälper dig att öva på kursens teman, ord och grammatik, kapitel för kapitel, och på Sverige i fokus inför medborgarskapsprovet.</p><p>Appen är ett komplement till kursboken och lektionerna. Den ersätter inte kursmaterialet. Läs texterna och gör uppgifterna i boken som vanligt.</p><p>SFI Kompis är inte kopplad till din skola, till kursbokens förlag eller till Skolverket.</p><p>Övningsproven är nyskrivna och följer bara upplägget i det nationella provet. Frågorna om Sverige i fokus bygger på utbildningsmaterialet från UHR och Skolverket (2026), men de är inte provets riktiga frågor.</p><p>Appen kan innehålla fel. Hittar du något som inte stämmer, säg gärna till.</p>${syncOn?'':'<p>Dina framsteg sparas bara på din telefon. Appen har inga konton och samlar inte in några uppgifter om dig.</p>'}</div><button class="btn block" data-close>Stäng</button>`,(p,close)=>$$('[data-close]',p).forEach(b=>b.onclick=close))}

function mockItems(pg){// list of scorable items on a page: [{a, o, q}]

function buildMock(mocks,parts){const pages=[];
  for(const part of parts){pages.push({kind:'intro',part});
    for(const m of mocks){
      if(part==='lasaA'||part==='lasaB'||part==='hora')m[part].forEach(t=>pages.push({kind:part==='hora'?'clip':'text',part,t,m,mopts:t.match?shuffle([...t.match.map(x=>x.a),...t.extra]):null,plays:0}));
      if(part==='skriva')m.skriva.forEach(t=>pages.push({kind:'write',part,t,m}));
      if(part==='tala')m.tala.forEach(t=>pages.push({kind:'talk',part,t,m}));
    }}
  pages.forEach(p=>{p.items=p.kind==='text'||p.kind==='clip'?mockItems(p):[];p.sel=p.items.map(()=>null)});
  return pages}

  let s = '';

  }
  return s;
}

function trS(t){if(Object.prototype.hasOwnProperty.call(EN,t))return EN[t];
  for(const [r,f] of ENRX){const m=t.match(r);if(m)return typeof f==='function'?f(m):t.replace(r,f)}
  if(t.includes(' · ')){const ps=t.split(' · ');const tp=ps.map(p=>trS(p));if(tp.some(x=>x!=null))return ps.map((p,i)=>tp[i]!=null?tp[i]:p).join(' · ')}
  return null}

const TRA=['placeholder','aria-label','title'];
function trText(n){const el=n.parentElement;if(!el||el.closest(NOTR))return;const raw=n.nodeValue;const t=raw.trim();if(!t||t.length>400)return;const r=trS(t);if(r!=null&&r!==t)n.nodeValue=raw.replace(t,r)}
function trTree(root){if(P.lang!=='en'||!root)return;
  if(root.nodeType===3)return trText(root);if(root.nodeType!==1)return;
  const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);let n;const ns=[];while(n=w.nextNode())ns.push(n);ns.forEach(trText);
  const els=[root,...root.querySelectorAll('[placeholder],[aria-label],[title]')];
  els.forEach(e=>{if(!e.getAttribute||e.closest(NOTR))return;TRA.forEach(a=>{const v=e.getAttribute(a);if(v){const r=trS(v.trim());if(r!=null&&r!==v)e.setAttribute(a,r)}})})}
const LMO=new MutationObserver(ms=>{if(P.lang!=='en')return;for(const m of ms){if(m.type==='characterData')trText(m.target);else m.addedNodes.forEach(trTree)}});
LMO.observe(document.body,{childList:true,subtree:true,characterData:true});
